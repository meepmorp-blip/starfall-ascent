<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starfall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Starfall Ascent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: full-bleed canvas arena (the districts of Meridian); registry-form paper panels float over it between rooms. Single dark look on purpose. */
:root{
  --void:#141B16; --night:#1D2620; --panel:#2B2219; --panel-2:#3A2E21; --line:rgba(243,230,200,.22); --scrim:rgba(16,20,14,.78);
  --paper:#F6EBD2; --paper-2:#EADBB8; --ash:#C9BFA8;
  --ink:#3B2617; --ink-soft:#7A5F47; --ink-line:rgba(59,38,23,.22); --shadow:rgba(0,0,0,.55);
  --danger:#FF4D5E; --seal:#B3261E; --seal-ok:#2F5D50; --res-ink:#1F6F8B;
  --gold:#FFD166; --sodium:#FFB65C; --moon:#C7D5E8; --mercury:#59DDEB; --venus:#FF79B0; --mars:#FF9F43; --jupiter:#E9C46A; --saturn:#A78BFA; --uranus:#5FE0C8; --neptune:#7C9CFF;
  --earth:#C9A66B; --water:#6EC3FF; --air:#59DDEB; --fire:#FF9F43; --hp:#7BE0A8; --serpent:#9BE37A; --lime:#C8E86B; --wax:#F1E3C4; --sun:#FFE08A; --star-ink:#8A5A00;
  --role-dps:#FF9F43; --role-sub:#59DDEB; --role-shield:#C9A66B; --role-heal:#7BE0A8; --role-burst:#E9C46A;
  --f-display:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-form:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--paper);overflow:hidden;font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe-probe{position:fixed;inset:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

#overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--scrim);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay[hidden],[hidden]{display:none!important}
#overlay>*{margin:auto}
#overlay.mode-dialog{background:transparent;padding:0}
#overlay.mode-title{background:radial-gradient(ellipse at 50% 55%,var(--scrim) 0%,var(--scrim) 35%,transparent 80%)}

/* Home */
.title-card{text-align:center;max-width:580px;display:flex;flex-direction:column;align-items:center;gap:10px}
.eyebrow{margin:0;font:600 11px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
.title-card h1{margin:0;font:700 clamp(46px,9vw,88px)/.9 var(--f-display);letter-spacing:.2em;color:var(--paper);text-indent:.2em}
.title-card .sub{margin:0;font:600 clamp(18px,3vw,26px) var(--f-display);letter-spacing:.35em;color:var(--sodium);text-indent:.35em}
.title-card .blurb{margin:4px 0 2px;font:15px/1.45 var(--f-form);color:var(--paper);max-width:46ch}
.title-card .hint{margin:0;font:12px/1.5 var(--f-ui);color:var(--ash);max-width:60ch}
.title-card .hint,.title-card .blurb{text-shadow:0 1px 3px var(--void),0 0 8px var(--void)}
.home-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-row .btn{min-width:150px;font-size:14px;padding:12px 22px}
.btn.light{background:var(--paper);color:var(--void);border-color:var(--paper)}
.btn.outline{background:transparent;color:var(--paper);border-color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* Dialogue */
.dlg-wrap{position:absolute;inset:0;margin:0!important;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--scrim) 0%,transparent 70%)}
.dlg{width:100%;max-width:700px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sodium);padding:12px 16px 10px;display:flex;flex-direction:column;gap:6px}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:18px}
.who{font:600 11px var(--f-ui);letter-spacing:.18em;text-transform:uppercase}
.say{margin:0;font:16px/1.45 var(--f-form);color:var(--paper);min-height:2.9em;flex:1;min-width:0}
.dlg-body{display:flex;gap:12px;align-items:flex-start}
.face{flex:none;width:44px;height:44px}
.face canvas{width:44px;height:44px;border-radius:2px;display:block}
.mono{display:flex;width:44px;height:44px;align-items:center;justify-content:center;border:1.5px solid;font:700 22px var(--f-display);border-radius:2px;background:var(--night)}
.say.narr{color:var(--ash);font-style:italic}
.more{font:11px var(--f-ui);color:var(--ash);text-align:right;letter-spacing:.08em}
.skip{background:transparent;border:1px solid var(--line);color:var(--ash);font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;border-radius:2px}

/* Party select */
.select{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:10px}
.select-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.select-head h2{margin:0;font:700 26px/1 var(--f-display);color:var(--paper)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:6px 10px;border-radius:2px;font:inherit;cursor:pointer;min-width:0}
.slot.empty{border-style:dashed;color:var(--ash);grid-template-columns:1fr;min-height:58px;cursor:default}
.slot canvas{grid-row:span 2;width:44px;height:44px;background:var(--night);border-radius:2px}
.slot .nm{font:700 16px/1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .rl{font:600 9px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.slot:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.select-body{display:grid;grid-template-columns:minmax(210px,250px) 1fr;gap:12px;align-items:start}
@media (max-width:640px){.select-body{grid-template-columns:1fr}.slots{grid-template-columns:1fr}}
.select-body>*{min-width:0}
.roster{display:flex;flex-direction:column;gap:6px;min-width:0}
.card{display:grid;grid-template-columns:48px 1fr;gap:2px 10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:6px 10px;cursor:pointer;border-radius:2px;font:inherit;min-width:0;position:relative}
.card[aria-pressed="true"]{border-color:var(--sodium);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--sodium)}
.card:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.card canvas{grid-row:span 2;width:48px;height:48px;background:var(--night);border-radius:2px}
.card .nm{font:700 18px/1 var(--f-display)}
.card .rl{font:600 9px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.badge{position:absolute;top:6px;right:8px;font:600 9px var(--f-ui);letter-spacing:.1em;color:var(--void);background:var(--sodium);padding:1px 5px;border-radius:2px}
.note{margin:0;font:12px var(--f-ui);color:var(--sodium);min-height:1.2em}
.role-dps{color:var(--role-dps)} .role-sub{color:var(--role-sub)} .role-shield{color:var(--role-shield)} .role-heal{color:var(--role-heal)} .role-burst{color:var(--role-burst)}
.dossier{max-width:none}
.dossier .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.bigthree{display:flex;gap:6px 14px;flex-wrap:wrap;font:600 11px var(--f-ui);letter-spacing:.06em;color:var(--ink-soft);margin:2px 0 8px}
.bigthree b{color:var(--ink)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px;margin:0 0 10px}
.stat{display:flex;flex-direction:column;gap:3px;font:600 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{display:flex;justify-content:space-between;gap:6px}
.stat .v b{color:var(--ink);font-variant-numeric:tabular-nums}
.pips5{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.pips5 i{height:5px;background:var(--ink-line)}
.pips5 i.on{background:var(--ink)}
.mech{margin:0 0 8px;padding:6px 10px;border-left:3px solid var(--ink);background:var(--paper-2);font:13px/1.4 var(--f-form)}
.skills{display:flex;flex-direction:column;gap:8px}
.skill{border-top:1px solid var(--ink-line);padding-top:7px;display:flex;flex-direction:column;gap:3px}
.skill .top{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.skill .kind{font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.skill .sn{font:700 17px/1.1 var(--f-display);color:var(--ink)}
.skill p{margin:0;font:13px/1.4 var(--f-form);color:var(--ink)}
.skill p b{font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chip{font:600 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);padding:1px 6px;color:var(--ink);border-radius:2px;white-space:nowrap}
.chip.el-fire{border-color:var(--mars);background:var(--mars)} .chip.el-water{border-color:var(--water);background:var(--water)}
.chip.el-air{border-color:var(--air);background:var(--air)} .chip.el-earth{border-color:var(--earth);background:var(--earth)}

/* Registry forms */
.form{background:var(--paper);color:var(--ink);width:100%;max-width:660px;padding:14px 18px 16px;position:relative;box-shadow:0 18px 50px var(--shadow);border-radius:2px}
.form-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font:600 10px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--ink-line);padding-bottom:6px;margin-bottom:10px}
.form h2{margin:0 0 4px;font:700 24px/1.1 var(--f-display);text-wrap:balance;padding-right:130px}
.form .lede{margin:0 0 10px;font:14px/1.4 var(--f-form);color:var(--ink);max-width:62ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.choice{text-align:left;background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;border-radius:2px}
.choice:hover{background:var(--paper-2)}
.choice:focus-visible,.btn:focus-visible,.skip:focus-visible,.seg button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.choice .tag{font:600 10px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.choice h3{margin:0;font:700 19px/1.1 var(--f-display);display:flex;align-items:center;gap:8px}
.choice p{margin:0;font:13px/1.35 var(--f-form)}
.choice .reward{color:var(--ink-soft)}
.choice .res{font:600 10px/1.3 var(--f-ui);letter-spacing:.06em;color:var(--res-ink);text-transform:uppercase}
.choice .key{font:600 10px var(--f-ui);color:var(--ink-soft);margin-left:auto}
.glyph{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",var(--f-display);font-size:24px;line-height:1;width:1.2em;text-align:center}
.stamp{position:absolute;top:34px;right:16px;border:3px solid currentColor;padding:2px 10px;font:700 15px var(--f-ui);letter-spacing:.14em;transform:rotate(-9deg);opacity:.88;pointer-events:none}
.stamp.ok{color:var(--seal-ok)} .stamp.bad{color:var(--seal)}
.btn{font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.select .row{margin-top:0;justify-content:flex-end}
.serpent{margin:12px 0 0;font:13px/1.4 var(--f-form);color:var(--ink-soft)}
.serpent b{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0 4px;font:11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats b{display:block;font:700 20px var(--f-display);color:var(--ink);letter-spacing:0;text-transform:none}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--ink);border:0;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seglabel{font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* Builds: Recollection + Star Fragments */
.vault{width:100%;max-width:1060px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:grid;grid-template-columns:36px 1fr;gap:0 8px;align-items:center;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:5px 9px;border-radius:2px;cursor:pointer;font:inherit;text-align:left;min-width:150px;flex:1}
.tab[aria-pressed="true"]{border-color:var(--sodium);box-shadow:inset 0 -3px 0 var(--sodium)}
.tab:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.tab canvas{grid-row:span 3;width:36px;height:36px}
.tab .nm{font:700 15px/1 var(--f-display)}
.tab .lv{font:600 9px var(--f-ui);letter-spacing:.08em;color:var(--ash);text-transform:uppercase}
.xpbar{height:4px;background:var(--line);margin-top:2px}
.xpbar i{display:block;height:100%;background:var(--sodium)}
.vault-body{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:10px;align-items:start}
@media (max-width:720px){.vault-body{grid-template-columns:1fr}}
.vault-body>*{min-width:0}
.slotcard{border:1.5px solid var(--ink);padding:7px 9px;display:flex;flex-direction:column;gap:2px;border-radius:2px;margin-top:6px;background:transparent;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.slotcard.empty{border-style:dashed;color:var(--ink-soft);font:12px var(--f-form)}
.slotcard:focus-visible,.fcard:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.miles{margin:4px 0 2px;padding:0;list-style:none;font:12px/1.5 var(--f-form)}
.miles li{color:var(--ink-soft)} .miles li.on{color:var(--seal-ok)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.fcard{text-align:left;border:1.5px solid var(--ink-line);background:transparent;color:var(--ink);padding:6px 8px;border-radius:2px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:1px;min-width:0}
.fcard[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.fcard .t,.slotcard .t{font:700 15px/1.1 var(--f-display);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.fcard .glyph,.slotcard .glyph,.detail .glyph{font-size:16px;width:auto}
.s{font:600 9px/1.35 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.rar0{color:var(--ink-soft)} .rar1{color:var(--res-ink)} .rar2{color:var(--star-ink)}
.asp{font:600 9px/1.35 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--seal-ok)}
.detail{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 8px;border-radius:2px;display:flex;flex-direction:column;gap:3px}
.detail h3{margin:0;font:700 19px/1.1 var(--f-display)}
.detail ul{margin:4px 0 0;padding-left:18px;font:13px/1.45 var(--f-form)}
.dust{font:600 12px var(--f-ui);color:var(--star-ink);letter-spacing:.04em}
/* Builds v2: icons + hierarchy */
.ic{display:inline-flex;width:1em;height:1em;flex:none;vertical-align:-.14em}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill svg{fill:currentColor;stroke:none}
.el-Fire{--el:#B5530F;--el-bg:rgba(255,159,67,.18)} .el-Earth{--el:#7A5A22;--el-bg:rgba(201,166,107,.22)}
.el-Air{--el:#11717C;--el-bg:rgba(89,221,235,.18)} .el-Water{--el:#1F5F9B;--el-bg:rgba(110,195,255,.2)}
.gem{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center}
.gem svg{position:absolute;inset:0;width:100%;height:100%}
.gem .sg{position:relative;font:700 17px/1 var(--f-ui);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);margin-top:2px}
.gem .rb{position:absolute;right:-4px;top:-5px;font-size:13px;color:var(--star-ink);text-shadow:0 0 4px var(--gold)}
.gem.big{width:58px;height:58px}.gem.big .sg{font-size:24px}
.sect{display:flex;align-items:center;gap:6px;font:700 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 4px;border-bottom:1px solid var(--ink-line);padding-bottom:3px}
.sect .ic{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 10px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:999px;border:1px solid var(--ink-line);color:var(--ink);white-space:nowrap}
.chip.r1{border-color:var(--res-ink);color:var(--res-ink)} .chip.r2{border-color:var(--star-ink);color:var(--star-ink);background:rgba(255,209,102,.3)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.asp-on{border-color:var(--seal-ok);color:var(--seal-ok);background:rgba(47,93,80,.1)}
.chip.asp-ex{background:var(--seal-ok);color:#fff;border-color:var(--seal-ok)}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pips{display:inline-flex;gap:2px}.pips i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-soft)}.pips i.f{background:var(--ink);border-color:var(--ink)}
.fcard{flex-direction:row;gap:8px;align-items:center;border-left:4px solid var(--el,var(--ink-line));padding:7px 8px}
.fcard .bd{display:flex;flex-direction:column;gap:4px;min-width:0}
.fcard .nm2{font:700 16px/1 var(--f-display)}
.fcard[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.fgrid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.slotcard{flex-direction:row;align-items:center;gap:10px;border-left:4px solid var(--el,var(--ink));padding:8px 10px}
.slotcard .slot-ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--sun);font-size:19px}
.slotcard.empty .slot-ic{background:transparent;border:1.5px dashed var(--ink-soft);color:var(--ink-soft)}
.slotcard .bd{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.slotcard .k{font:700 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;gap:6px}
.slotcard .nm2{font:700 17px/1.05 var(--f-display);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slotcard .sstat{font:700 12px var(--f-ui);color:var(--ink);display:flex;align-items:center;gap:5px}
.vault-body>*{box-sizing:border-box}
.slotcard.empty .hint{font:12px/1.3 var(--f-form);color:var(--ink-soft)}
.miles li{display:flex;gap:6px;align-items:baseline;padding:2px 0}

.miles li .ic{color:var(--ink-soft)} .miles li.on .ic{color:var(--seal-ok)}
.bonus{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px}
.bonus span{display:flex;align-items:center;gap:5px;font:600 12px var(--f-ui);background:rgba(27,26,46,.06);padding:4px 6px;border-radius:2px}
.bonus .ic{color:var(--ink-soft)}
.bigstat{display:flex;align-items:baseline;gap:8px;margin:2px 0}
.bigstat b{font:700 34px/1 var(--f-display)} .bigstat span{font:600 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.detail{border-left:5px solid var(--el,var(--ink));gap:6px}
.detail .top{display:flex;gap:12px;align-items:center}
.detail .main-stat{display:flex;align-items:center;gap:8px;font:700 20px var(--f-display);padding:6px 8px;background:var(--el-bg,rgba(27,26,46,.06));border-radius:2px}

.trait{display:grid;grid-template-columns:22px 1fr;gap:0 6px;align-items:start;padding:3px 0}

.trait b{font:700 14px var(--f-display);display:block}.trait span{font:12px/1.35 var(--f-form);color:var(--ink-soft)}
.trait em{font:600 9px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--seal-ok);font-style:normal;margin-left:4px}
.aspbox{display:flex;gap:8px;align-items:center;font:12px/1.35 var(--f-form);padding:6px 8px;border:1px dashed var(--ink-line);border-radius:2px}
.aspbox .gl{font:700 22px/1 var(--f-ui);color:var(--seal-ok);width:26px;text-align:center}
.aspbox.none .gl{color:var(--ink-soft)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:4px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;text-align:left;font:inherit}
.tool .tn{display:flex;align-items:center;gap:5px;font:700 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.tool .td{font:11px/1.25 var(--f-form);color:var(--ink-soft)}
.tool .tc{display:flex;align-items:center;gap:3px;font:700 11px var(--f-ui);color:var(--star-ink)}
.tool.primary{background:var(--ink);color:var(--paper)}.tool.primary .td{color:var(--paper-2)}
.tool[disabled]{opacity:.4;cursor:default}
.tool:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.dustpill{display:inline-flex;align-items:center;gap:5px;font:700 13px var(--f-ui);color:var(--star-ink);background:rgba(255,209,102,.3);border:1px solid var(--star-ink);padding:4px 9px;border-radius:999px}
.rw{display:flex;flex-direction:column;gap:6px;text-align:left}
.rw .row1{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rw .rwh{display:flex;align-items:center;gap:6px;font:700 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.rw .lvchip{font:600 12px var(--f-ui);padding:3px 7px;border:1px solid var(--ink-line);border-radius:2px}
.rw .lvchip.up{border-color:var(--seal-ok);color:var(--seal-ok);font-weight:700}
.rw .fr{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-ui);padding:3px 8px 3px 3px;border-left:3px solid var(--el);background:var(--el-bg)}
.rw .fr .gem{width:24px;height:24px}.rw .fr .gem .sg{font-size:11px}

/* fragment fit */
.chip.fit2{background:#2F5D50;color:#fff;border-color:#2F5D50}
.chip.fit1{border-color:#2F5D50;color:#2F5D50}
.fitbox{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:2px;font:12.5px/1.4 var(--f-form)}
.fitbox .ic{font-size:20px;margin-top:1px}
.fitbox b{display:block;font:700 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.fitbox.t2{background:rgba(47,93,80,.14);border-left:4px solid #2F5D50}.fitbox.t2 .ic,.fitbox.t2 b{color:#2F5D50}
.fitbox.t1{background:rgba(47,93,80,.07);border-left:4px solid #6F9A8D}.fitbox.t1 .ic,.fitbox.t1 b{color:#2F5D50}
.fitbox.t0{background:rgba(27,26,46,.05);border-left:4px solid var(--ink-soft)}.fitbox.t0 .ic,.fitbox.t0 b{color:var(--ink-soft)}
.fitbox .alt{display:block;margin-top:3px;color:var(--ink-soft)}
/* backup */
.codebox{width:100%;box-sizing:border-box;font:11px/1.35 var(--f-ui);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:6px 8px;resize:vertical;word-break:break-all;-webkit-user-select:text;user-select:text}
.cont-sub{display:block;font:600 9px var(--f-ui);letter-spacing:.08em;opacity:.75;margin-top:2px}
/* Guide */
.guide{width:100%;max-width:980px;display:flex;flex-direction:column;gap:10px}
.gtabs{display:flex;gap:4px;flex-wrap:wrap}
.gtab{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:8px 12px;border-radius:2px;cursor:pointer;font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.gtab .ic{font-size:15px;color:var(--sodium)}
.gtab[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.gtab[aria-pressed="true"] .ic{color:var(--star-ink)}
.gtab:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.gpage{box-sizing:border-box;width:100%}
.gpage h2{margin:0 0 2px;padding-right:0}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.gcard{display:grid;grid-template-columns:38px 1fr;gap:0 10px;align-items:start;padding:9px 10px;border:1.5px solid var(--ink-line);border-radius:2px;background:rgba(27,26,46,.03)}
.gcard .gi{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--sun);display:grid;place-items:center;font-size:19px}
.gcard .gi.t{font:700 18px var(--f-ui)}
.gcard b{display:block;font:700 16px/1.15 var(--f-display);margin-bottom:2px}
.gcard p{margin:0;font:12.5px/1.4 var(--f-form);color:var(--ink-soft)}
.gcard .keys{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
kbd{font:700 10px var(--f-ui);padding:2px 6px;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:3px;color:var(--ink);background:var(--paper)}
.gtip{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:9px 12px;background:rgba(255,209,102,.28);border-left:4px solid var(--star-ink);font:13px/1.45 var(--f-form)}
.gtip .ic{color:var(--star-ink);font-size:18px;margin-top:1px}
.gtip b{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--star-ink)}
.gsteps{counter-reset:st;list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.gsteps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font:13px/1.4 var(--f-form)}
.gsteps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 12px var(--f-ui)}
.gsteps li b{font-family:var(--f-ui);font-size:12px}
.gchar{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px;border:1.5px solid var(--ink-line);border-left:5px solid var(--cc);margin-top:8px}
.gchar canvas{width:64px;height:64px}
.gchar h3{margin:0;font:700 20px/1 var(--f-display);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gchar h3 small{font:600 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.gchar .how{margin:4px 0 6px;font:13px/1.4 var(--f-form)}
.gchar .rot{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font:600 11px var(--f-ui)}
.gchar .rot .arr{color:var(--ink-soft)}
.guide-new{position:relative}
.guide-new::after{content:'NEW';position:absolute;top:-8px;right:-8px;font:700 9px var(--f-ui);background:var(--danger);color:#fff;padding:2px 5px;border-radius:999px}
/* In-game tips */
#tip{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;pointer-events:none;
  display:flex;gap:8px;align-items:center;max-width:min(400px,44vw);padding:6px 10px 6px 8px;background:rgba(20,19,32,.92);border:1px solid var(--sodium);
  border-left:4px solid var(--sodium);border-radius:2px;box-shadow:0 6px 20px rgba(0,0,0,.45);animation:tipIn .25s ease-out}
#tip .ic{font-size:20px;color:var(--sodium)}
#tip b{display:block;font:700 10px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--sodium)}
#tip span.tx{font:600 11.5px/1.3 var(--f-form);color:var(--paper)}
#tip i{position:absolute;left:0;bottom:0;height:2px;background:var(--sodium);width:var(--k,100%)}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){#tip{animation:none}}
/* Pause settings */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px;margin:8px 0 4px}
.setting{display:flex;align-items:center;gap:10px;font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);min-width:0}
.setting>span:first-child{flex:none;width:9.5em}
.setting input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.setting .val{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.toggle{font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:4px 12px;cursor:pointer;border-radius:2px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toggle:focus-visible{outline:2px solid var(--water);outline-offset:2px}

/* Rotate prompt */
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--void);color:var(--paper);text-align:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#rotate .phone{width:34px;height:58px;border:2px solid var(--paper);border-radius:7px;animation:tilt 2.4s ease-in-out infinite}
#rotate p{margin:0;font:15px/1.4 var(--f-form);max-width:30ch}
#rotate small{font:11px var(--f-ui);color:var(--ash);letter-spacing:.12em;text-transform:uppercase}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}
@media (max-height:420px){.form{padding:12px 14px 12px}.form h2{font-size:21px}.choice{padding:8px 10px}.choice p{font-size:12px}.skill p{font-size:12px}}

/* ───────── Cozy pixel theme layer (wood frames, cream paper, readable type) ───────── */

<body>

<canvas id="game" aria-label="Starfall game area"></canvas>
<div id="safe-probe"></div>
<div id="overlay" hidden></div>
<div id="tip" role="status" aria-live="polite" hidden></div>
<div id="tut" role="status" aria-live="polite" hidden></div>
<div id="rotate" role="alert">
  <div class="phone"></div>
  <small>Starfall · The Ascent</small>
  <p>Turn your phone sideways to play.</p>
</div>

<script>
'use strict';
(function(){
// ═══════════════════════════════════════════ helpers
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rand=Math.random;
const rr=(a,b)=>a+rand()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pick=a=>a[Math.floor(rand()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return Math.abs(d);};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const rootStyle=getComputedStyle(document.documentElement);
const C={};
['void','night','panel','ink','paper','ash','danger','gold','sodium','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','earth','water','air','fire','hp','serpent','lime','wax','sun'].forEach(k=>{C[k]=rootStyle.getPropertyValue('--'+k).trim()||'#ffffff';});
function alpha(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT_UI='"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif';
const FONT_DISP='"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif';
const PREF_KEY='starfall-ascent-prefs';
function loadPrefs(){try{return JSON.parse(localStorage.getItem(PREF_KEY)||'{}')||{};}catch(_){return {};}}
function savePrefs(p){try{localStorage.setItem(PREF_KEY,JSON.stringify(Object.assign(loadPrefs(),p)));}catch(_){}}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ═══════════════════════════════════════════ state
let state='title';   // title | dialog | play | between | panel | dying
let run=null, room=null, team=null, player=null, boss=null;
let falls=[],stepT=0,loots=[],chests=[],enemies=[],shots=[],bullets=[],allies=[],zones=[],meteors=[],tels=[],sparks=[],orbs=[],parts=[],texts=[],decals=[],beams=[],swings=[],amb=[],rays=[];
let T=0, shakeT=0, shakeM=0, slowReal=0, betweenT=0, betweenCb=null, bigStamp=null, deathT=0, autoTest=false, paused=false;

// ═══════════════════════════════════════════ canvas + layout
const cv=$('#game');let ctx=cv.getContext('2d');
const probe=$('#safe-probe'), overlay=$('#overlay');
let dpr=1,sw=0,sh=0,scale=1,ox=0,oy=0;
let W=800; const H=400;
let AX0=18,AY0=18,AX1=W-18,AY1=H-18;
const safe={t:0,r:0,b:0,l:0};
const btn={atk:{},dodge:{},sun:{},moon:{},ult:{},pause:{}};
for(const k in btn) Object.assign(btn[k],{x:0,y:0,r:30,down:0});
const ports=[{},{},{}];
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  sw=window.innerWidth; sh=window.innerHeight;
  cv.width=Math.round(sw*dpr); cv.height=Math.round(sh*dpr);
  const ps=getComputedStyle(probe);
  safe.t=parseFloat(ps.paddingTop)||0; safe.r=parseFloat(ps.paddingRight)||0;
  safe.b=parseFloat(ps.paddingBottom)||0; safe.l=parseFloat(ps.paddingLeft)||0;
  W=Math.round(clamp(H*sw/Math.max(1,sh),620,900));
  AX1=W-18; AY1=H-18;
  scale=Math.min(sw/W,sh/H); ox=(sw-W*scale)/2; oy=(sh-H*scale)/2;
  const R=clamp(Math.min(sw,sh)*0.098,30,44);
  const ax=sw-safe.r-14-R, ay=sh-safe.b-12-R, d=R*1.98, sr=R*0.6;
  Object.assign(btn.atk,{x:ax,y:ay,r:R});
  const P=(deg,o)=>Object.assign(o,{x:ax+Math.cos(deg*Math.PI/180)*d,y:ay-Math.sin(deg*Math.PI/180)*d,r:sr});
  P(188,btn.dodge); P(150,btn.sun); P(116,btn.moon); P(83,btn.ult);
  Object.assign(btn.pause,{x:sw-safe.r-26,y:safe.t+22,r:16});
  const py0=Math.max(safe.t+110,sh*0.36),pr=clamp(sh*0.045,15,20);
  ports.forEach((p,i)=>Object.assign(p,{x:safe.l+30,y:py0+i*(pr*2+10),r:pr}));
  if(player){player.x=clamp(player.x,AX0+player.r,AX1-player.r);}
  for(const e of enemies){e.x=clamp(e.x,AX0+e.r,AX1-e.r);}
  bgKey='';titleKey='';
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));

// ═══════════════════════════════════════════ input
const keys=Object.create(null); const actions=[];
let isTouch=matchMedia('(pointer: coarse)').matches, useMouse=false, aimByMouse=false;
const joy={id:null,ox:0,oy:0,x:0,y:0};
const atk={down:false,t:0,released:false,pid:null};
const mouse={wx:0,wy:0,inside:false};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(e.repeat) return;
  ensureAudio();
  if(!overlay.hidden){panelKey(e);return;}
  if(state!=='play') return;
  if(e.code==='Escape'||e.code==='KeyP'){sfx('pause');pauseGame();return;}
  aimByMouse=useMouse&&mouse.inside;
  if(e.code==='KeyJ'||e.code==='KeyF'){atkPress(null);}
  else if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight') actions.push('dodge');
  else if(e.code==='KeyQ') actions.push('sun');
  else if(e.code==='KeyE') actions.push('moon');
  else if(e.code==='KeyR') actions.push('ult');
  else if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3') actions.push('swap'+(+e.code.slice(5)-1));
});
addEventListener('keyup',e=>{keys[e.code]=false;if((e.code==='KeyJ'||e.code==='KeyF')&&atk.down&&atk.pid===null)atkRelease();});
addEventListener('blur',()=>{for(const k in keys) keys[k]=false; joy.id=null; if(atk.down) atkRelease();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pauseGame();try{if(ac)ac.suspend();}catch(_){}}
  else{try{if(ac)ac.resume();}catch(_){}}});
function wakeAudio(){try{if(ac&&ac.state!=='running')ac.resume().then(()=>{if(mus.next<ac.currentTime)mus.next=ac.currentTime+0.05;});}catch(_){}}
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,wakeAudio,{capture:true,passive:true}));
addEventListener('pageshow',wakeAudio);addEventListener('focus',wakeAudio);
function atkPress(pid){if(atk.down)return;atk.down=true;atk.t=0;atk.pid=pid;btn.atk.down=0.15;}
function atkRelease(){if(!atk.down)return;atk.down=false;atk.released=true;atk.pid=null;}
function toWorld(x,y){return {x:(x-ox)/scale,y:(y-oy)/scale};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio();
  if(e.pointerType==='touch'){isTouch=true;useMouse=false;}
  if(state!=='play'||paused) return;
  const x=e.clientX,y=e.clientY;
  if(Math.hypot(x-btn.pause.x,y-btn.pause.y)<btn.pause.r+12){sfx('pause');pauseGame();return;}
  for(let i=0;i<3;i++){const p=ports[i];if(team&&team.members[i]&&Math.hypot(x-p.x,y-p.y)<p.r+8){actions.push('swap'+i);return;}}
  for(const k of ['atk','dodge','sun','moon','ult']){const b=btn[k];
    if(Math.hypot(x-b.x,y-b.y)<b.r+8){
      aimByMouse=false; // on-screen buttons always auto-aim at the nearest Vice
      if(k==='atk'){atkPress(e.pointerId);try{cv.setPointerCapture(e.pointerId);}catch(_){}}
      else {actions.push(k);b.down=0.15;}
      return;}}
  if(e.pointerType==='mouse'){useMouse=true;aimByMouse=true;const w=toWorld(x,y);mouse.wx=w.x;mouse.wy=w.y;mouse.inside=true;atkPress(e.pointerId);try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}
  if(joy.id===null&&x<sw*0.55){joy.id=e.pointerId;joy.ox=x;joy.oy=y;joy.x=x;joy.y=y;try{cv.setPointerCapture(e.pointerId);}catch(_){}}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;}
  if(e.pointerType==='mouse'){const w=toWorld(e.clientX,e.clientY);mouse.wx=w.x;mouse.wy=w.y;mouse.inside=true;}
});
const endPtr=e=>{if(e.pointerId===joy.id)joy.id=null;if(atk.down&&atk.pid===e.pointerId)atkRelease();};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr); cv.addEventListener('lostpointercapture',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault();},{passive:false});
function inputVec(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x-=1; if(keys.KeyD||keys.ArrowRight)x+=1;
  if(keys.KeyW||keys.ArrowUp)y-=1; if(keys.KeyS||keys.ArrowDown)y+=1;
  const m=Math.hypot(x,y); if(m>0){x/=m;y/=m;}
  if(joy.id!==null){
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),R=52;
    if(d>R){joy.ox=joy.x-dx/d*R;joy.oy=joy.y-dy/d*R;}
    if(d>7){const k=Math.min(1,d/R);x=dx/d*k;y=dy/d*k;}
  }
  return {x,y};
}

// ═══════════════════════════════════════════ audio
let ac=null; const lastS={};
const prefs0=loadPrefs();
const vol={music:prefs0.music??0.6,sfx:prefs0.sfx??0.8,shake:prefs0.shake??true,nums:prefs0.nums??true,tips:prefs0.tips??true};
let sfxBus=null,musicBus=null,musicDuck=1;
function ensureAudio(){
  try{
    if(!ac){const A=window.AudioContext||window.webkitAudioContext;
      if(A){ac=new A();sfxBus=ac.createGain();sfxBus.gain.value=vol.sfx;{const cp=ac.createDynamicsCompressor();cp.threshold.value=-18;cp.knee.value=12;cp.ratio.value=4;cp.attack.value=0.003;cp.release.value=0.12;sfxBus.connect(cp);cp.connect(ac.destination);}
        musicBus=ac.createGain();musicBus.gain.value=vol.music*0.5*musicDuck;musicBus.connect(ac.destination);initMusic();}}
    if(ac&&ac.state==='suspended')ac.resume();
  }catch(_){}
}
function applyVolumes(){if(!ac)return;const t=ac.currentTime;sfxBus.gain.setTargetAtTime(vol.sfx,t,0.05);musicBus.gain.setTargetAtTime(vol.music*0.5*musicDuck,t,0.12);}
function nz(d,v,type,freq,delay){
  if(!ac||!mus.noise)return;
  try{const t=ac.currentTime+(delay||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=mus.noise;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+d+0.02);}catch(_){}
}
// layered sound helpers: whooshes (swept filtered noise), thumps (pitch-dropping sine), small random pitch so repeats never sound identical
const jit=()=>0.9+Math.random()*0.2;
function sweep(d,v,f0,f1,q,delay,type){
  if(!ac||!mus.noise)return;
  try{const t=ac.currentTime+(delay||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=mus.noise;s.playbackRate.value=jit();f.type=type||'bandpass';f.Q.value=q||1.2;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*0.25);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t,Math.random()*0.2);s.stop(t+d+0.02);}catch(_){}
}
function thump(f0,f1,d,v,delay){
  if(!ac)return;
  try{const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f0*jit(),t);o.frequency.exponentialRampToValueAtTime(Math.max(25,f1),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+0.03);}catch(_){}
}
function growl(f,d,v){
  if(!ac)return;
  try{const t=ac.currentTime,o=ac.createOscillator(),lf=ac.createOscillator(),lg=ac.createGain(),fl=ac.createBiquadFilter(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(f*jit(),t);o.frequency.linearRampToValueAtTime(f*1.6,t+d);
    lf.frequency.value=22;lg.gain.value=v*0.6;lf.connect(lg);lg.connect(g.gain);
    fl.type='lowpass';fl.frequency.setValueAtTime(500,t);fl.frequency.linearRampToValueAtTime(1400,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+d*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(fl);fl.connect(g);g.connect(sfxBus);o.start(t);lf.start(t);o.stop(t+d+0.03);lf.stop(t+d+0.03);}catch(_){}
}
function tone(f,d,type,v,slide,delay){
  if(!ac) return;
  try{const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+0.03);}catch(_){}
}
function sfx(n){
  if(!ac) return;
  const now=performance.now(); if(lastS[n]&&now-lastS[n]<45) return; lastS[n]=now;
  switch(n){
    case 'slash':sweep(0.13,0.16,2600,700,1.4);tone(2300*jit(),0.05,'triangle',0.008,-600,0.03);break;
    case 'bow':tone(190*jit(),0.12,'triangle',0.05,-60);nz(0.02,0.05,'highpass',3500);sweep(0.12,0.07,3200,1400,2,0.02);break;
    case 'dart':sweep(0.07,0.07,4000,1800,2.5);tone(1500*jit(),0.04,'sine',0.014,-700);break;
    case 'thrust':sweep(0.09,0.13,3400,1200,2);tone(2600*jit(),0.04,'triangle',0.007,-900,0.02);break;
    case 'heavy':sweep(0.22,0.22,1500,260,1);thump(120,45,0.22,0.16,0.05);break;
    case 'thud':thump(150,45,0.18,0.22);nz(0.07,0.08,'lowpass',700);break;
    case 'hit':nz(0.05,0.09,'bandpass',1500*jit());thump(200,70,0.08,0.12);break;
    case 'impact':nz(0.045,0.1,'bandpass',1100*jit());thump(180,60,0.09,0.15);tone(90*jit(),0.06,'square',0.02,-30);break;
    case 'impactBig':nz(0.12,0.18,'lowpass',1600);thump(130,35,0.2,0.26);sweep(0.1,0.08,900,300,1);break;
    case 'kill':nz(0.16,0.14,'bandpass',900*jit());thump(260,50,0.18,0.18);tone(700*jit(),0.12,'triangle',0.03,-450,0.03);sweep(0.25,0.05,2400,500,1,0.05);break;
    case 'killBig':nz(0.3,0.2,'lowpass',1200);thump(110,30,0.4,0.3);tone(392,0.25,'triangle',0.04,0,0.05);tone(587,0.3,'triangle',0.03,0,0.12);break;
    case 'dodge':sweep(0.2,0.12,600,2600,1.2);tone(380,0.1,'sine',0.02,380);break;
    case 'perfect':tone(660,0.2,'sine',0.05,660);tone(990,0.28,'sine',0.03,0);break;
    case 'hurt':nz(0.1,0.16,'lowpass',1300);thump(220,60,0.22,0.22);tone(150,0.2,'sawtooth',0.04,-70);break;
    case 'block':tone(210,0.08,'square',0.03,40);break;
    case 'skill':tone(440,0.28,'sine',0.045,240);break;
    case 'heal':tone(660,0.2,'sine',0.035,220);tone(880,0.25,'sine',0.02,0,0.06);break;
    case 'splash':tone(320,0.26,'triangle',0.05,-220);break;
    case 'break':tone(90,0.36,'sawtooth',0.06,-40);break;
    case 'boom':thump(110,30,0.45,0.3);nz(0.35,0.16,'lowpass',700);tone(70,0.35,'sawtooth',0.04,-30);break;
    case 'stamp':tone(70,0.3,'square',0.07,-30);break;
    case 'spark':tone(1320,0.1,'sine',0.04,420);break;
    case 'orb':tone(980,0.06,'sine',0.025,300);break;
    case 'charge':growl(85,0.5,0.06);break;
    case 'rush':sweep(0.35,0.14,400,1800,1.4);thump(90,40,0.25,0.12);break;
    case 'pew':tone(720*jit(),0.12,'square',0.022,-480);nz(0.04,0.04,'highpass',2500);break;
    case 'rumble':growl(55,0.7,0.07);nz(0.6,0.05,'lowpass',300);break;
    case 'step':nz(0.035,0.025,'lowpass',500*jit());break;
    case 'spawnIn':sweep(0.45,0.05,300,1600,3);tone(220*jit(),0.3,'sine',0.015,180);break;
    case 'aspect':tone(392,0.3,'sine',0.05,0);tone(587,0.4,'sine',0.04,0);break;
    case 'ult':tone(220,0.5,'sawtooth',0.04,440);tone(660,0.5,'sine',0.04,0);break;
    case 'swap':sweep(0.18,0.12,800,3200,1.3);tone(520,0.07,'triangle',0.03,260);break;
    case 'counter':tone(300,0.3,'sawtooth',0.05,500);nz(0.2,0.06,'bandpass',1200);break;
    case 'laser':tone(1600,0.18,'sawtooth',0.035,-1300);nz(0.12,0.05,'highpass',2500);break;
    case 'clock':tone(1800,0.04,'square',0.02,0);tone(1350,0.04,'square',0.02,0,0.5);break;
    case 'sentence':tone(160,0.25,'square',0.05,-60);tone(640,0.18,'triangle',0.03,0,0.05);break;
    case 'bless':tone(523,0.18,'sine',0.04,0);tone(784,0.3,'sine',0.03,0);break;
    case 'deny':tone(200,0.3,'square',0.04,-80);break;
    case 'ui':break;
    case 'click':tone(900,0.035,'triangle',0.03,-250);break;
    case 'hover':tone(1600,0.02,'sine',0.01,0);break;
    case 'confirm':nz(0.06,0.09,'lowpass',900);tone(523,0.08,'triangle',0.04,0);tone(784,0.14,'triangle',0.035,0,0.06);break;

const mus={tr:null,id:null,next:0,step:0,bar:0,out:null,delay:null,noise:null,timer:null};
function initMusic(){
  const len=Math.floor(ac.sampleRate*0.4);mus.noise=ac.createBuffer(1,len,ac.sampleRate);const d=mus.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  mus.delay=ac.createDelay(1.0);const fb=ac.createGain();fb.gain.value=0.35;const wet=ac.createGain();wet.gain.value=0.35;
  mus.delay.connect(fb);fb.connect(mus.delay);mus.delay.connect(wet);wet.connect(musicBus);
  mus.timer=setInterval(musicTick,40);
  const w=mus.id;mus.id=null;if(w)playMusic(w);
}
function playMusic(id){
  if(!TRACKS[id]||mus.id===id)return;
  mus.id=id;
  if(!ac||!mus.noise)return;
  const t=ac.currentTime,old=mus.out;
  if(old){old.gain.setTargetAtTime(0,t,0.25);setTimeout(()=>{try{old.disconnect();}catch(_){}},1500);}
  mus.out=ac.createGain();mus.out.gain.setValueAtTime(0,t);mus.out.gain.linearRampToValueAtTime(1,t+0.8);mus.out.connect(musicBus);
  mus.tr=TRACKS[id];mus.step=0;mus.bar=0;mus.next=t+0.1;
  mus.delay.delayTime.setValueAtTime(60/mus.tr.bpm*0.75,t);
}
function musicTick(){
  if(ac&&mus.tr&&mus.next<ac.currentTime-0.3)mus.next=ac.currentTime+0.05;
  if(!ac||ac.state!=='running'||!mus.tr)return;
  const tr=mus.tr,spb=60/tr.bpm/4,now=ac.currentTime;
  if(mus.next<now-0.1)mus.next=now+0.05;
  while(mus.next<now+0.2){playStep(tr,mus.step,mus.next,spb);mus.next+=spb;mus.step=(mus.step+1)%16;if(mus.step===0)mus.bar++;}
}
function voice(f,t,dur,wave,v,o={}){
  const osc=ac.createOscillator(),g=ac.createGain();osc.type=wave;osc.frequency.setValueAtTime(f,t);if(o.detune)osc.detune.setValueAtTime(o.detune,t);
  let node=osc;if(o.cut){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(o.cut,t);osc.connect(fl);node=fl;}
  const a=o.att||0.005;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,a+0.02));
  node.connect(g);g.connect(mus.out);if(o.send)g.connect(mus.delay);
  osc.start(t);osc.stop(t+dur+0.05);
}
function noiseHit(t,dur,v,type,freq){
  const s=ac.createBufferSource();s.buffer=mus.noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(mus.out);s.start(t);s.stop(t+dur+0.02);
}
function playStep(tr,s,t,spb){
  const sc=SCALES[tr.scale],n=sc.length,deg=tr.prog[mus.bar%tr.prog.length];
  const nt=(d,oct)=>{const o=Math.floor(d/n),i=((d%n)+n)%n;return NOTE(tr.root+12*(oct+o)+sc[i]);};
  const on=p=>p&&p[s]==='x';
  if(tr.pad&&s===0)for(const d of [0,2,4])voice(nt(deg+d,0),t,spb*16*1.05,'sawtooth',0.03,{cut:700,att:0.6,detune:(d-2)*6});
  if(on(tr.bass))voice(nt(deg,-1),t,spb*1.6,tr.bassWave||'triangle',0.15,{cut:tr.bassWave==='sawtooth'?600:1200});
  if(on(tr.arp)){const ch=[0,2,4,7,4,2],k=ch[(s+mus.bar)%ch.length];
    voice(nt(deg+k,(tr.arpOct||2)-1),t,spb*(tr.arpLen||1.4),tr.arpWave||'triangle',tr.arpVol||0.05,{cut:tr.arpWave==='sine'?0:2400,send:!!tr.delay});}
  if(tr.bell&&(s===0||s===8))voice(nt(deg+4,2),t,1.6,'sine',0.045,{send:true});
  if(on(tr.kick)){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.18);
    g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(mus.out);o.start(t);o.stop(t+0.3);}
  if(on(tr.hat))noiseHit(t,0.035,0.045,'highpass',7000);
  if(on(tr.snare)){noiseHit(t,0.14,0.11,'bandpass',1800);voice(190,t,0.08,'triangle',0.05);}
}

// Story checkpoint: written every time you reach the door choice between districts
function storyCheckpoint(){
  if(!run||run.mode!=='story')return;
  save.story=save.story||{};
  save.story.cp={v:1,at:Date.now(),roomNo:run.roomNo,scene:run.scene,seen:[...run.seen],bl:{...run.bl},trials:{...run.trials},lethe:run.lethe,last:run.last,kills:run.kills,t:run.t,
    pn:team.pn,members:team.members.map(m=>({id:m.id,hp:m.hp/m.maxHp,down:!!m.down,pn:m.pn||0})),ai:team.ai};
  persist();
}
function clearCheckpoint(){if(save.story&&save.story.cp){delete save.story.cp;persist();}}
function hasCheckpoint(){return !!(save.story&&save.story.cp&&save.story.cp.v===1);}
function continueStory(){
  const cp=save.story.cp;
  newRun('story',STORY_PARTY,0);
  Object.assign(run,{roomNo:cp.roomNo,scene:cp.scene,seen:new Set(cp.seen||[]),bl:{...run.bl,...cp.bl},trials:{...run.trials,...cp.trials},lethe:!!cp.lethe,last:cp.last,kills:cp.kills|0,t:cp.t||0,first:false});
  team.pn=cp.pn||0;
  for(const c of cp.members||[]){const m=team.members.find(x=>x.id===c.id);if(m){m.pn=c.pn||0;m.down=!!c.down;m.hp=Math.max(1,Math.round(m.maxHp*(c.down?0.25:c.hp)));if(c.down){m.down=false;}}}
  team.ai=Math.min(cp.ai|0,team.members.length-1);player=team.members[team.ai];

function swapTo(i,o={}){
  if(!team)return false;
  const nm=team.members[i];
  if(!nm||i===team.ai)return false;
  if(nm.down){if(!o.forced)sfx('nope');return false;}
  if(!o.forced&&(team.swapCd>0||player.dash)){if(!o.forced)sfx('nope');return false;}
  const old=player;
  nm.x=old.x;nm.y=old.y;nm.fx=old.fx;nm.fy=old.fy;nm.face=old.face;
  old.dash=null;old.dodgeT=0;old.counterT=0;old.moving=false;old.scales2=0;
  if(team.shield&&!team.shield.carry)team.shield=null;
  if(tut)tut.swap++;team.ai=i;player=nm;team.swapCd=1.0;nm.swapAt=T;nm.iframe=Math.max(nm.iframe,0.35);nm.atkCd=Math.min(nm.atkCd,0.1);
  if(nm.bfx.swapShield)addShield(nm.maxHp*nm.bfx.swapShield,4,false);
  atk.t=0;
  if(nm.id==='kairos')nm.unrecorded=true;
  burstParts(nm.x,nm.y,nm.ch.col,16,140);ring(nm.x,nm.y,34,nm.ch.col,0.35);sfx('swap');
  if(nm.entCd<=0&&!o.noEntrance){
    nm.entCd=nm.rec>=5?6:8;const epw=nm.rec>=5?1.3:1;
    if(nm.id==='kairos'&&old.id!=='kairos'){KITS[old.id].entrance(nm,1.2*epw,true);addText(nm.x,nm.y-40,'BORROWED HOUR · '+old.ch.kit.entrance.name.toUpperCase(),C.gold,10,{life:1.1});}
    else KITS[nm.id].entrance(nm,epw,false);
  }
  if(blv('uranus')>0){const l=blv('uranus');radial(nm.x,nm.y,95,nm.atk*0.6*l,{knock:300,col:C.uranus,src:nm});ring(nm.x,nm.y,80,C.uranus,0.4);shake(3,0.1);}
  return true;

    const n=b.enraged?8:6,a=Math.atan2(player.y-b.y,player.x-b.x)+(blind?rr(-0.5,0.5):0);
    for(let i=0;i<n;i++){const ang=a+(i-(n-1)/2)*(1.15/(n-1));bullets.push({x:b.x,y:b.y+12,vx:Math.cos(ang)*165,vy:Math.sin(ang)*165,r:6,dmg:9,life:4});}
    b.actCd=b.enraged?0.6:0.8;
  } else if(b.pat===3){ // Paperwork storm: a rotating spiral of pages
    for(let k=0;k<3;k++){const ang=b.spin+k*TAU/3;bullets.push({x:b.x,y:b.y,vx:Math.cos(ang)*130,vy:Math.sin(ang)*130,r:6,dmg:7,life:5,page:1});}
    b.spin+=b.phase>=3?0.33:0.27;b.actCd=b.phase>=3?0.12:0.15;if(b.act++%6===0)sfx('page');

    tels.push({x:clamp(player.x,AX0+60,AX1-60),y:clamp(player.y,AY0+60,AY1-60),r:92,t:0,dur:1.35+late,dmg:28,ring:1});
    b.actCd=1.75;sfx('charge');
  } else if(b.pat===6){ // Registry rewrite: swaps your active character and locks switching
    if(b.act===0){const opts=team.members.map((m,i)=>i).filter(i=>i!==team.ai&&!team.members[i].down);
      if(opts.length){const j=pick(opts);swapTo(j,{forced:true,noEntrance:true});team.swapCd=3.5;
        addText(player.x,player.y-46,'REASSIGNED: '+nameOf(player.id).toUpperCase(),C.moon,12,{life:1.6});shake(6,0.25);sfx('stamp');}
      for(let i=0;i<2;i++)tels.push({x:clamp(player.x+rr(-140,140),AX0+40,AX1-40),y:clamp(player.y+rr(-90,90),AY0+40,AY1-40),r:54,t:0,dur:1.2+late,dmg:20});}
    b.act++;b.actCd=99;

    if(b.act===0){const n=b.enraged?3:2;for(let i=0;i<n;i++)if(aliveCount()<7)enemies.push(makeEnemy(pick(['gossip','hothead','gossip']),clamp(b.x+rr(-110,110),AX0+30,AX1-30),b.y+60));}
    const m=b.enraged?16:13,off=rand()*TAU;

    b.act++;b.actCd=1.25;
  }
}
function updateBoss(dt){
  const b=boss;if(!b||b.dead)return;
  b.flash-=dt;if(b.markT>0)b.markT-=dt;if(b.anaT>0)b.anaT-=dt;if(b.noHeal>0)b.noHeal-=dt;if(b.indT>0){b.indT-=dt;if(b.indT<=0)b.ind=0;}
  if(b.entering>0){b.entering-=dt;b.y+=(b.ty-b.y)*Math.min(1,dt*3);return;}
  if(b.burnT>0){b.burnT-=dt;b.burnAcc+=dt;if(b.burnAcc>=0.5){b.burnAcc=0;hitBoss(3*(b.burnMul||1),C.fire);if(b.dead)return;}}
  b.x+=clamp(player.x-b.x,-60*dt,60*dt);b.x=clamp(b.x,AX0+b.r+50,AX1-b.r-50);
  b.y=b.ty+Math.sin(T*1.3)*8;
  if(b.shieldT>0)b.shieldT-=dt;
  // three phases: Intake (stamps, pages) → Paperwork Storm (spirals, filing walls) → Registry Rewrite (the big stamp, swaps your hero, the queue)
  const np=b.hp<=b.maxHp*0.33?3:b.hp<=b.maxHp*0.66?2:1;
  if(np>b.phase){b.phase=np;b.enraged=np>=3;b.shieldT=1.6;b.idle=1.8;b.cyc=0;bullets=[];tels=[];
    shake(8,0.4);burstParts(b.x,b.y,np===3?C.danger:C.moon,50,260);sfx('stamp');sfx('ult');
    setBanner(np===2?'Phase II · Paperwork Storm':'Phase III · Registry Rewrite',np===2?'Pages spiral out of the desk. Walls of files sweep the hall: find the gap.':'He rewrites who you are. Your hero gets swapped and locked; dodge the Big Stamp.',3);
    bigStamp={text:np===2?'APPEAL DENIED':'RECORD AMENDED',col:np===2?C.moon:C.danger,t:0};setTimeout(()=>{if(bigStamp&&state==='play')bigStamp=null;},1300);}
  if(b.idle>0){b.idle-=dt;
    if(b.idle<=0){
      if(b.skip){b.skip=false;b.idle=1.6;setBanner('Order overruled','Horaios skips his next pattern',1.3);return;}
      const order=b.phase===1?[0,1]:b.phase===2?[3,0,4,1]:[5,3,6,4,2];b.pat=order[b.cyc++%order.length];
      b.patT=[6.2,6.2,6,4.2,6,5.4,2.4][b.pat]*(b.phase>=3?0.9:1);b.actCd=0.5;b.act=0;
      const N=['The Stamp','Paperwork','The Queue','Paper Spiral','Filing Wall','The Big Stamp','Reassignment'][b.pat];
      const D=['Red circles land a moment later. Step out.','A fan of red pages. Weave through the gaps.','He calls the next in line. Watch the ring.','Pages spin out of the desk. Circle with the gaps.','A wall of files sweeps the hall. Find the gap.','A giant seal follows you. Dash out before it lands.','He swaps your character and locks switching for a moment.'][b.pat];
      setBanner(N,D,1.6);}
  } else {b.patT-=dt;b.actCd-=dt;if(b.actCd<=0)bossAct(b);if(b.patT<=0)b.idle=b.phase>=3?0.7:b.phase===2?0.95:1.2;}
  if(dist(b,player)<b.r+player.r)hurtPlayer(15);
}

function spawnSpark(){
  for(let i=0;i<12;i++){const x=rr(AX0+40,AX1-40),y=rr(AY0+40,AY1-40);if(Math.hypot(x-player.x,y-player.y)>130){sparks.push({x,y,life:4.5,max:4.5});return;}}
  sparks.push({x:rr(AX0+40,AX1-40),y:rr(AY0+40,AY1-40),life:4.5,max:4.5});
}
function updateRoom(dt){
  const d=room.def;
  room.t+=dt;room.banner-=dt;
  if(room.notes.length&&room.banner<=0){room.noteT+=dt;if(room.noteT>4.5){room.notes.shift();room.noteT=0;}}
  if(room.spot){const s=room.spot;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<AX0+s.r||s.x>AX1-s.r)s.vx*=-1;if(s.y<AY0+s.r||s.y>AY1-s.r)s.vy*=-1;s.x=clamp(s.x,AX0+s.r,AX1-s.r);s.y=clamp(s.y,AY0+s.r,AY1-s.r);}
  if(d.kind==='house'){
    room.spawnCd-=dt;
    if(d.rule==='deadline'){
      if(room.t<40&&room.spawnCd<=0&&aliveCount()<room.cap+1){spawnGroup();room.spawnCd=1.5;}
      if(room.t>=40)finishRoom(true,'CLEARED');
    } else {
      if(room.spawned<room.budget&&room.spawnCd<=0&&aliveCount()<room.cap){spawnGroup();room.spawnCd=rr(1.2,1.9);}
      if(room.spawned>=room.budget&&enemies.length===0)finishRoom(true,'CLEARED');
    }
  } else if(d.kind==='training'){updateTutorial(dt);
  } else if(d.id==='trialMercury'){
    room.sparkCd-=dt;
    if(sparks.length<2&&room.sparkCd<=0){spawnSpark();room.sparkCd=0.6;}
    for(const s of sparks){s.life-=dt;
      if(Math.hypot(s.x-player.x,s.y-player.y)<player.r+13){s.got=true;room.collected++;gainPn(3);burstParts(s.x,s.y,C.mercury,12,120);sfx('spark');}
      else if(s.life<=0){s.got=true;room.missed++;addText(s.x,s.y-10,'missed',C.ash,10);}}
    sparks=sparks.filter(s=>!s.got);
    room.spawnCd-=dt;
    if(room.spawnCd<=0&&aliveCount()<4){enemies.push(spawnEdge(pick(['hothead','gossip'])));room.spawnCd=2.4;}
    if(room.collected>=12)finishRoom(true,'APPROVED');else if(room.missed>=5)finishRoom(false,'DENIED');
  } else if(d.id==='trialMars'){
    if(!room.champ&&room.t>0.8){room.champ=makeEnemy('champion',W/2,AY0+70,{});room.champ.lastHit=room.t;enemies.push(room.champ);}

  }
}

function fxLines(fx){

  if(fx.atk)L.push('ATK +'+pc(fx.atk));if(fx.hp)L.push('HP +'+pc(fx.hp));if(fx.def)L.push('DEF +'+pc(fx.def));if(fx.cdRed)L.push('Cooldowns −'+pc(Math.min(0.4,fx.cdRed)));
  if(fx.dmgPct)L.push('Damage +'+pc(fx.dmgPct));if(fx.aspd)L.push('Atk speed +'+pc(fx.aspd));if(fx.spd)L.push('Move speed +'+pc(fx.spd));
  if(fx.burnMult)L.push('Burn damage +'+pc(fx.burnMult));if(fx.ignite)L.push('Ignite chance '+pc(fx.ignite));if(fx.heat)L.push('Vs burning +'+pc(fx.heat));
  if(fx.shield)L.push('Shields +'+pc(fx.shield));if(fx.knock)L.push('Knockback +'+pc(fx.knock));if(fx.dodge)L.push('Dodge CD −'+pc(Math.min(0.5,fx.dodge)));
  if(fx.pn)L.push('Pneuma +'+pc(fx.pn));if(fx.heal)L.push('Healing +'+pc(fx.heal));if(fx.killHeal)L.push('Heal on kill '+(fx.killHeal*100).toFixed(1)+'%');
  if(fx.slow)L.push('Slows +'+pc(fx.slow));if(fx.swapShield)L.push('Switch-in shield '+pc(fx.swapShield));
  return L;
}

var tipEl=document.getElementById('tip');

function tip(id,icon,title,text,force){
  if(!vol.tips||tipSeen.has(id)||(tipCur&&tipCur.id===id)||tipQ.some(t=>t.id===id))return;
  const pr=/^(vice_|elite_|rule_|orb)/.test(id)?2:1;
  tipQ.push({id,icon,title,text,pr,dur:Math.max(4.5,text.length/16)});tipQ.sort((x,y)=>x.pr-y.pr);
}
function tipReset(){tipSeen=new Set();savePrefs({tipsSeen:[]});}
function showTipNow(t){
  tipCur=t;t.left=t.dur;tipSeen.add(t.id);savePrefs({tipsSeen:[...tipSeen]});
  tipEl.replaceChildren(ico(t.icon),h('div',null,h('b',null,t.title),h('span',{class:'tx'},t.text)),h('i'));

}
function hideTip(){tipCur=null;tipEl.hidden=true;}
const TK=()=>isTouch;
function updateTips(dt){
  if(!vol.tips){if(tipCur)hideTip();return;}
  if(state!=='play'||!run||!player){if(tipCur)hideTip();return;}
  tipClock+=dt;
  const p=player,t=run.t;
  // triggers
  if(t>0.6)tip('move','move','Move',TK()?'Drag your left thumb to move.':'Move with WASD or the arrow keys.');
  if(t>3)tip('attack','atk','Attack',TK()?'Tap ATTACK to hit. Hold it to charge a stronger attack.':'Press J or click to attack. Hold to charge.');
  if(t>9&&p.cd.sun<=0)tip('sun','sun','Sun skill ready',TK()?'Tap SUN for your offensive skill.':'Press Q for your offensive Sun skill.');
  if(t>14&&p.cd.moon<=0&&tipSeen.has('sun'))tip('moon','moon','Moon skill ready',(TK()?'Tap MOON':'Press E')+' for your defensive skill. Use Sun then Moon within 4s for a combo!');
  if(t>22&&team.members.length>1&&tipSeen.has('moon'))tip('swap','swap','Switch characters',(TK()?'Tap a portrait on the left':'Press 1, 2 or 3')+' to switch. Each character does a free move when they jump in.');
  if(tels.some(e=>Math.hypot(e.x-p.x,e.y-p.y)<e.r+60)||beams.length)tip('red','dash','Red = danger',(TK()?'Tap DODGE':'Press Space')+' or walk out of red zones before they go off.');
  if(team.pn>=100)tip('ult','ult','Ultimate ready!',(TK()?'Tap ULT':'Press R')+' to spend 100 Pneuma on your Ultimate.');
  if(orbs.length&&t>2)tip('orb','pn','Pneuma orbs','Walk over the gold orbs. They fill the Ultimate bar.');
  if(p.hp<p.maxHp*0.35&&team.members.some(m=>m!==p&&!m.down))tip('lowhp','hp','Low HP',(TK()?'Tap a portrait':'Press 1, 2 or 3')+' to switch out. Characters on the bench are safe.');
  for(const e of enemies){if(!e.dead&&VICE_INFO[e.type]){const v=VICE_INFO[e.type];tip('vice_'+e.type,'skull','New Vice: '+v[0],v[2]);}
    if(e.elite&&ELITE_INFO[e.elite])tip('elite_'+e.elite,'ult',ELITE_INFO[e.elite][0],ELITE_INFO[e.elite][1]);}
  if(boss&&!boss.entering)tip('boss','skull','Boss: Horaios','Keep moving between his red bullets. Dodge through the thick parts.');
  if(room&&room.def&&room.def.ruleText&&room.def.kind==='house'&&t>1.5&&t<6)tip('rule_'+room.def.id,'door',room.def.num+' rule',room.def.ruleText);

function update(dt){
  run.t+=dt;
  for(const a of actions){
    if(a==='dodge')doDodge();else if(a==='sun'||a==='moon')castSkill(a);else if(a==='ult')castUlt();
    else if(a.startsWith('swap')){const i=+a.slice(4);if(i!==team.ai)swapTo(i);}
  }
  actions.length=0;
  updateTips(dt);
  if(player)updateLoot(dt);
  if(player&&player.moving&&!player.dash){stepT-=dt;if(stepT<=0){stepT=0.26/Math.max(0.7,effSpeed(player)/160);sfx('step');part(player.x+rr(-4,4),player.y+10,rr(-20,20),rr(-30,-8),0.35,'#E6D3AC',2.2);}}else stepT=0;
  for(const e of enemies){if(e.spawnT>0&&!e.spawnSnd){e.spawnSnd=1;sfx('spawnIn');}}
  if(autoTest)autoPlay();
  updateRoom(dt);if(state!=='play')return;
  updateTeam(dt);
  updatePlayer(dt);if(state!=='play')return;
  updateAllies(dt);
  updateZones(dt);if(state!=='play')return;
  updateShots(dt);if(state!=='play')return;
  if(team.timeStop>0){team.timeStop-=dt;enemies=enemies.filter(e=>!e.dead);return;}
  updateEnemies(dt);if(state!=='play')return;
  updateBoss(dt);if(state!=='play')return;
  updateBullets(dt);if(state!=='play')return;
  updateTels(dt);
}
function autoPlay(){
  const p=player,kit=KITS[p.id];
  const rng=(p.id==='seren'||p.id==='sophia')?440:170;
  if(p.atkCd<=0&&!p.dash&&nearestTarget(p.x,p.y,rng,null)){if(rand()<0.12)kit.hold(p);else kit.tap(p);}
  if(p.cd.sun<=0&&rand()<0.02)castSkill('sun');
  if(p.cd.moon<=0&&rand()<0.02)castSkill('moon');
  if(team.pn>=100)castUlt();
  if(team.swapCd<=0&&rand()<0.006){const opts=team.members.map((m,i)=>i).filter(i=>i!==team.ai&&!team.members[i].down);if(opts.length)swapTo(pick(opts));}
  if(rng<200){const t=nearestTarget(p.x,p.y,400,null);if(t){const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)||1;if(d>40){p.x+=dx/d*2;p.y+=dy/d*2;}}}
}
function updateFx(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-3*dt;p.vy*=1-3*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.life-=dt;if(t.follow&&!t.follow.dead){t.x=t.follow.x;t.y=t.follow.y-t.follow.r-14;}else t.y-=t.rise*dt;}
  texts=texts.filter(t=>t.life>0);
  for(const d of decals)d.life-=dt;decals=decals.filter(d=>d.life>0);
  for(const b of beams)b.life-=dt;beams=beams.filter(b=>b.life>0);
  for(const s of swings)s.life-=dt;swings=swings.filter(s=>s.life>0);
  for(const r of rays)r.life-=dt;rays=rays.filter(r=>r.life>0);
  for(const k in btn)btn[k].down-=dt;
}
function updateAmbient(dt){
  if(amb.length<46&&rand()<dt*14)amb.push({x:rr(0,W),y:H+5,vx:rr(-8,8),vy:-rr(14,34),life:rr(5,10),s:rr(1,2.2),ph:rand()*TAU});
  for(const a of amb){a.x+=(a.vx+Math.sin(T*1.5+a.ph)*8)*dt;a.y+=a.vy*dt;a.life-=dt;}
  amb=amb.filter(a=>a.life>0&&a.y>-10);
}
let last=performance.now();
function frame(now){
  const rdt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  tick(rdt);render();requestAnimationFrame(frame);
}
function tick(rdt){
  let ts=1;if(slowReal>0){slowReal-=rdt;ts=0.3;}
  const dt=rdt*ts;
  if(shakeT>0){shakeT-=rdt;if(shakeT<=0)shakeM=0;}
  {const pl=state==='play'||state==='between'||state==='dying';if(pl!==document.body.classList.contains('playing'))document.body.classList.toggle('playing',pl);}
  if(state==='play'&&!paused)update(dt);
  if((state==='play'&&!paused)||state==='between'||state==='dying')updateFx(dt);
  updateAmbient(rdt);
  if(state==='between'){betweenT-=rdt;if(bigStamp)bigStamp.t+=rdt;if(betweenT<=0){state='panel';bigStamp=null;const cb=betweenCb;betweenCb=null;cb&&cb();}}

  T+=rdt;
}
