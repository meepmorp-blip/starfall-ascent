function drawPlayer(){
  const p=player,c=ctx;
  {const hg=c.createRadialGradient(p.x,p.y-6,2,p.x,p.y-6,40);hg.addColorStop(0,alpha(p.ch.col,0.28));hg.addColorStop(1,alpha(p.ch.col,0));c.fillStyle=hg;c.fillRect(p.x-40,p.y-46,80,80);}
  c.fillStyle=alpha(C.sodium,0.16);ell(c,p.x,p.y+9,15,6);c.fill();
  c.strokeStyle=alpha(p.ch.col,0.85);c.lineWidth=1.5;ell(c,p.x,p.y+9,15,6);c.stroke();
  {const a=Math.atan2(p.fy,p.fx),ax=p.x+Math.cos(a)*19,ay=p.y+9+Math.sin(a)*8;c.fillStyle=alpha(p.ch.col,0.95);c.beginPath();c.moveTo(ax+Math.cos(a)*5,ay+Math.sin(a)*2.5);c.lineTo(ax+Math.cos(a+2.2)*4,ay+Math.sin(a+2.2)*2);c.lineTo(ax+Math.cos(a-2.2)*4,ay+Math.sin(a-2.2)*2);c.closePath();c.fill();}
  const s=team.shield;
  if(s){const k=clamp(s.hp/Math.max(1,s.max),0,1);c.fillStyle=alpha(C.earth,0.1+0.1*k);c.strokeStyle=s.carry?C.gold:C.earth;c.lineWidth=1.5+3*k;c.beginPath();
    for(let i=0;i<6;i++){const ang=i/6*TAU+Math.PI/6,R=p.r+12;i?c.lineTo(p.x+Math.cos(ang)*R,p.y-4+Math.sin(ang)*R):c.moveTo(p.x+Math.cos(ang)*R,p.y-4+Math.sin(ang)*R);}c.closePath();c.fill();c.stroke();}
  if(p.counterT>0){c.strokeStyle=alpha(C.water,0.55+0.35*Math.sin(T*14));c.lineWidth=2.5;c.beginPath();c.arc(p.x,p.y-4,p.r+10,T*6,T*6+Math.PI*1.4);c.stroke();c.beginPath();c.arc(p.x,p.y-4,p.r+10,T*6+Math.PI,T*6+Math.PI*2.4);c.stroke();}
  if(team.firstClay>0){c.strokeStyle=alpha(C.earth,0.6);c.lineWidth=2;c.setLineDash([3,3]);circ(c,p.x,p.y-4,p.r+18);c.stroke();c.setLineDash([]);}
  if(atk.down&&atk.t>0.2){const k=clamp(atk.t/KITS[p.id].chargeT,0,1);c.strokeStyle=k>=1?C.gold:alpha(C.paper,0.8);c.lineWidth=k>=1?3:2;c.beginPath();c.arc(p.x,p.y-4,p.r+8,-Math.PI/2,-Math.PI/2+TAU*k);c.stroke();}
  if(p.ultT>0){c.strokeStyle=alpha(C.gold,0.4+0.3*Math.sin(T*10));c.lineWidth=2;circ(c,p.x,p.y-4,p.r+16);c.stroke();}
  if(team.tailwind>0&&rand()<0.3)part(p.x+rr(-8,8),p.y+rr(-4,8),-p.fx*60,-p.fy*60,0.3,C.air,1.6);
  const blink=p.iframe>0&&p.dodgeT<=0&&!p.dash&&!team.shield&&Math.floor(T*22)%2===0;
  drawCharOutlined(c,p.id,p.x,p.y,{face:p.face,moving:p.moving&&p.dodgeT<=0,alpha:blink?0.4:1,flash:p.flash>0,scale:1.2,lunge:clamp(1-(T-(p.lastAtkT??-9))/0.16,0,1),
    hurt:p.flash>0?clamp(p.flash/0.15,0,1):0,roll:p.dodgeT>0?1-p.dodgeT/0.17:0,pop:clamp(1-(T-(p.swapAt??-9))/0.22,0,1)});
}
function drawAlly(a){
  const c=ctx;
  if(a.kind==='guard'){
    const r=a.r,x=a.x,y=a.y,lf=clamp(a.life/a.maxLife,0,1);
    c.fillStyle='rgba(0,0,0,0.35)';ell(c,x,y+r*0.8,r*1.0,r*0.35);c.fill();
    if(a.consec){c.strokeStyle=alpha(C.gold,0.6+0.3*Math.sin(T*6));c.lineWidth=2;ell(c,x,y-r*1.25,r*0.6,r*0.2);c.stroke();}
    c.fillStyle='#A0703D';rrect(c,x-r*0.75,y-r*0.95,r*1.5,r*1.7,r*0.4);c.fill();c.strokeStyle='#E8C48A';c.lineWidth=1.2;c.stroke();
    c.fillStyle='#8A5E32';rrect(c,x-r*0.75,y+r*0.35,r*1.5,r*0.4,r*0.15);c.fill();
    c.fillStyle='#A0703D';circ(c,x-r*0.95,y-r*0.1,r*0.33);c.fill();circ(c,x+r*0.95,y-r*0.1,r*0.33);c.fill();
    c.strokeStyle='#5A4528';c.lineWidth=1;c.beginPath();c.moveTo(x-r*0.3,y-r*0.7);c.lineTo(x-r*0.05,y-r*0.2);c.lineTo(x-r*0.35,y+r*0.2);c.stroke();
    c.fillStyle=a.consec?C.gold:C.sodium;c.fillRect(x-r*0.38,y-r*0.55,r*0.22,r*0.16);c.fillRect(x+r*0.16,y-r*0.55,r*0.22,r*0.16);
    const hp=clamp(a.hp/a.max,0,1);c.fillStyle='rgba(0,0,0,0.5)';c.fillRect(x-r,y+r+3,r*2,3);c.fillStyle=C.earth;c.fillRect(x-r,y+r+3,r*2*hp,3);
    c.strokeStyle=alpha(C.earth,0.5);c.lineWidth=1.5;c.beginPath();c.arc(x,y-r*0.1,r+5,-Math.PI/2,-Math.PI/2+TAU*lf);c.stroke();
  } else if(a.kind==='drone'){
    const x=a.x,y=a.y+Math.sin(T*6)*1.5;
    c.strokeStyle=alpha(C.hp,0.45);c.lineWidth=1;c.setLineDash([2,3]);c.beginPath();c.moveTo(x,y);c.lineTo(player.x,player.y-6);c.stroke();c.setLineDash([]);
    c.fillStyle=alpha(C.hp,0.2);circ(c,x,y,10);c.fill();
    c.fillStyle='#3A3F4E';ell(c,x,y,7,3.2);c.fill();c.fillStyle=C.hp;circ(c,x,y,1.8);c.fill();
    c.strokeStyle=alpha(C.paper,0.6);c.lineWidth=1;c.beginPath();c.moveTo(x-9,y-3);c.lineTo(x-4,y-3);c.moveTo(x+4,y-3);c.lineTo(x+9,y-3);c.stroke();
  }
}

// ═══════════════════════════════════════════ art: enemies + boss
function drawEnemy(e){
  if(e.dead||e.spawnT>0){drawEnemyBody(e);return;}
  const c=ctx,k=clamp((e.hitT||0)/0.14,0,1);
  if(k>0){c.save();c.translate(e.x+(e.hdx||0)*3*k,e.y+(e.hdy||0)*3*k);c.scale(1+0.22*k,1-0.2*k);c.translate(-e.x,-e.y);}
  drawEnemyBody(e);
  if(k>0){c.restore();}
  if(e.flash>0){c.save();c.globalAlpha=0.55*clamp(e.flash/0.09,0,1);c.fillStyle='#FFFFFF';circ(c,e.x,e.y,e.r*0.95);c.fill();c.restore();}
}
function drawEnemyBody(e){
  const c=ctx;
  if(e.dead)return;
  if(e.spawnT>0){c.save();c.translate(e.x,e.y);c.rotate(T*3);c.strokeStyle=alpha(C.ash,0.6);c.lineWidth=1.5;c.setLineDash([3,4]);circ(c,0,0,e.r*1.6);c.stroke();c.setLineDash([]);
    for(let i=0;i<4;i++){c.fillStyle=alpha(C.paper,0.5);c.save();c.rotate(i*TAU/4+T);c.fillRect(e.r*(1.6-e.spawnT),-1.5,4,3);c.restore();}c.restore();return;}
  const col=colorOf(e),fl=e.flash>0;
  c.fillStyle='rgba(0,0,0,0.35)';ell(c,e.x,e.y+e.r*0.75,e.r*0.95,e.r*0.35);c.fill();
  if(e.slowT>0){c.strokeStyle=alpha(C.water,0.7);c.lineWidth=1.5;circ(c,e.x,e.y,e.r+5);c.stroke();}
  if(e.anaT>0){c.strokeStyle=alpha(C.mercury,0.85);c.lineWidth=1.5;const s=e.r+7;for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){c.beginPath();c.moveTo(e.x+sx*s,e.y+sy*(s-5));c.lineTo(e.x+sx*s,e.y+sy*s);c.lineTo(e.x+sx*(s-5),e.y+sy*s);c.stroke();}}
  if(e.rage){c.strokeStyle=alpha(C.danger,0.5+0.4*Math.sin(T*12));c.lineWidth=2;circ(c,e.x,e.y,e.r+7);c.stroke();}
  if(e.type==='devourer'&&(e.bloomT>0||e.warnT>0)){
    const k=e.bloomT>0?1:1-e.warnT/0.7;
    c.fillStyle=alpha(C.venus,0.07*k);circ(c,e.x,e.y,170*k);c.fill();
    c.strokeStyle=alpha(C.venus,0.6*k);c.lineWidth=1.5;c.setLineDash([6,6]);circ(c,e.x,e.y,170*k);c.stroke();c.setLineDash([]);
    if(e.bloomT>0)for(let i=0;i<10;i++){const a=i/10*TAU+e.seed,f=1-((T*0.8+i*0.37)%1);c.fillStyle=alpha(C.venus,0.7*(1-f));circ(c,e.x+Math.cos(a)*165*f,e.y+Math.sin(a)*165*f,2);c.fill();}
    if(e.draining){c.strokeStyle=alpha(C.danger,0.7+0.3*Math.sin(T*20));c.lineWidth=2.5;c.beginPath();c.moveTo(e.x,e.y);c.lineTo(player.x,player.y-6);c.stroke();}
  }
  if(e.elite){
    c.strokeStyle=alpha(C.gold,0.85);c.lineWidth=2;c.setLineDash([5,3]);c.beginPath();c.arc(e.x,e.y,e.r+9,T*1.5,T*1.5+TAU);c.stroke();c.setLineDash([]);
    if(e.elite==='volatile'){c.fillStyle=alpha(C.danger,0.22+0.2*Math.sin(T*10));circ(c,e.x,e.y,e.r+5);c.fill();}
    if(e.elite==='shielded'&&e.sh>0){c.strokeStyle=alpha(C.mercury,0.35+0.5*e.sh/e.shMax);c.lineWidth=2.5;circ(c,e.x,e.y,e.r+4);c.stroke();}
    if(e.elite==='hasted'&&rand()<0.5)part(e.x+rr(-4,4),e.y+rr(-4,4),0,0,0.25,colorOf(e),3);
  }
  if(e.partner&&!e.partner.dead&&e.partner.spawnT<=0){c.strokeStyle=alpha(C.paper,0.2);c.lineWidth=1;c.setLineDash([2,5]);c.beginPath();c.moveTo(e.x,e.y);c.lineTo(e.partner.x,e.partner.y);c.stroke();c.setLineDash([]);}
  c.save();c.translate(e.x,e.y);
  switch(e.type){
    case 'hothead': case 'champion':{
      const ang=(e.st==='wind'||e.st==='charge')?Math.atan2(e.dy,e.dx):Math.atan2(player.y-e.y,player.x-e.x);
      const r=e.r*(e.st==='wind'?1+0.1*Math.sin(T*40):1),glow=e.st==='wind'||e.st==='charge'?1:0.55+0.25*Math.sin(T*4+e.seed);
      c.rotate(ang);
      c.fillStyle=fl?C.paper:'#2A1D18';ell(c,0,0,r*1.15,r*0.9);c.fill();c.strokeStyle=alpha(C.fire,0.75);c.lineWidth=1.4;c.stroke();
      c.strokeStyle=alpha(C.fire,glow);c.lineWidth=1.6;c.beginPath();c.moveTo(-r*0.7,-r*0.3);c.lineTo(-r*0.1,0);c.lineTo(-r*0.5,r*0.45);c.moveTo(-r*0.1,0);c.lineTo(r*0.5,-r*0.2);c.moveTo(r*0.1,r*0.5);c.lineTo(r*0.35,r*0.1);c.stroke();
      c.fillStyle='#E8D8C0';c.beginPath();c.moveTo(r*0.8,-r*0.55);c.quadraticCurveTo(r*1.5,-r*0.9,r*1.55,-r*0.35);c.lineTo(r*0.95,-r*0.3);c.closePath();c.fill();
      c.beginPath();c.moveTo(r*0.8,r*0.55);c.quadraticCurveTo(r*1.5,r*0.9,r*1.55,r*0.35);c.lineTo(r*0.95,r*0.3);c.closePath();c.fill();
      c.fillStyle=alpha(C.fire,glow);circ(c,r*0.85,-r*0.15,1.6);c.fill();circ(c,r*0.85,r*0.15,1.6);c.fill();
      if(e.type==='champion'){c.fillStyle='#E9C46A';c.fillRect(-r*0.15,-r*0.92,r*0.3,r*1.84);
        c.fillStyle=fl?C.paper:'#FF9F43';circ(c,r*0.55,-r*1.0,r*0.32);c.fill();circ(c,r*0.55,r*1.0,r*0.32);c.fill();}
      c.rotate(-ang);
      if(e.type==='champion'&&e.resting){c.strokeStyle=alpha(C.hp,0.6+0.3*Math.sin(T*8));c.lineWidth=2;circ(c,0,0,e.r+13);c.stroke();}
      break;}
    case 'gossip':{
      c.scale(e.face,1);const r=e.r,wob=Math.sin(T*9+e.seed);
      c.strokeStyle=alpha(C.lime,0.8);c.lineWidth=1.2;
      for(let i=0;i<4;i++){const lx=-r*0.6+i*r*0.4,ph=Math.sin(T*18+i*1.7+e.seed)*2;c.beginPath();c.moveTo(lx,r*0.5);c.lineTo(lx+ph,r*1.05);c.stroke();}
      c.fillStyle=fl?'#FFFFFF':'#E8E4DC';c.beginPath();
      for(let i=0;i<10;i++){const a=i/10*TAU,rr2=r*(0.85+0.18*Math.sin(i*2.3+e.seed));c.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}c.closePath();c.fill();
      c.strokeStyle='rgba(91,86,104,0.7)';c.lineWidth=0.8;c.beginPath();c.moveTo(-r*0.5,-r*0.4);c.lineTo(-r*0.1,-r*0.1);c.lineTo(-r*0.4,r*0.2);c.stroke();
      const m=Math.abs(wob)*r*0.35+1;c.fillStyle='#1B1A2E';ell(c,r*0.3,r*0.05,r*0.35,m);c.fill();c.strokeStyle=C.lime;c.lineWidth=1.2;ell(c,r*0.3,r*0.05,r*0.35,m);c.stroke();
      c.fillStyle='#1B1A2E';circ(c,r*0.15,-r*0.45,1.2);c.fill();
      break;}
    case 'waxer':{
      const r=e.r,melt=0.85+0.15*Math.sin(T*1.3+e.seed);
      c.fillStyle=fl?'#FFFFFF':C.wax;rrect(c,-r*0.6,-r*1.0*melt,r*1.2,r*1.8*melt,r*0.35);c.fill();
      c.fillStyle='#D9C9A6';for(let i=0;i<3;i++){const dx=-r*0.4+i*r*0.4;rrect(c,dx-1.2,-r*0.9*melt,2.4,r*(0.5+0.3*Math.sin(i+e.seed))+2,1.2);c.fill();}
      c.fillStyle='#E0D2B2';ell(c,0,r*0.8,r*0.9,r*0.3);c.fill();
      c.strokeStyle='#1B1A2E';c.lineWidth=1;c.beginPath();c.moveTo(0,-r*1.0*melt);c.lineTo(0,-r*1.25*melt);c.stroke();
      const fy=-r*1.25*melt-5,fk=1+0.15*Math.sin(T*14+e.seed);
      c.fillStyle=alpha(C.moon,0.25);circ(c,0,fy,8*fk);c.fill();
      c.fillStyle=C.moon;c.beginPath();c.moveTo(0,fy-6*fk);c.quadraticCurveTo(4*fk,fy,0,fy+3);c.quadraticCurveTo(-4*fk,fy,0,fy-6*fk);c.fill();
      c.fillStyle='#FFFFFF';circ(c,0,fy,1.3);c.fill();
      c.fillStyle='#1B1A2E';c.fillRect(-r*0.3,-r*0.3,2,2);c.fillRect(r*0.15,-r*0.3,2,2);
      break;}
    case 'devourer':{
      const r=e.r,open=e.bloomT>0?1:e.warnT>0?1-e.warnT/0.7:0.25+0.05*Math.sin(T*2+e.seed);
      c.fillStyle='#2E6B4F';for(let i=0;i<3;i++){c.save();c.rotate(i*TAU/3+e.seed);ell(c,r*0.95,0,r*0.55,r*0.25);c.fill();c.restore();}
      c.fillStyle=fl?C.paper:C.venus;
      for(let i=0;i<6;i++){c.save();c.rotate(i*TAU/6+T*(e.bloomT>0?1.5:0.3));ell(c,r*(0.35+0.45*open),0,r*(0.35+0.35*open),r*0.32);c.fill();c.restore();}
      c.fillStyle='#7A2E4E';circ(c,0,0,r*0.45);c.fill();
      c.fillStyle=e.draining?C.danger:'#2A1020';circ(c,0,0,r*0.22*(0.6+0.4*open));c.fill();
      break;}
    case 'collector':{
      c.scale(e.face,1);
      const r=e.r,sk=r*(0.7+Math.min(0.6,e.hoard/40)),stp=Math.sin(T*16+e.seed);
      c.fillStyle='#8A6A3E';circ(c,-r*0.75,-r*0.2,sk);c.fill();c.strokeStyle='#5A4528';c.lineWidth=1.2;c.stroke();
      c.beginPath();c.moveTo(-r*0.75-sk*0.4,-r*0.2-sk*0.75);c.lineTo(-r*0.75+sk*0.4,-r*0.2-sk*0.75);c.stroke();
      c.fillStyle=C.jupiter;for(let i=0;i<3;i++){circ(c,-r*0.75+Math.cos(i*2+T*3)*sk*0.4,-r*0.2-sk*0.85,1.6);c.fill();}
      c.strokeStyle='#2A2016';c.lineWidth=2;c.beginPath();c.moveTo(-r*0.2,r*0.6);c.lineTo(-r*0.3+stp*3,r*1.1);c.moveTo(r*0.25,r*0.6);c.lineTo(r*0.35-stp*3,r*1.1);c.stroke();
      c.fillStyle=fl?C.paper:'#3A2E1E';ell(c,0,0,r*0.75,r*0.8);c.fill();c.strokeStyle=C.jupiter;c.lineWidth=1.5;c.stroke();
      c.fillStyle='#2A2016';circ(c,r*0.2,-r*0.75,r*0.48);c.fill();
      c.fillStyle=C.jupiter;circ(c,r*0.4,-r*0.8,1.5);c.fill();circ(c,r*0.12,-r*0.8,1.5);c.fill();
      break;}
    case 'spotlight':{
      const r=e.r,aiming=e.aim>0;
      c.save();c.rotate(T*(aiming?4:1.2));c.fillStyle=fl?C.paper:alpha(C.sun,0.95);
      for(let i=0;i<8;i++){c.rotate(TAU/8);c.beginPath();c.moveTo(r*0.78,-r*0.24);c.lineTo(r*1.5,0);c.lineTo(r*0.78,r*0.24);c.closePath();c.fill();}
      c.restore();
      c.fillStyle=fl?C.paper:'#E9B44A';circ(c,0,0,r*0.84);c.fill();c.strokeStyle='#8A5A1E';c.lineWidth=1.3;c.stroke();
      const la=Math.atan2(player.y-e.y,player.x-e.x);
      c.fillStyle='#FFF7E0';ell(c,0,0,r*0.52,r*0.34);c.fill();
      c.fillStyle=aiming?C.danger:'#3A2210';circ(c,Math.cos(la)*r*0.22,Math.sin(la)*r*0.12,r*0.21);c.fill();
      break;}
    case 'deadline':{
      const r=e.r,st=Math.sin(T*6+e.seed)*1.5;
      c.fillStyle='#1B1A2E';c.fillRect(-r*0.6,r*0.75+st*0.3,r*0.35,r*0.35);c.fillRect(r*0.25,r*0.75-st*0.3,r*0.35,r*0.35);
      c.fillStyle=fl?C.paper:'#3B3550';rrect(c,-r*0.8,-r*0.75,r*1.6,r*1.6,2);c.fill();c.strokeStyle=C.saturn;c.lineWidth=1.8;c.stroke();
      c.strokeStyle=alpha(C.saturn,0.6);c.lineWidth=1;for(let i=1;i<3;i++){c.beginPath();c.moveTo(-r*0.8,-r*0.75+i*r*0.53);c.lineTo(r*0.8,-r*0.75+i*r*0.53);c.stroke();}
      c.fillStyle='#A3A6B4';for(let i=0;i<3;i++)c.fillRect(-r*0.18,-r*0.55+i*r*0.53,r*0.36,2);
      const cy=-r*1.05;c.fillStyle='#E8E4DC';circ(c,0,cy,r*0.48);c.fill();c.strokeStyle=C.saturn;c.lineWidth=1.5;c.stroke();
      c.strokeStyle='#1B1A2E';c.lineWidth=1.3;const a1=T*2,a2=T*0.3;c.beginPath();c.moveTo(0,cy);c.lineTo(Math.cos(a1)*r*0.38,cy+Math.sin(a1)*r*0.38);c.moveTo(0,cy);c.lineTo(Math.cos(a2)*r*0.26,cy+Math.sin(a2)*r*0.26);c.stroke();
      if(e.lvl<3){c.strokeStyle=alpha(C.saturn,0.85);c.lineWidth=2;c.beginPath();c.arc(0,cy,r*0.48+4,-Math.PI/2,-Math.PI/2+TAU*(1-e.grow/10));c.stroke();}
      break;}
  }
  c.restore();
  drawStatusMarks(e,e.r);
  if(e.stunT>0){for(let i=0;i<3;i++){const a=T*5+i*TAU/3;c.fillStyle=C.paper;c.fillRect(e.x+Math.cos(a)*e.r-1.5,e.y-e.r-10+Math.sin(a)*3-1.5,3,3);}}

function pick2(R,a){return a[Math.floor(R()*a.length)];}

function tileGrid(g,size,c1,c2,mortar){for(let y=0;y<H;y+=size)for(let x=0;x<W;x+=size){g.fillStyle=((x/size+y/size)%2)?c1:c2;g.fillRect(x,y,size,size);}if(mortar){g.strokeStyle=mortar;g.lineWidth=1;for(let x=0;x<=W;x+=size){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<=H;y+=size){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}}}
function crate(g,x,y,w,h2,col){g.fillStyle=col;g.fillRect(x,y,w,h2);g.strokeStyle='rgba(0,0,0,0.35)';g.lineWidth=1;g.strokeRect(x+0.5,y+0.5,w-1,h2-1);g.beginPath();g.moveTo(x,y+h2/2);g.lineTo(x+w,y+h2/2);g.stroke();}
function lantern(g,x,y,col){lightPool(g,x,y,26,col,0.45);g.fillStyle=col;ell(g,x,y,5,6.5);g.fill();g.fillStyle='rgba(0,0,0,0.3)';g.fillRect(x-5,y-1,10,1);g.fillStyle='#1A1A1A';g.fillRect(x-2,y-8,4,2);}
// ═══ environment art: layered, organic top-down pixel tiles (light from top-left, shadows fall bottom-right)
// Rule for readability: tall/bright detail lives in the border band; the fighting floor stays flat and calmer.
const OL='#24160C';
function shadow(g,x,y,rx,ry){g.fillStyle='rgba(20,14,6,0.28)';ell(g,x+2,y+2,rx,ry);g.fill();}

  g.fillStyle=pal[0];g.fillRect(x0,y0,w,h);
  for(let i=0;i<w*h/2200;i++){g.fillStyle=pick2(R,[pal[2],pal[3]]);ell(g,x0+R()*w,y0+R()*h,R()*40+16,R()*22+10);g.fill();}
  for(let i=0;i<w*h/55;i++){g.fillStyle=pick2(R,pal);g.fillRect(x0+Math.floor(R()*w/2)*2,y0+Math.floor(R()*h/2)*2,2,2);}
  for(let i=0;i<w*h/500;i++){const x=x0+R()*w,y=y0+R()*h;g.fillStyle='#4F8436';g.fillRect(x,y,1,3);g.fillRect(x+2,y-1,1,4);g.fillRect(x+4,y,1,3);g.fillStyle='#9FD06E';g.fillRect(x+2,y-1,1,1);}
  for(let i=0;i<w*h/1800;i++){const x=x0+R()*w,y=y0+R()*h;g.fillStyle='#4F8436';g.fillRect(x,y,2,2);g.fillRect(x+2,y+1,2,2);g.fillRect(x+1,y+2,2,2);}

function sprinkle(g,R,x0,y0,w,h,n,cols){for(let i=0;i<n;i++){const x=x0+R()*w,y=y0+R()*h;g.fillStyle=pick2(R,cols);g.fillRect(x,y,2,2);g.fillStyle='rgba(255,255,255,0.6)';g.fillRect(x,y,1,1);}}
function blob(g,R,cx,cy,rx,ry,col,rim){const n=40,pts=[];let k=0.92;for(let i=0;i<n;i++){const a=i/n*TAU;k=Math.max(0.8,Math.min(1.08,k+(R()-0.5)*0.09));pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);}

    g.fillStyle=pick2(R,['#C9BFAE','#B8AE9C','#D4CBBB','#ADA390']);g.fillRect(x-3,y-2,6+R()*2,5);g.fillStyle='rgba(255,255,255,0.25)';g.fillRect(x-3,y-2,6,1);if(R()<0.15){g.fillStyle='#6E9A4A';g.fillRect(x+2,y+1,2,2);}}}}}

function btnIcon(c,name,x,y,s,col){

  if(name==='sun'){circ(c,0,0,s*0.32);c.fill();for(let i=0;i<8;i++){const a=i/8*TAU;c.beginPath();c.moveTo(Math.cos(a)*s*0.5,Math.sin(a)*s*0.5);c.lineTo(Math.cos(a)*s*0.72,Math.sin(a)*s*0.72);c.stroke();}}
  else if(name==='moon'){c.beginPath();c.arc(0,0,s*0.6,Math.PI*0.35,Math.PI*1.65);c.arc(s*0.28,-s*0.05,s*0.48,Math.PI*1.45,Math.PI*0.55,true);c.closePath();c.fill();}
  else if(name==='ult'){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*0.3:s*0.7;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();}
  else if(name==='dodge'){for(const k of [-1,1]){c.beginPath();c.moveTo(-s*0.55,k*s*0.22);c.lineTo(s*0.2,k*s*0.22);c.stroke();}c.beginPath();c.moveTo(s*0.15,-s*0.5);c.lineTo(s*0.65,0);c.lineTo(s*0.15,s*0.5);c.stroke();}
  else if(name==='sword'){c.beginPath();c.moveTo(-s*0.55,s*0.55);c.lineTo(s*0.55,-s*0.55);c.stroke();c.beginPath();c.moveTo(-s*0.5,s*0.15);c.lineTo(-s*0.15,s*0.5);c.stroke();}
  else if(name==='bow'){c.beginPath();c.arc(-s*0.15,0,s*0.6,-1.2,1.2);c.stroke();c.lineWidth=1;c.beginPath();c.moveTo(-s*0.15+Math.cos(-1.2)*s*0.6,Math.sin(-1.2)*s*0.6);c.lineTo(-s*0.15+Math.cos(1.2)*s*0.6,Math.sin(1.2)*s*0.6);c.stroke();c.lineWidth=Math.max(1.6,s*0.14);c.beginPath();c.moveTo(-s*0.5,0);c.lineTo(s*0.6,0);c.stroke();}
  else if(name==='fist'){c.beginPath();rrect(c,-s*0.45,-s*0.35,s*0.9,s*0.75,s*0.2);c.fill();}
  else if(name==='dart'){c.beginPath();c.moveTo(-s*0.6,s*0.2);c.lineTo(s*0.6,-s*0.2);c.stroke();c.beginPath();c.moveTo(s*0.6,-s*0.2);c.lineTo(s*0.25,-s*0.35);c.lineTo(s*0.35,-s*0.05);c.closePath();c.fill();}
  c.restore();
}
const ATK_ICON={kairos:'sword',seren:'bow',elias:'fist',sophia:'dart',cyrus:'sword'};
function drawButton(b,label,sub,ready,col,prog,o){
  const c=ctx,pressed=b.down>0;
  c.fillStyle=alpha('#000000',pressed?0.7:0.45);circ(c,b.x,b.y,b.r);c.fill();
  c.strokeStyle=alpha(col,ready?0.95:0.28);c.lineWidth=ready?2.5:2;circ(c,b.x,b.y,b.r);c.stroke();
  if(((!ready||o.ring)&&prog>0&&prog<1)||o.ring){c.strokeStyle=o.ring||alpha(col,0.85);c.lineWidth=3;c.beginPath();c.arc(b.x,b.y,b.r-4,-Math.PI/2,-Math.PI/2+TAU*clamp(prog,0,1));c.stroke();}
  if(o.active){c.strokeStyle=alpha(col,0.5+0.4*Math.sin(T*8));c.lineWidth=2;circ(c,b.x,b.y,b.r+5);c.stroke();}
  if(o.combo){c.strokeStyle=alpha(C.gold,0.55+0.4*Math.sin(T*9));c.lineWidth=2.5;circ(c,b.x,b.y,b.r+(o.active?9:5));c.stroke();}
  c.fillStyle=ready?C.paper:alpha(C.paper,0.5);c.textAlign='center';c.textBaseline='middle';
  if(o.icon){btnIcon(c,o.icon,b.x,b.y-(sub&&ready?b.r*0.12:0),b.r*(o.big?0.62:0.7),ready?(o.iconCol||C.paper):alpha(C.paper,0.3));
    if(sub){c.font=`800 ${Math.round(clamp(b.r*(ready?0.26:0.42),8,15))}px ${FONT_UI}`;c.fillStyle=ready?alpha(col,1):C.paper;c.fillText(sub,b.x,ready?b.y+b.r*0.55:b.y+1,b.r*1.8);}
    if(o.key){c.font=`600 9px ${FONT_UI}`;c.fillStyle=alpha(C.paper,0.5);c.fillText(o.key,b.x,b.y-b.r-9);}return;}
  c.font=`600 ${Math.round(clamp(b.r*(o.big?0.27:0.28),8,12))}px ${FONT_UI}`;c.fillText(label,b.x,b.y-(sub?5:0),b.r*1.8);
  if(sub){c.font=`600 ${Math.round(clamp(b.r*0.24,8,10))}px ${FONT_UI}`;c.fillStyle=alpha(col,ready?1:0.75);c.fillText(sub,b.x,b.y+8,b.r*1.8);}
  if(o.key){c.font=`600 9px ${FONT_UI}`;c.fillStyle=alpha(C.paper,0.5);c.fillText(o.key,b.x,b.y-b.r-9);}
}
function drawBigStamp(){
  const s=bigStamp,k=Math.min(1,s.t/0.18),sc2=1+(1-k)*0.8;
  ctx.save();ctx.translate(sw/2,sh*0.45);ctx.rotate(-0.14);ctx.scale(sc2,sc2);ctx.globalAlpha=k*0.92;
  const fs=Math.round(clamp(sw*0.06,30,58));ctx.font=`700 ${fs}px ${FONT_UI}`;ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(s.text).width+36;ctx.strokeStyle=s.col;ctx.lineWidth=5;ctx.strokeRect(-w/2,-fs*0.75,w,fs*1.5);
  ctx.fillStyle=s.col;ctx.fillText(s.text,0,2);ctx.restore();
}

  clearRoom:()=>{for(const e of enemies)if(!e.dead)killEnemy(e);if(room){room.spawned=room.budget;room.collected=12;room.t=Math.max(room.t,40);if(room.champ)killEnemy(room.champ);}},

  ens:()=>enemies.filter(e=>!e.dead).map(e=>({t:e.type,x:Math.round(e.x),y:Math.round(e.y),d:Math.round(dist(e,player))})), clearEnemies:()=>{enemies=[];if(room){room.spawned=999;room.budget=999;}}, dbg:()=>({atkDown:atk.down,atkT:+atk.t.toFixed(2),tapBuf:+player.tapBuf.toFixed(2),atkCd:+player.atkCd.toFixed(2),step:player.step,shots:shots.length,useMouse,swings:swings.length,overlay:!overlay.hidden,paused}), act:a=>{actions.push(a);}, swap:i=>swapTo(i), tap:()=>KITS[player.id].tap(player), hold:()=>KITS[player.id].hold(player),
  hurt:d=>{player.iframe=0;hurtPlayer(d);}, members:()=>team.members.map(m=>({id:m.id,hp:Math.round(m.hp),down:m.down,cd:m.cd,ent:+m.entCd.toFixed(1)})),
  pause:()=>pauseGame(), resume:()=>resumeGame(), paused:()=>paused, music:()=>({id:mus.id,ac:ac&&ac.state}), aspd:()=>effAspd(player),
  step:sec=>{for(let i=0;i<sec*60;i++)tick(1/60);render();}};

// UI sounds: every button in the menus gets a voice based on what it does
function buttonSound(b){
  if(b.dataset.sound) return b.dataset.sound;
  if(b.classList.contains('toggle')) return b.getAttribute('aria-pressed')==='true'?'toggleOn':'toggleOff';
  if(b.classList.contains('card')||b.closest('.seg')) return 'select';
  if(b.classList.contains('slot')) return 'back';
  if(b.hasAttribute('data-back')||b.classList.contains('skip')) return 'back';
  if(b.classList.contains('choice')||b.hasAttribute('data-primary')||b.classList.contains('light')) return 'confirm';
  return 'click';
}
overlay.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b||b.disabled)return;ensureAudio();sfx(buttonSound(b));});
let lastHover=null;
overlay.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest&&e.target.closest('button');if(b&&b!==lastHover){lastHover=b;sfx('hover');}else if(!b)lastHover=null;});

resize();
goHome();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
