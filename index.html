<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141B16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starfall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Starfall Ascent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: full-bleed canvas arena (the districts of Meridian); registry-form paper panels float over it between rooms. Single dark look on purpose. */
:root{
  --void:#141B16; --night:#1D2620; --panel:#2B2219; --panel-2:#3A2E21; --line:rgba(243,230,200,.22); --scrim:rgba(16,20,14,.78);
  --paper:#F6EBD2; --paper-2:#EADBB8; --ash:#C9BFA8;
  --ink:#3B2617; --ink-soft:#7A5F47; --ink-line:rgba(59,38,23,.22); --shadow:rgba(0,0,0,.55);
  --danger:#FF4D5E; --seal:#B3261E; --seal-ok:#2F5D50; --res-ink:#1F6F8B;
  --gold:#FFD166; --sodium:#FFB65C; --moon:#C7D5E8; --mercury:#59DDEB; --venus:#FF79B0; --mars:#FF9F43; --jupiter:#E9C46A; --saturn:#A78BFA; --uranus:#5FE0C8; --neptune:#7C9CFF;
  --earth:#C9A66B; --water:#6EC3FF; --air:#59DDEB; --fire:#FF9F43; --hp:#7BE0A8; --serpent:#9BE37A; --lime:#C8E86B; --wax:#F1E3C4; --sun:#FFE08A; --star-ink:#8A5A00;
  --role-dps:#FF9F43; --role-sub:#59DDEB; --role-shield:#C9A66B; --role-heal:#7BE0A8; --role-burst:#E9C46A;
  --f-display:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-form:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--paper);overflow:hidden;font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safe-probe{position:fixed;inset:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

#overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--scrim);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay[hidden],[hidden]{display:none!important}
#overlay>*{margin:auto}
#overlay.mode-dialog{background:transparent;padding:0}
#overlay.mode-title{background:radial-gradient(ellipse at 50% 55%,var(--scrim) 0%,var(--scrim) 35%,transparent 80%)}

/* Home */
.title-card{text-align:center;max-width:580px;display:flex;flex-direction:column;align-items:center;gap:10px}
.eyebrow{margin:0;font:600 11px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}
.title-card h1{margin:0;font:700 clamp(46px,9vw,88px)/.9 var(--f-display);letter-spacing:.2em;color:var(--paper);text-indent:.2em}
.title-card .sub{margin:0;font:600 clamp(18px,3vw,26px) var(--f-display);letter-spacing:.35em;color:var(--sodium);text-indent:.35em}
.title-card .blurb{margin:4px 0 2px;font:15px/1.45 var(--f-form);color:var(--paper);max-width:46ch}
.title-card .hint{margin:0;font:12px/1.5 var(--f-ui);color:var(--ash);max-width:60ch}
.title-card .hint,.title-card .blurb{text-shadow:0 1px 3px var(--void),0 0 8px var(--void)}
.home-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-row .btn{min-width:150px;font-size:14px;padding:12px 22px}
.btn.light{background:var(--paper);color:var(--void);border-color:var(--paper)}
.btn.outline{background:transparent;color:var(--paper);border-color:var(--paper)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* Dialogue */
.dlg-wrap{position:absolute;inset:0;margin:0!important;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--scrim) 0%,transparent 70%)}
.dlg{width:100%;max-width:700px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sodium);padding:12px 16px 10px;display:flex;flex-direction:column;gap:6px}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:18px}
.who{font:600 11px var(--f-ui);letter-spacing:.18em;text-transform:uppercase}
.say{margin:0;font:16px/1.45 var(--f-form);color:var(--paper);min-height:2.9em;flex:1;min-width:0}
.dlg-body{display:flex;gap:12px;align-items:flex-start}
.face{flex:none;width:44px;height:44px}
.face canvas{width:44px;height:44px;border-radius:2px;display:block}
.mono{display:flex;width:44px;height:44px;align-items:center;justify-content:center;border:1.5px solid;font:700 22px var(--f-display);border-radius:2px;background:var(--night)}
.say.narr{color:var(--ash);font-style:italic}
.more{font:11px var(--f-ui);color:var(--ash);text-align:right;letter-spacing:.08em}
.skip{background:transparent;border:1px solid var(--line);color:var(--ash);font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer;border-radius:2px}

/* Party select */
.select{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:10px}
.select-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.select-head h2{margin:0;font:700 26px/1 var(--f-display);color:var(--paper)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:6px 10px;border-radius:2px;font:inherit;cursor:pointer;min-width:0}
.slot.empty{border-style:dashed;color:var(--ash);grid-template-columns:1fr;min-height:58px;cursor:default}
.slot canvas{grid-row:span 2;width:44px;height:44px;background:var(--night);border-radius:2px}
.slot .nm{font:700 16px/1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .rl{font:600 9px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.slot:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.select-body{display:grid;grid-template-columns:minmax(210px,250px) 1fr;gap:12px;align-items:start}
@media (max-width:640px){.select-body{grid-template-columns:1fr}.slots{grid-template-columns:1fr}}
.select-body>*{min-width:0}
.roster{display:flex;flex-direction:column;gap:6px;min-width:0}
.card{display:grid;grid-template-columns:48px 1fr;gap:2px 10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:6px 10px;cursor:pointer;border-radius:2px;font:inherit;min-width:0;position:relative}
.card[aria-pressed="true"]{border-color:var(--sodium);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--sodium)}
.card:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.card canvas{grid-row:span 2;width:48px;height:48px;background:var(--night);border-radius:2px}
.card .nm{font:700 18px/1 var(--f-display)}
.card .rl{font:600 9px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.badge{position:absolute;top:6px;right:8px;font:600 9px var(--f-ui);letter-spacing:.1em;color:var(--void);background:var(--sodium);padding:1px 5px;border-radius:2px}
.note{margin:0;font:12px var(--f-ui);color:var(--sodium);min-height:1.2em}
.role-dps{color:var(--role-dps)} .role-sub{color:var(--role-sub)} .role-shield{color:var(--role-shield)} .role-heal{color:var(--role-heal)} .role-burst{color:var(--role-burst)}
.dossier{max-width:none}
.dossier .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.bigthree{display:flex;gap:6px 14px;flex-wrap:wrap;font:600 11px var(--f-ui);letter-spacing:.06em;color:var(--ink-soft);margin:2px 0 8px}
.bigthree b{color:var(--ink)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px;margin:0 0 10px}
.stat{display:flex;flex-direction:column;gap:3px;font:600 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{display:flex;justify-content:space-between;gap:6px}
.stat .v b{color:var(--ink);font-variant-numeric:tabular-nums}
.pips5{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.pips5 i{height:5px;background:var(--ink-line)}
.pips5 i.on{background:var(--ink)}
.mech{margin:0 0 8px;padding:6px 10px;border-left:3px solid var(--ink);background:var(--paper-2);font:13px/1.4 var(--f-form)}
.skills{display:flex;flex-direction:column;gap:8px}
.skill{border-top:1px solid var(--ink-line);padding-top:7px;display:flex;flex-direction:column;gap:3px}
.skill .top{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.skill .kind{font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.skill .sn{font:700 17px/1.1 var(--f-display);color:var(--ink)}
.skill p{margin:0;font:13px/1.4 var(--f-form);color:var(--ink)}
.skill p b{font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chip{font:600 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);padding:1px 6px;color:var(--ink);border-radius:2px;white-space:nowrap}
.chip.el-fire{border-color:var(--mars);background:var(--mars)} .chip.el-water{border-color:var(--water);background:var(--water)}
.chip.el-air{border-color:var(--air);background:var(--air)} .chip.el-earth{border-color:var(--earth);background:var(--earth)}

/* Registry forms */
.form{background:var(--paper);color:var(--ink);width:100%;max-width:660px;padding:14px 18px 16px;position:relative;box-shadow:0 18px 50px var(--shadow);border-radius:2px}
.form-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font:600 10px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--ink-line);padding-bottom:6px;margin-bottom:10px}
.form h2{margin:0 0 4px;font:700 24px/1.1 var(--f-display);text-wrap:balance;padding-right:130px}
.form .lede{margin:0 0 10px;font:14px/1.4 var(--f-form);color:var(--ink);max-width:62ch}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.choice{text-align:left;background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;border-radius:2px}
.choice:hover{background:var(--paper-2)}
.choice:focus-visible,.btn:focus-visible,.skip:focus-visible,.seg button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.choice .tag{font:600 10px/1.3 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.choice h3{margin:0;font:700 19px/1.1 var(--f-display);display:flex;align-items:center;gap:8px}
.choice p{margin:0;font:13px/1.35 var(--f-form)}
.choice .reward{color:var(--ink-soft)}
.choice .res{font:600 10px/1.3 var(--f-ui);letter-spacing:.06em;color:var(--res-ink);text-transform:uppercase}
.choice .key{font:600 10px var(--f-ui);color:var(--ink-soft);margin-left:auto}
.glyph{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",var(--f-display);font-size:24px;line-height:1;width:1.2em;text-align:center}
.stamp{position:absolute;top:34px;right:16px;border:3px solid currentColor;padding:2px 10px;font:700 15px var(--f-ui);letter-spacing:.14em;transform:rotate(-9deg);opacity:.88;pointer-events:none}
.stamp.ok{color:var(--seal-ok)} .stamp.bad{color:var(--seal)}
.btn{font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.select .row{margin-top:0;justify-content:flex-end}
.serpent{margin:12px 0 0;font:13px/1.4 var(--f-form);color:var(--ink-soft)}
.serpent b{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0 4px;font:11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats b{display:block;font:700 20px var(--f-display);color:var(--ink);letter-spacing:0;text-transform:none}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{font:600 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--ink);border:0;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seglabel{font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* Builds: Recollection + Star Fragments */
.vault{width:100%;max-width:1060px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:grid;grid-template-columns:36px 1fr;gap:0 8px;align-items:center;background:var(--panel);border:1px solid var(--line);color:var(--paper);padding:5px 9px;border-radius:2px;cursor:pointer;font:inherit;text-align:left;min-width:150px;flex:1}
.tab[aria-pressed="true"]{border-color:var(--sodium);box-shadow:inset 0 -3px 0 var(--sodium)}
.tab:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.tab canvas{grid-row:span 3;width:36px;height:36px}
.tab .nm{font:700 15px/1 var(--f-display)}
.tab .lv{font:600 9px var(--f-ui);letter-spacing:.08em;color:var(--ash);text-transform:uppercase}
.xpbar{height:4px;background:var(--line);margin-top:2px}
.xpbar i{display:block;height:100%;background:var(--sodium)}
.vault-body{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:10px;align-items:start}
@media (max-width:720px){.vault-body{grid-template-columns:1fr}}
.vault-body>*{min-width:0}
.bv-body{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(250px,320px);gap:10px;align-items:start}
.bv-body>*{min-width:0;box-sizing:border-box}
.bv-scroll,.bv-tabs,.bv-detail,.vault,#overlay{scrollbar-width:none;-ms-overflow-style:none}
.bv-scroll::-webkit-scrollbar,.bv-tabs::-webkit-scrollbar,.bv-detail::-webkit-scrollbar,.vault::-webkit-scrollbar,#overlay::-webkit-scrollbar{display:none;width:0;height:0}
.bv-view{align-self:flex-start;background:#F6EBD2;border-radius:8px;padding:3px}
.bv-view button{color:#3B2617}.bv-view button[aria-pressed="true"]{background:#3B2617;color:#F6EBD2}
.bv-tabs{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bv-tabs .tab{min-width:0}
.bv-tabs .tab .xpbar{display:none}
.bv-tip{margin:0 0 4px;font:700 11px var(--f-ui);letter-spacing:.06em;color:var(--ink-soft)}
.bv-slot{display:flex;gap:9px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--ink-line);border-left:4px solid var(--el,var(--ink-line));border-radius:6px;padding:7px 8px;margin-top:6px;cursor:pointer}
.bv-slot.on{border-color:var(--ink);background:rgba(201,162,90,0.18);box-shadow:0 0 0 2px #C9A25A}
.bv-slot .bd{display:flex;flex-direction:column;gap:2px;min-width:0}
.bv-sk{display:flex;gap:5px;align-items:center;font:800 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.bv-on{margin-left:auto;background:#3B2617;color:#F6EBD2;border-radius:10px;padding:1px 7px;font-size:9px}
.bv-sp{font:600 10px var(--f-ui);color:var(--ink-soft)}
.bv-nm{font:700 14px var(--f-display)}
.bv-gem{width:34px;height:34px;border:2px dashed var(--ink-line);border-radius:8px;display:grid;place-items:center;font:800 18px var(--f-ui);color:var(--ink-soft);flex:0 0 auto}
.bv-bonus{margin-top:8px}.bv-bonus summary{cursor:pointer;font:800 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.bv-for{display:flex;gap:6px;align-items:center;font:600 12px var(--f-form)}
.bv-scroll{max-height:min(56vh,520px);overflow:auto;padding:2px;overscroll-behavior:contain}
.bv-detail{position:sticky;top:8px;max-height:calc(100dvh - 30px);overflow:auto}
.bv-detail .detail{position:relative;margin:0;background:var(--paper,#F6EBD2)}
.bv-detail.empty{border:1.5px dashed var(--ink-line);border-radius:6px;padding:14px}
.bv-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:800 16px/1 var(--f-ui);cursor:pointer;color:inherit}
.bv-equip{width:100%;margin:2px 0 4px}
.bv-salv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px;padding:6px 8px;border:1.5px dashed #B5523A;border-radius:8px;background:rgba(181,82,58,0.08)}
.ftiles.salv .ftile{cursor:pointer}.ftile.pick{outline:3px solid #B5523A;outline-offset:-3px;background:rgba(181,82,58,0.15)!important}.ftile.pick::after{content:'✕';position:absolute;bottom:3px;right:5px;font:900 12px var(--f-ui);color:#B5523A}.ftile.locked{opacity:.45}
.sk-row{display:flex;gap:10px;align-items:center;border:1.5px solid var(--ink-line);border-radius:8px;padding:8px 10px;margin-top:6px}
.sk-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3B2617;color:#F6EBD2;flex:0 0 auto}
.sk-bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.sk-k{font:800 9px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.sk-bar{display:flex;gap:3px}.sk-bar i{flex:1;height:6px;border-radius:3px;background:rgba(59,38,23,.18)}.sk-bar i.on{background:#C9A25A}.sk-bar i.lock{background:repeating-linear-gradient(45deg,rgba(59,38,23,.18) 0 3px,transparent 3px 6px)}
.sk-fx{font:600 11px var(--f-form);color:var(--ink-soft)}.sk-max{font:900 12px var(--f-ui);color:#C9A25A}
.bv-cmp{margin:0;font:600 12px var(--f-form);color:var(--ink-soft)}
@media (max-height:520px){
  .vault{gap:6px}.vault .select-head .eyebrow{display:none}.vault .select-head h2{font-size:17px;margin:0}
  .bv-tabs{display:flex!important;flex-wrap:nowrap;overflow-x:auto}.bv-tabs .tab{flex:0 0 auto}
  .bv-tabs .tab .lv{display:none}.bv-tabs .tab{min-width:auto;padding:3px 8px}.bv-tabs .tab canvas{width:26px!important;height:26px!important}
  .bv-view button{padding:3px 10px}
  .bv-body{grid-template-columns:150px minmax(0,1fr)!important}
  .bv-left .form-head,.bv-left .bv-tip,.bv-left .setbox,.bv-left .bv-bonus,.bv-sp,.bv-left .chips{display:none!important}
  .bv-left{display:block!important;padding:6px!important}
  .bv-left .bv-slot{flex-direction:row!important;padding:5px 6px;margin-top:4px}
  .bv-right .fcount,.bv-right .form-head{display:none}
  .bv-sk .bv-on{display:none}.bv-sk{font-size:9px;letter-spacing:.06em;flex-wrap:wrap}.bv-nm{font-size:12px}

<body>

<canvas id="game" aria-label="Starfall game area"></canvas>
<div id="safe-probe"></div>
<div id="overlay" hidden></div>
<div id="tip" role="status" aria-live="polite" hidden></div>
<div id="tut" role="status" aria-live="polite" hidden></div>
<div id="rotate" role="alert">
  <div class="phone"></div>
  <small>Starfall · The Ascent</small>
  <p>Turn your phone sideways to play.</p>
</div>

<script>
'use strict';
(function(){
// ═══════════════════════════════════════════ helpers
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rand=Math.random;
const rr=(a,b)=>a+rand()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pick=a=>a[Math.floor(rand()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return Math.abs(d);};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const rootStyle=getComputedStyle(document.documentElement);
const C={};
['void','night','panel','ink','paper','ash','danger','gold','sodium','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','earth','water','air','fire','hp','serpent','lime','wax','sun'].forEach(k=>{C[k]=rootStyle.getPropertyValue('--'+k).trim()||'#ffffff';});
function alpha(hex,a){const n=parseInt(hex.replace('#',''),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT_UI='"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif';
const FONT_DISP='"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif';
const PREF_KEY='starfall-ascent-prefs';
function loadPrefs(){try{return JSON.parse(localStorage.getItem(PREF_KEY)||'{}')||{};}catch(_){return {};}}
function savePrefs(p){try{localStorage.setItem(PREF_KEY,JSON.stringify(Object.assign(loadPrefs(),p)));}catch(_){}}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// ═══════════════════════════════════════════ state
let state='title';   // title | dialog | play | between | panel | dying
let run=null, room=null, team=null, player=null, boss=null;
let falls=[],stepT=0,loots=[],chests=[],enemies=[],shots=[],bullets=[],allies=[],zones=[],meteors=[],tels=[],sparks=[],orbs=[],parts=[],texts=[],decals=[],beams=[],swings=[],amb=[],rays=[];
let T=0, shakeT=0, shakeM=0, slowReal=0, betweenT=0, betweenCb=null, bigStamp=null, deathT=0, autoTest=false, paused=false;

// ═══════════════════════════════════════════ canvas + layout
const cv=$('#game');let ctx=cv.getContext('2d');
const probe=$('#safe-probe'), overlay=$('#overlay');
let dpr=1,sw=0,sh=0,scale=1,ox=0,oy=0;
let W=800; const H=400;
let AX0=18,AY0=18,AX1=W-18,AY1=H-18;
const safe={t:0,r:0,b:0,l:0};
const btn={atk:{},dodge:{},sun:{},moon:{},ult:{},pause:{}};
for(const k in btn) Object.assign(btn[k],{x:0,y:0,r:30,down:0});
const ports=[{},{},{}];
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  sw=window.innerWidth; sh=window.innerHeight;
  cv.width=Math.round(sw*dpr); cv.height=Math.round(sh*dpr);
  const ps=getComputedStyle(probe);
  safe.t=parseFloat(ps.paddingTop)||0; safe.r=parseFloat(ps.paddingRight)||0;
  safe.b=parseFloat(ps.paddingBottom)||0; safe.l=parseFloat(ps.paddingLeft)||0;
  W=Math.round(clamp(H*sw/Math.max(1,sh),620,900));
  AX1=W-18; AY1=H-18;
  scale=Math.min(sw/W,sh/H); ox=(sw-W*scale)/2; oy=(sh-H*scale)/2;
  const R=clamp(Math.min(sw,sh)*0.098,30,44);
  const ax=sw-safe.r-14-R, ay=sh-safe.b-12-R, d=R*1.98, sr=R*0.6;
  Object.assign(btn.atk,{x:ax,y:ay,r:R});
  const P=(deg,o)=>Object.assign(o,{x:ax+Math.cos(deg*Math.PI/180)*d,y:ay-Math.sin(deg*Math.PI/180)*d,r:sr});
  P(188,btn.dodge); P(150,btn.sun); P(116,btn.moon); P(83,btn.ult);
  Object.assign(btn.pause,{x:sw-safe.r-26,y:safe.t+22,r:16});
  const py0=Math.max(safe.t+110,sh*0.36),pr=clamp(sh*0.045,15,20);
  ports.forEach((p,i)=>Object.assign(p,{x:safe.l+30,y:py0+i*(pr*2+10),r:pr}));
  if(player){player.x=clamp(player.x,AX0+player.r,AX1-player.r);}
  for(const e of enemies){e.x=clamp(e.x,AX0+e.r,AX1-e.r);}
  bgKey='';titleKey='';
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));

// ═══════════════════════════════════════════ input
const keys=Object.create(null); const actions=[];
let isTouch=matchMedia('(pointer: coarse)').matches, useMouse=false, aimByMouse=false;
const joy={id:null,ox:0,oy:0,x:0,y:0};
const atk={down:false,t:0,released:false,pid:null};
const mouse={wx:0,wy:0,inside:false};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code]=true;
  if(e.repeat) return;
  ensureAudio();
  if(!overlay.hidden){panelKey(e);return;}
  if(state!=='play') return;
  if(e.code==='Escape'||e.code==='KeyP'){sfx('pause');pauseGame();return;}
  aimByMouse=useMouse&&mouse.inside;
  if(e.code==='KeyJ'||e.code==='KeyF'){atkPress(null);}
  else if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight') actions.push('dodge');
  else if(e.code==='KeyQ') actions.push('sun');
  else if(e.code==='KeyE') actions.push('moon');
  else if(e.code==='KeyR') actions.push('ult');
  else if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3') actions.push('swap'+(+e.code.slice(5)-1));
});

function inputVec(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x-=1; if(keys.KeyD||keys.ArrowRight)x+=1;
  if(keys.KeyW||keys.ArrowUp)y-=1; if(keys.KeyS||keys.ArrowDown)y+=1;
  const m=Math.hypot(x,y); if(m>0){x/=m;y/=m;}
  if(joy.id!==null){
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),R=52;
    if(d>R){joy.ox=joy.x-dx/d*R;joy.oy=joy.y-dy/d*R;}
    if(d>7){const k=Math.min(1,d/R);x=dx/d*k;y=dy/d*k;}
  }
  return {x,y};
}

function noiseHit(t,dur,v,type,freq){
  const s=ac.createBufferSource();s.buffer=mus.noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(mus.out);s.start(t);s.stop(t+dur+0.02);
}
function playStep(tr,s,t,spb){
  const sc=SCALES[tr.scale],n=sc.length,deg=tr.prog[mus.bar%tr.prog.length];
  const nt=(d,oct)=>{const o=Math.floor(d/n),i=((d%n)+n)%n;return NOTE(tr.root+12*(oct+o)+sc[i]);};
  const on=p=>p&&p[s]==='x';
  if(tr.pad&&s===0)for(const d of [0,2,4])voice(nt(deg+d,0),t,spb*16*1.05,'sawtooth',0.03,{cut:700,att:0.6,detune:(d-2)*6});
  if(on(tr.bass))voice(nt(deg,-1),t,spb*1.6,tr.bassWave||'triangle',0.15,{cut:tr.bassWave==='sawtooth'?600:1200});
  if(on(tr.arp)){const ch=[0,2,4,7,4,2],k=ch[(s+mus.bar)%ch.length];
    voice(nt(deg+k,(tr.arpOct||2)-1),t,spb*(tr.arpLen||1.4),tr.arpWave||'triangle',tr.arpVol||0.05,{cut:tr.arpWave==='sine'?0:2400,send:!!tr.delay});}
  if(tr.bell&&(s===0||s===8))voice(nt(deg+4,2),t,1.6,'sine',0.045,{send:true});
  if(on(tr.kick)){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.18);
    g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.connect(g);g.connect(mus.out);o.start(t);o.stop(t+0.3);}
  if(on(tr.hat))noiseHit(t,0.035,0.045,'highpass',7000);
  if(on(tr.snare)){noiseHit(t,0.14,0.11,'bandpass',1800);voice(190,t,0.08,'triangle',0.05);}
}

let saveWarn='';
function loadSave(){
  let raw=null,s=null;try{raw=localStorage.getItem(SAVE_KEY);}catch(_){saveWarn='This browser blocks saving. Progress will be lost when you close the page.';}
  if(raw){try{s=JSON.parse(raw);}catch(_){s=null;}
    if(!s||typeof s!=='object'||!s.chars||typeof s.chars!=='object'){
      try{localStorage.setItem(SAVE_KEY+'-broken-'+Date.now(),raw);}catch(_){}
      saveWarn='Your save could not be read, so a new one was started. A copy of the old one was kept on this device.';s=null;}}
  if(!s)s={chars:{},frags:[],dust:0,nextId:1};
  s.v=1;
  s.frags=Array.isArray(s.frags)?s.frags:[];s.dust=s.dust|0;s.nextId=s.nextId||1;
  for(const id of CH_ORDER)if(!s.chars[id])s.chars[id]={xp:0,lvl:1,slots:{sun:null,moon:null,rising:null}};
  return s;
}

function exportCode(){const json=JSON.stringify({k:'sfa',v:1,save,at:Date.now()});return 'SFA1-'+btoa(unescape(encodeURIComponent(json)));}
function importCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(!code.startsWith('SFA1-'))throw new Error('That is not a Starfall backup code. It should start with SFA1-');
  let o;try{o=JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));}catch(_){throw new Error('The code is damaged or incomplete. Copy the whole thing.');}
  if(!o||o.k!=='sfa'||!o.save||!o.save.chars)throw new Error('The code is damaged or incomplete. Copy the whole thing.');
  return o;
}

function skMul(id,k){return 1+0.05*(skLv(id,k)-1);}
function skCost(lv){return {mp:lv,dust:15*lv};}
function giveMp(ids,n){if(n<=0)return;for(const id of ids){const c=save.chars[id];c.mp=(c.mp|0)+n;}}
// Memories drop from Vices; the total is split between the party at the end of the stage
function memDrop(e){if(!run||run.practice)return;const v=e.type==='champion'?30:e.elite?12:e.gen?1.5:4.5;run.mem=(run.mem||0)+v;
  if(rand()<0.6)part(e.x,e.y-6,rr(-30,30),-rr(40,90),0.7,'#B9A6FF',2.6);}
function memShare(){return Math.round((run.mem||0)/Math.max(1,run.party.length)*1.5);}
function giveXp(ids,xp){const ups=[];
  for(const id of ids){const s=save.chars[id];let up=false;
    if(s.lvl<MAX_LVL){s.xp+=xp;while(s.lvl<MAX_LVL&&s.xp>=xpNeed(s.lvl)){s.xp-=xpNeed(s.lvl);s.lvl++;up=true;}if(s.lvl>=MAX_LVL)s.xp=0;}
    ups.push({id,lvl:s.lvl,up});}
  return ups;}
function storyMissionAward(){
  if(!run||run.awarded)return null;run.awarded=true;
  const xp=Math.round(20+memShare()),dust=Math.round(5+run.kills*0.5);
  const ups=giveXp(run.party,xp);save.dust+=dust;giveMp(run.party,2);persist();
  const up=ups.filter(u=>u.up).map(u=>nameOf(u.id)+' Lv '+u.lvl);
  setBanner('Memories +'+xp+' each · Mastery +2',(up.length?'Level up: '+up.join(' · ')+' · ':'')+'+'+dust+' Stardust',1.4);
  return {xp,ups,dust,mp:2};}
function awardRun(won){
  if(!run||run.awarded)return null;run.awarded=true;
  if(run.practice)return {xp:0,ups:run.party.map(id=>({id,lvl:save.chars[id].lvl,up:false})),dust:0};
  // P1-7: starting Blessings make Battle easier, so they pay less (None 100%, Lv 1 60%, Lv 3 25%)
  const farm=run.mode==='battle'?[1,0.6,0.6,0.25][run.bless|0]:1;
  const mem=memShare(),xp=Math.round((mem+(run.mode==='battle'?10:run.roomNo*10)+(won?40:0))*farm);
  const ups=giveXp(run.party,xp);
  const d=ROOMS[run.stage]||{};
  const mp=Math.round((!won?1:d.kind==='rift'?1+(run.tier||1):run.stage==='boss'?3+2*(run.diff|0):d.kind==='trial'?2:run.mode==='climb'?6:1)*(farm>=1?1:farm>0.5?0.5:0.25))||0;
  giveMp(run.party,mp);
  const dust=Math.round(run.kills*0.5*farm);save.dust+=dust;persist();
  return {xp,ups,dust,mp,mem:Math.round(run.mem||0)};
}

function heal(m,amt,o={}){
  if(!m||m.down||amt<=0)return 0;
  if(o.sophia&&m.hp<m.maxHp*0.4)amt*=1.3;
  if(o.by)amt*=starFx(o.by).healMul;
  amt*=1+(m.bfx.heal||0)+0.15*blv('venus')+(inParty('dess')?0.1:0);
  const before=m.hp;m.hp=Math.min(m.maxHp,m.hp+amt);const got=m.hp-before,over=amt-got;
  if(over>0&&team.overheal>0&&m===player)addShield(over,6,true);
  if(o.show&&m===player&&got>=1)addText(m.x,m.y-30,'+'+Math.round(got),C.hp,11);
  return got;
}
function addShield(v,t,carry){
  v*=1+((player&&player.bfx.shield)||0)+0.15*blv('saturn')+(rul('saturn')?0.1:0)+(modOn('shield')?0.3:0)+(inParty('dess')?0.1:0);
  const s=team.shield;
  if(s){s.hp+=v;s.max=Math.max(s.max,s.hp);s.t=Math.max(s.t,t);s.carry=s.carry||carry;}
  else team.shield={hp:v,max:v,t,carry};
}
function resOf(def){
  if(!def||!def.sign||!team)return null;
  for(const m of team.members){const c=m.ch;
    if(c.sun===def.sign)return nameOf(m.id)+'’s '+def.sign+' Sun';
    if(c.moon===def.sign)return nameOf(m.id)+'’s '+def.sign+' Moon';
    if(c.rising===def.sign)return nameOf(m.id)+'’s '+def.sign+' Rising';}
  return null;
}

function nearestTarget(x,y,maxD,ex){
  let best=null,bd=maxD;
  for(const e of enemies){if(e.dead||e.spawnT>0||(ex&&ex.has(e)))continue;const d=Math.hypot(e.x-x,e.y-y)-e.r;if(d<bd){bd=d;best=e;}}
  if(boss&&!boss.dead&&boss.entering<=0&&!(ex&&ex.has(boss))){const d=Math.hypot(boss.x-x,boss.y-y)-boss.r;if(d<bd){bd=d;best=boss;}}
  return best;
}
function aimDir(range){
  const p=player;
  if(aimByMouse&&mouse.inside){const dx=mouse.wx-p.x,dy=mouse.wy-p.y,d=Math.hypot(dx,dy)||1;if(d>8)return {x:dx/d,y:dy/d};}
  const v=inputVec(),mv=Math.hypot(v.x,v.y)>0.3,fa=mv?Math.atan2(v.y,v.x):Math.atan2(p.fy,p.fx);
  let best=null,bs=Infinity;
  for(const t of allTargets()){const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy)-(t.r||12);if(d>range)continue;
    const sx=ox+t.x*scale,sy=oy+t.y*scale;if(t!==boss&&(sx<safe.l+4||sx>sw-safe.r-4||sy<safe.t+4||sy>sh-safe.b-4))continue;
    const sc=Math.max(0,d)*(1+0.9*angDiff(Math.atan2(dy,dx),fa)/Math.PI)*(t===boss?0.8:1);if(sc<bs){bs=sc;best=t;}}
  if(best){const dx=best.x-p.x,dy=best.y-p.y,d=Math.hypot(dx,dy)||1;return {x:dx/d,y:dy/d};}
  if(mv){const m=Math.hypot(v.x,v.y);return {x:v.x/m,y:v.y/m};}
  return {x:p.fx,y:p.fy};
}
function faceTo(a){player.fx=a.x;player.fy=a.y;if(Math.abs(a.x)>0.1)player.face=a.x>0?1:-1;}
function allTargets(){const l=enemies.filter(e=>!e.dead&&e.spawnT<=0);if(boss&&!boss.dead&&boss.entering<=0)l.push(boss);return l;}
function meleeArc(a,range,half,dmg,o){

function lossUpdate(b,dt){

    addText(player.x,player.y-42,'Fine. My minute.',C.water,12,{life:2.6,bubble:true});

function talkBubble(c,x,y,t,fill,big){
  const w=big?20:18,h=big?20:16;

      ['voice','Only when I had to. Every time I hold the minute, the sky tears a little more. So I don’t do it often.'],
      ['voice','Today I had to. The girl is still under the beam. Go.']],{...FROZEN,fx:'flash',focus:[0.55,0.55]})]},
  {mission:'chase'},

  // ───────── SCENE 3: the first fight
  {sc:'Scene 3 · First Blood',cut:[
    pn('market',[['kairos',0.5,0.7,1,{glow:1}],['voice',0.66,0.5,1,{scale:0.8,nohands:1}]],[
      ['voice','You were there.'],
      ['kairos','Where? Wait—'],
      ['th','It fades. Of course it does.']],{...FROZEN}),
    pn('market',[['kairos',0.5,0.7,1,{glow:1}],['npc',0.72,0.68,-1,{col:TESSA,small:1}],['beam',0.86,0.82,1,{rot:0.1}]],[
      ['n','Snap. Color and noise slam back into the world. The beam crashes into the stones, a full step away from Tessa.'],
      ['tessa','…Huh? The pole moved.'],
      ['th','Everyone in the square drops to their knees, gasping. For them, no time passed. But their lungs felt a whole minute without air.']],{fx:'snap',mus:'tense'}),
    pn('market',[['kairos',0.45,0.72,1]],[
      ['th','And then the Seam opens.'],
      ['th','Not a scratch anymore. A wound. Things crawl out of it. Smoke and ash and red-hot eyes.'],
      ['kairos','Vices. In the Market Ring. In the middle of the day.'],
      ['th','I’ve never held a weapon in my life. So why do my feet already know where to stand?']],{fx:'shake',crack:1,focus:[0.5,0.45],mus:'disaster'})]},
  {mission:'first'},
  {cut:[
    pn('market',[['kairos',0.5,0.7,1]],[
      ['th','Breathe. Count. One more. One more.'],
      ['th','My hands move like they’ve done this a thousand times. I hate how easy it is.'],
      ['th','And there are still more coming.'],
      ['n','A rifle shot cracks from a rooftop. The closest Vice drops.']],{mus:'tense'}),
    pn('market',[['kairos',0.4,0.7,1],['ines',0.72,0.6,-1],['bram',0.55,0.72,-1,{fall:1}]],[
      ['ines','Civilian with the swords. Get down or keep fighting. Pick one.'],
      ['?',[
        {t:'Keep fighting.',f:'c_ines_fight',r:[['ines','Good answer.']]},
        {t:'Can I pick “run away screaming”?',f:'c_ines_joke',r:[['ines','You can. You won’t, though. I saw you fight.']]},
        {t:'Who are you?',r:[['ines','The person keeping you alive. Names later.']]}],'A soldier on the roof. With a very big rifle.'],
      ['n','A huge man in Garrison armor vaults the fruit stall, trips on a crate, and lands shield-first on a Vice. It goes flat.'],
      ['bram','I’m okay!'],
      ['ines','You’re always okay, Bram.'],
      ['bram','Sorry. Sorry, crate.'],
      ['kairos','Did he just apologize to a crate?'],
      ['ines','He does that. Bram, cover the families. Swords, you’re with me.']],{mus:'market'})]},
  {join:'ines'},{join:'bram'},
  {cut:[pn('market',[['ines',0.6,0.7,-1],['kairos',0.44,0.7,1],['bram',0.32,0.7,1]],[
      ['ines','Quick version. I shoot, and I mark targets so they take more damage. Bram stands in front and stops things from reaching people.'],
      ['ines','You hit whatever I mark. If one of us is in trouble, switch to them.'],
      ['bram','We’re a team now! For five minutes. Probably.'],
      ['th','A team. I’ve never been on one of those either.']],{mus:'market'})]},
  {mission:'garrison'},

  // ───────── SCENE 4: aftermath
  {sc:'Scene 4 · Who Are You?',cut:[
    pn('market',[['ines',0.6,0.7,-1],['kairos',0.42,0.7,1],['bram',0.72,0.7,-1]],[
      ['n','The rift seals with a sound like a heavy book slamming shut. Smoke. Silence. Fruit everywhere.'],
      ['ines','Sergeant Agnes Calder, Meridian Garrison. That’s Corporal Bram. Everybody calls him Big Boy Bram.'],
      ['bram','Hi!'],
      ['ines','You’re not army. Where did you learn to fight like that?'],
      ['kairos','I didn’t. Ten minutes ago I was buying fish.'],
      ['ines','People don’t learn to fight in ten minutes.'],
      ['kairos','I know. That’s the part that scares me.'],
      ['ines','For somebody who wanted to run away screaming, you stayed pretty well.',{if:'c_ines_joke'}],
      ['ines','You told me “keep fighting” before you even knew what you were fighting. Bad habit. Useful one.',{if:'c_ines_fight'}],
      ['ines','And the blades?'],
      ['kairos','You won’t believe me.'],
      ['ines','Everyone in this square stopped breathing for a minute, and then the sky ripped open. Try me.'],
      ['kairos','The minute didn’t stop for me. Everybody else did. A light gave me these.'],
      ['th','Agnes looks at Bram. Bram looks at Agnes. Neither of them laughs. That’s somehow worse.']],{mus:'warm'}),
    pn('market',[['kairos',0.45,0.7,1,{glow:1}],['ines',0.6,0.7,-1],['bram',0.7,0.7,-1]],[
      ['bram','Uh. Sarge. His shirt is glowing.'],
      ['ines','I can see that, Bram.'],
      ['th','A mark on my chest. A clock face with no hands. Like the one in the street. That wasn’t there this morning.'],
      ['th','My knees go first. Then the ground comes up very fast.'],
      ['bram','Got him! …Nope. I didn’t. Sorry. Sarge, is he okay?'],
      ['ines','He’s breathing. St. Lucia’s is closest. Pick him up, Corporal. We’re going.']],{fx:'flash',mus:'tense'})]},

  // ───────── SCENE 5
  {sc:'Scene 5 · Carry Him',cut:[pn('street',[['bram',0.45,0.68,1,{moving:1}],['kairos',0.452,0.6,1,{fall:1,scale:1.3}],['ines',0.62,0.66,1,{moving:1}]],[
      ['n','Ash Lane, the road to St. Lucia’s Hospital. Small rifts are still opening all over the city.'],
      ['bram','He’s light. Is he supposed to be this light?'],
      ['ines','He’s an errand boy from the Market Ring. They live on bread and favors.'],
      ['bram','I’d live on bread. Just bread. Forever.'],
      ['bram','Sarge, are you coming to the Festival this year? My mom saves me a spot in the line.'],
      ['ines','I work every Sunday, Bram. On purpose.'],
      ['ines','Stay behind me. If Vices get close, stop and let me deal with them. Switch to Bram if you want to carry him yourself.']],{mus:'tense'})]},
  {mission:'carry'},

  // ───────── SCENE 6: St. Lucia's
  {sc:'Scene 6 · St. Lucia’s',cut:[
    pn('hospital',[['noemi',0.42,0.66,1],['kairos',0.58,0.7,-1,{fall:1}],['ines',0.72,0.66,-1]],[
      ['n','St. Lucia’s Hospital, east ward. Every bed is full. Half the city came in short of breath after the stopped minute.'],
      ['noemi','Pulse normal. Oxygen normal. And “patient was glowing.” I’m writing that on my arm, because by tonight I’ll have talked myself out of it.'],
      ['ines','He was. Like a lamp.'],
      ['noemi','People don’t glow, Sergeant.'],
      ['ines','Agreed. Write that down too.']],{...NIGHT,mus:'warm'}),
    pn('hospital',[['noemi',0.42,0.66,1],['kairos',0.58,0.7,-1],['bram',0.74,0.66,-1]],[
      ['kairos','The crane— the girl. Tessa. Is she okay?'],
      ['noemi','Everyone from your square is fine. I’m Dr. Naomi Lark. What do you remember?'],
      ['kairos','All of it. Time stopped. Everybody froze. A light talked to me. I pushed the beam.'],
      ['noemi','Mm. Possibly a concussion.'],
      ['?',[
        {t:'I don’t have a concussion.',r:[['noemi','That’s exactly what people with concussions say.']]},
        {t:'What day is it? …Kidding. It’s Tuesday.',f:'c_noemi_joke',r:[['noemi','Funny. I’m still writing “possible concussion.”'],['bram','I liked it.']]},
        {t:'I remember your shoes are untied.',f:'c_noemi_sharp',r:[['noemi','…They are.'],['noemi','Fine. Your memory works. That doesn’t mean the rest of you does.']]}],'Concussion. Right.']],{...NIGHT,mus:'warm'}),
    pn('hospital',[['theo',0.3,0.66,1,{moving:1}],['noemi',0.45,0.66,-1],['kairos',0.6,0.7,-1]],[
      ['n','The door bangs open. A man with wild hair and a beeping brass box rushes in.'],
      ['theo','He doesn’t have a concussion!'],
      ['noemi','Theo. Visitors aren’t allowed in the ward.'],
      ['theo','I’m your husband, I’m allowed everywhere. Hi, I’m Theo. I build things. Listen.'],
      ['theo','At 9:04 this morning, every clock I own lost exactly sixty seconds. Not a glitch. Every clock in the city lost the same minute.'],
      ['theo','I measured where the missing minute started. The exact center was the Market Ring.'],
      ['theo','The exact center was him.'],
      ['kairos','…You believe me?'],
      ['theo','I’ve been waiting six years for something weird enough to prove I’m not crazy.']],{...NIGHT,mus:'warm'}),
    pn('hospital',[['noemi',0.36,0.66,1],['theo',0.5,0.66,-1],['kairos',0.64,0.7,-1],['ines',0.78,0.7,-1]],[
      ['kairos','Three rifts in one day. That’s never happened, right?'],
      ['ines','Not inside the walls. Not in my lifetime.'],
      ['noemi','And the people inside it are tired. Some days half my patients can’t tell me their own birthday.'],
      ['kairos','Stress?'],
      ['noemi','That’s the official answer. I write the real answers on my arm, when I have one.'],
      ['theo','She skips the Festival every year. I go for the fried dough.'],
      ['noemi','He doesn’t drink anything there. I check.']],{...NIGHT,mus:'tense'}),
    pn('hospital',[['noemi',0.42,0.66,1],['theo',0.56,0.66,-1],['kairos',0.7,0.7,-1]],[
      ['n','Every light in the ward flickers at once.'],
      ['theo','That’s not the power. My reader’s spiking. Something is tearing open inside the building.'],
      ['noemi','The far beds. Thirty patients who can barely breathe. They can’t run.'],
      ['ines','Then nothing reaches them.'],
      ['noemi','I’m coming. I can keep people standing while they fight.'],
      ['theo','And I have turrets in my bag. Please don’t ask why I carry turrets in my bag.']],{...NIGHT,fx:'shake',mus:'disaster'})]},
  {join:'noemi'},{join:'theo'},
  {mission:'lucia',pick:3,prefer:['kairos','noemi','theo'],title:'Defend St. Lucia’s',sub:'Five of you now. Only three fit between the beds. The others guard the stairs.'},
  {cut:[
    pn('hospital',[['noemi',0.45,0.7,1],['theo',0.55,0.7,-1]],[
      ['n','The rift closes. Every patient is still in their bed.'],
      ['noemi','You enjoyed that.'],
      ['theo','Parts of it.'],
      ['noemi','Me too. Don’t tell anyone.']],{...NIGHT,mus:'warm'}),
    pn('hospital',[['ines',0.32,0.7,1],['kairos',0.46,0.7,1],['theo',0.6,0.7,-1],['noemi',0.72,0.7,-1],['bram',0.2,0.7,1]],[
      ['theo','We have to report this. The Concord Council keeps every record in Meridian. Every clock, every birth.'],
      ['ines','And they’ll want to see him.'],
      ['kairos','Is that bad?'],
      ['ines','I don’t know yet. That’s why I’m coming.'],
      ['theo','Also, Kairos. You need a job? I need an assistant who remembers where I put things. It pays. In money, not bread.'],
      ['kairos','…Real money?'],
      ['theo','Mostly real.'],
      ['kairos','I told a kid this morning I help people for bread. This is a promotion.',{if:'c_bread'}],
      ['noemi','Tessa’s mother came through the ward. She says you told her girl somebody has to remember things for everyone.',{if:'c_earnest'}],
      ['noemi','That’s a heavy job to give yourself.',{if:'c_earnest'}],
      ['kairos','Somebody has to.',{if:'c_earnest'}],
      ['noemi','Tomorrow. Everyone sleeps first.']],{...NIGHT,mus:'warm'})]},

  // ───────── SCENE 7: the Concord Office
  {sc:'Scene 7 · The Concord Office',cut:[
    pn('office',[['kairos',0.4,0.7,1],['npc',0.6,0.66,-1,{col:CLERK}],['theo',0.28,0.7,1]],[
      ['th','Marble floors. Cabinets up to the ceiling. The whole city on paper.'],
      ['theo','We’re here to report a time event. And register a witness.'],
      ['clerk','Name.'],
      ['kairos','Kairos.'],
      ['clerk','Surname.'],
      ['kairos','Don’t have one. I grew up at St. Hesper’s.'],
      ['clerk','Then I’ll pull your birth record.'],
      ['kairos','What’s on it, exactly?'],
      ['clerk','You don’t know? Hour and minute of birth. The stars you were born under. Your Houses. Every child in Meridian is registered within the hour.'],
      ['theo','Your record decides your school, your work, who you’re allowed to marry. Paper is the only thing this city trusts.'],
      ['th','Every child. Within the hour.'],
      ['th','Nobody ever showed me mine.']],{cap:'The next morning. The Concord Office.',mus:'office'}),
    pn('office',[['kairos',0.4,0.7,1],['lucan',0.6,0.7,-1],['npc',0.72,0.66,-1,{col:CLERK}]],[
      ['n','A young man in a sharp grey coat takes the folder from the clerk without asking.'],
      ['clerk','Mr. Crane.'],
      ['lucan','Lucas Crane, senior clerk. Yes, that Crane. The Chancellor’s son. You can stop staring.'],
      ['n','He opens the folder. Reads it. His face doesn’t move.'],
      ['lucan','It’s blank. No hour. No stars. No Houses. Just a name, in pencil.'],
      ['lucan','Congratulations. You don’t exist.'],
      ['th','Lucas.'],
      ['th','Taller. Colder. The same crooked eyebrow when he reads.'],
      ['kairos','Lucas? It’s me.']],{mus:'tense'}),
    pn('office',[['kairos',0.4,0.7,1],['lucan',0.6,0.7,-1]],[
      ['lucan','Do I know you?'],
      ['?',[
        {t:'We shared a room for nine years.',f:'c_truth',r:[['lucan','Everyone in this building has a story about knowing the Chancellor’s son.'],['kairos','You used to steal bread and blame the cat.'],['lucan','How charming.'],['kairos','There wasn’t a cat.']]},
        {t:'…No. Sorry. Wrong person.',f:'c_lie',r:[['lucan','Clearly.'],['th','It hurts more to say it than I thought it would.']]}],'He really doesn’t remember me.'],
      ['lucan','What happened to your hands?'],
      ['kairos','A kitchen fire. A long time ago. I pulled someone out.'],
      ['lucan','How heroic. Next.'],
      ['th','But his hand on the folder tightens. Just a little.']],{focus:[0.5,0.55],zoom:0.1,mus:'sorrow'}),
    pn('office',[['kairos',0.4,0.7,1],['npc',0.62,0.68,-1,{col:MARRC}],['npc',0.74,0.66,-1,{col:'#3A4A6A'}],['bram',0.24,0.7,1]],[
      ['n','Footsteps. Two guards, and a smiling man in a white coat with reading glasses on a chain.'],
      ['marr','So this is our Unwritten. The Registry’s little blank page.'],
      ['marr','Dr. Ezekiel Marr. I study Vices for the Chancellor. And as of nine o’clock yesterday morning, I study you.'],
      ['theo','Dr. Marr, we came to report the event, not to—'],
      ['marr','And I’m so grateful you did, Mr. Lark. Truly. It saves everyone so much time.'],
      ['kairos','And if I say no?'],
      ['marr','You won’t. You’re a helpful boy. Everyone in the Market Ring says so.'],
      ['marr','Besides, you already agreed. Didn’t you? You came here on your own.']],{mus:'tense'}),
    pn('office',[['kairos',0.4,0.7,1],['ines',0.24,0.7,1],['bram',0.3,0.7,1],['npc',0.62,0.66,-1,{col:'#3A4A6A'}],['lucan',0.78,0.7,-1]],[
      ['n','The guards step forward. Bram moves to stop them. Agnes grabs his arm.'],
      ['ines','Not here. If we fight Council guards in the Council’s building, we all go to a cell, and then nobody can get him out.'],
      ['bram','But Sarge—'],
      ['ines','I know, Bram.'],
      ['kairos','It’s fine. I’ll be fine.'],
      ['th','I’m lying. I think everyone knows.'],
      ['th','At the door I look back at Lucas. He’s looking at the floor.']],{mus:'sorrow'})]},

  // ───────── SCENE 8: the lab
  {sc:'Scene 8 · This Won’t Hurt',cut:[
    pn('lab',[['kairos',0.45,0.7,1,{hurt:1}],['npc',0.6,0.68,-1,{col:MARRC}],['dess',0.76,0.7,-1]],[
      ['th','White tiles. Glass tanks full of smoky crystals. And a clock on the wall. Of course there’s a clock.'],
      ['marr','You keep looking at that. Your heart rate jumps every time it ticks.'],
      ['kairos','Could you take it down?'],
      ['marr','No. Dess, the needle.'],
      ['n','A young woman at the console flinches at her own name. Thin, quick hands. She won’t look at Kairos.'],
      ['dess','D-Doctor, his heart rate is already at one-forty, if we—'],
      ['marr','In the lab you speak when the numbers are interesting, Dess.']],{cap:'The Institute. Third sub-level.',mus:'tense'}),
    pn('lab',[['kairos',0.45,0.7,1,{hurt:1}],['npc',0.58,0.68,-1,{col:MARRC}],['dess',0.76,0.7,-1]],[
      ['marr','Relax. This won’t hurt.'],
      ['kairos','It hurts.'],
      ['marr','No, it doesn’t. You think it does. That’s just stress. Breathe for me.'],
      ['?',[
        {t:'Then you go first.',f:'c_marr_joke',r:[['marr','Ha! Oh, I like you. That will make this so much more unpleasant.']]},
        {t:'…Okay.',f:'c_marr_comply',r:[['marr','Good boy. See? Much easier when we agree.']]},
        {t:'(Say nothing. Stare at the clock.)',f:'c_marr_silent',r:[['marr','The silent ones always break the loudest. Did you know that?']]}],'A man smiling while he hurts you.'],
      ['marr','You signed the consent form at the Concord Office, by the way. You remember.'],
      ['kairos','I didn’t sign anything.'],
      ['marr','You did. You just don’t remember. That happens to everyone in this city. Even you, apparently.'],
      ['th','I remember everything. I didn’t sign.'],
      ['th','…Did I?'],
      ['th','That’s his trick. He doesn’t need the needle. He makes you doubt your own head.']],{...NIGHT,focus:[0.55,0.55],zoom:0.1,mus:'tense'}),
    pn('lab',[['kairos',0.45,0.7,1,{glow:1}],['npc',0.6,0.68,-1,{col:MARRC}],['dess',0.7,0.7,-1]],[
      ['marr','Dess. A core.'],
      ['n','She brings one: a fist-sized smoky crystal. What a Vice leaves behind when it dies. Marr presses it into Kairos’s strapped hand.'],
      ['n','The core lights up. And sings.'],
      ['n','A little girl laughing. Then a woman’s voice, tired and kind: “Come inside, little star. Your father’s home.”'],
      ['dess','…'],
      ['dess','She… she called me that. My mother called me “little star.”'],
      ['marr','Every mother in Meridian says “little star,” Dess. Interference. Put it back on the shelf.'],
      ['dess','Doctor, the resonance doubles every time the clock ticks. It isn’t syncing to the clock. It’s syncing to his pulse. That shouldn’t be possible.'],
      ['marr','There. You see? Now the numbers are interesting.'],
      ['th','He took the core away from her very fast. Faster than he does anything else.']],{...NIGHT,fx:'flash',mus:'sorrow'})]},

  // ───────── SCENE 9: Lucas remembers
  {sc:'Scene 9 · There Wasn’t a Cat',cut:[
    pn('orphanage',[['lucan',0.45,0.7,1,{moving:1}]],[
      ['lucan','“There wasn’t a cat.”',{if:'c_truth'}],
      ['lucan','“Wrong person.” He was lying. Why would a stranger lie about that?',{if:'c_lie'}],
      ['lucan','And why do I know the way here? I’ve never been to St. Hesper’s in my life.'],
      ['n','The bakery next door is closing. Warm bread. The smell hits him like a hand on the back of the neck.']],{...NIGHT,cap:'That evening. Lucas walks home the long way.',mus:'sorrow'}),
    pn('orphanage',[['kairos',0.44,0.72,1,KID],['lucan',0.56,0.72,-1,KID]],[
      ['kidl','If Sister Agathe catches us, we say the cat did it.'],
      ['kidk','There isn’t a cat.'],
      ['kidl','Then she can’t prove it wasn’t the cat.'],
      ['kidk','That’s the worst plan I’ve ever heard.'],
      ['kidl','You say that about all my plans.'],
      ['kidk','Because I remember all of them.']],{...NIGHT,cap:'Eleven years ago. The night before Adoption Day.',mus:'warm'}),
    pn('orphanage',[['kairos',0.44,0.72,1,{...KID,moving:1}],['lucan',0.58,0.74,-1,{...KID,fall:1}]],[
      ['n','A lamp tips over. The kitchen curtains catch.'],
      ['kidl','Kairos— the door’s stuck— I can’t—'],
      ['kidk','Lucas! Lucas, hold on—']],{fire:1,fx:'shake',mus:'disaster'}),
    pn('orphanage',[['kairos',0.44,0.72,1,{...KID,moving:1}],['lucan',0.58,0.74,-1,{...KID,fall:1}]],[
      ['n','And the fire stops.'],
      ['n','The flames hang still like paper cutouts. The smoke stops in the air. Only one boy is still moving.'],
      ['kidk','That sound again… tick, tick, tick. Not now. Please, not now.'],
      ['kidk','…Okay. Okay. Whatever this is, it’s helping. Lucas, give me your hand. Don’t let go.']],{...FROZEN,fire:1}),
    pn('orphanage',[['npc',0.32,0.68,1,{col:NUNC}],['npc',0.5,0.68,-1,{col:CRANEC,hat:'#1A1A28'}],['kairos',0.66,0.74,-1,{...KID,fall:1}],['lucan',0.78,0.72,-1,KID]],[
      ['matron','He pulled the other boy out through the fire, Chancellor. His hands are badly burned. He has a fever.'],
      ['crane','I came for the boy who counts. The one with the memory.'],
      ['matron','He may not recover for weeks. And the other boy keeps saying the fire stopped. Smoke does strange things to children.'],
      ['crane','And the Vices on your roof last night?'],
      ['matron','The first in years. We don’t know why they came.'],
      ['crane','I don’t have weeks.'],
      ['crane','Give me the other one.'],
      ['kidl','But I— Kairos is—'],
      ['crane','You’ll forget him soon enough. The Church will see to that.']],{cap:'The next morning.',mus:'sorrow'}),
    pn('orphanage',[['lucan',0.5,0.7,1,{hurt:1}]],[
      ['lucan','The fire stopped. I remember that now. Everything stopped, and he was the only one moving.'],
      ['lucan','Then the Vices came that night, out of nowhere. Like the sky was angry about it.'],
      ['lucan','He chose Kairos. My life was supposed to be his.'],
      ['lucan','He burned his hands for me. And today I asked him if I knew him.'],
      ['lucan','That night the Church gave me a silver cup. “So the new life can begin clean.” I slept for two days.'],
      ['lucan','When I woke up, he was just… gone from my head. I thought that’s what growing up felt like.'],
      ['lucan','…Not anymore.']],{...NIGHT,fx:'flash',mus:'sorrow'})]},
  {cut:[
    pn('yard',[['ines',0.35,0.7,1],['bram',0.47,0.7,1],['noemi',0.6,0.7,-1],['theo',0.7,0.7,-1]],[
      ['bram','We just let them take him. We stood there.'],
      ['ines','We let them take him so we’d still be free to get him back.'],
      ['theo','The Institute is a fortress. We don’t even know which floor.'],
      ['noemi','Someone in that building knows.'],
      ['n','A knock at the door. Everyone freezes.']],{...NIGHT,cap:'The same night. A Garrison safehouse.',mus:'tense'}),
    pn('yard',[['ines',0.35,0.7,1],['bram',0.47,0.7,1],['noemi',0.6,0.7,-1],['theo',0.7,0.7,-1],['lucan',0.86,0.7,-1]],[
      ['lucan','Third sub-level. The guards change shifts at eleven. That’s your gap.'],
      ['ines','You’re the Chancellor’s son. This afternoon you said “next.”'],
      ['lucan','This afternoon I didn’t remember that he burned his hands pulling me out of a fire.'],
      ['lucan','My father came to adopt him. Not me. Kairos was sick, so he took me instead. And somehow I forgot him.'],
      ['noemi','Kids forget things.'],
      ['lucan','Not like that. Not a whole person.'],
      ['noemi','…No. Not like that.'],
      ['lucan','I’ve been living his life for eleven years. I’m going to start paying it back tonight.'],
      ['bram','…I’m going to hug you.'],
      ['lucan','Please don’t.'],
      ['bram','Later, then.']],{...NIGHT,mus:'warm'})]},
  {join:'lucan'},
  {cut:[pn('lab',[['ines',0.3,0.7,1],['lucan',0.44,0.7,1],['bram',0.58,0.7,-1],['theo',0.7,0.7,-1]],[
      ['ines','Three of us push down the stairs. The rest hold the door behind us.'],
      ['lucan','I know the layout. Follow me, and don’t touch the tanks.'],
      ['theo','What’s in the tanks?'],
      ['lucan','Nothing you want on your hands.']],{...NIGHT,mus:'lab'})]},
  {mission:'assault',pick:3,from:['ines','bram','noemi','theo','lucan'],prefer:['lucan','ines','noemi'],title:'Breakout · outside team',sub:'Kairos is locked inside. Pick three to fight down through the sub-levels.'},
  {cut:[pn('lab',[['kairos',0.5,0.7,1,{glow:1}]],[
      ['th','Alarms. Upstairs. Someone’s coming.'],
      ['th','Okay. The minute. How did it feel? Like holding your breath. Like grabbing the second hand.'],
      ['th','I reach for it. Nothing. I reach again.'],
      ['th','Then, behind the clock on the wall, something I can’t see pulls the second hand back. Gently. Like it’s helping me with a heavy door.'],
      ['th','…Three seconds. Only three. But it’s enough to slip a strap.'],
      ['kairos','That wasn’t only me. Someone’s holding it with me.'],
      ['th','I don’t know who. I’ll say thank you later.'],
      ['th','Guards and cameras in every hall. Stop time, walk through their sight lines. Don’t get greedy.']],{...NIGHT,fx:'flash',mus:'tense'})]},
  {mission:'sneak'},
  {cut:[
    pn('lab',[['kairos',0.36,0.7,1],['dess',0.56,0.7,-1],['lucan',0.74,0.7,-1],['ines',0.84,0.7,-1]],[
      ['n','A sealed steel door. Kairos from one side, the others from the stairs. And Dess, already there, holding her father’s key card. Shaking.'],
      ['kairos','Lucas?'],
      ['lucan','I remembered. The bread. The fire. Your hands.'],
      ['lucan','And I lied to you today. I said “next.”'],
      ['kairos','You said a lot worse when we were nine.'],
      ['lucan','Later. We move. Now.'],
      ['dess','H-he’s going to know it was me.'],
      ['kairos','Then why are you helping?'],
      ['dess','Because that core called me “little star.” And when I told him, he only asked if he could make it say it again.'],
      ['dess','And you told him to go first. Nobody talks to him like that. I almost laughed. He would have made me pay for it.',{if:'c_marr_joke'}],
      ['dess','You said “okay” to him. Everyone does. It’s not your fault. He makes it the easiest word in the room.',{if:'c_marr_comply'}],
      ['dess','You never said a word to him. He hates that. He wrote “subject uncooperative” three times.',{if:'c_marr_silent'}],
      ['kairos','Good.',{if:'c_marr_silent'}]],{...NIGHT,mus:'tense'}),
    pn('lab',[['dess',0.5,0.7,1,{glow:1}],['kairos',0.36,0.7,1]],[
      ['dess','And I’m taking these. They’re not specimens. They’re pieces of people.'],
      ['n','She opens her hand over a core. A small blue figure of light rises out: a little girl, who waves at Dess and floats at her side.'],
      ['dess','Hi. Will you help us get out?'],
      ['th','The girl of light has a freckle under her left eye.'],
      ['th','So does Dess.']],{...NIGHT,mus:'sorrow'})]},
  {join:'dess'},
  {mission:'escape',pick:3,must:['dess'],prefer:['dess','kairos','lucan'],title:'Escape',sub:'Dess must go: her spirits are new. Try switching Lucas to Kairos.'},
  {cut:[pn('street',[['lucan',0.45,0.7,1,{moving:1}],['kairos',0.58,0.7,1,{moving:1}]],[
      ['lucan','I’m sorry.'],
      ['kairos','For what?'],
      ['lucan','For forgetting. For looking at the floor.'],
      ['kairos','You came back. That counts.'],
      ['lucan','It’s the minimum.'],
      ['kairos','It’s more than anybody else ever did.'],
      ['lucan','Then the bar is very low, and I’m going to be very annoying about clearing it.']],{...NIGHT,mus:'warm'})]},

  // ───────── SCENE 10: the Inquisitor
  {sc:'Scene 10 · The Inquisitor',cut:[pn('rooftop',[['cass',0.68,0.66,-1],['kairos',0.4,0.7,1],['ines',0.3,0.7,1]],[
      ['n','Church bells all over the city. On the rooftops of Ash Lane, a figure in grey and red blocks the way, swinging a chained censer that drips fire.'],
      ['cass','Sister Cassie Vire, Office of Correction. The Unwritten comes with me. The rest of you go home.'],
      ['?',[
        {t:'I have a name. It’s Kairos.',f:'c_cass_name',r:[['cass','Not according to the Registry.']]},
        {t:'Do I get a say in this?',r:[['cass','No. That’s rather the point of the Office.']]},
        {t:'Can I at least finish my bread first?',f:'c_cass_joke',r:[['cass','…You don’t have any bread.'],['kairos','Then this is already a terrible night.'],['bram','Ha!'],['cass','Do not laugh, Corporal.']]}],'An Inquisitor. Great.'],
      ['cass','A person with no birth record has no stars. A person with no stars was never meant to exist. The Church corrects mistakes.'],
      ['ines','Generous of you, letting the rest of us go.'],
      ['cass','It isn’t an offer, Sergeant.']],{...NIGHT,mus:'tense'})]},
  {mission:'cass',pick:3,prefer:['kairos','lucan','noemi'],title:'The Inquisitor',sub:'Sister Cassie punishes standing still. Keep moving.'},
  {cut:[pn('rooftop',[['cass',0.62,0.66,-1],['npc',0.82,0.78,-1,{col:VANEC}],['kairos',0.4,0.7,1]],[
      ['vane','Sister. The building beneath them is a lodging house.'],
      ['cass','Yes, Father.'],
      ['vane','Burn it. If they won’t come down, bring the roof down with them.'],
      ['cass','Father, there are families inside.'],
      ['vane','Faithful people. They will be forgiven.'],
      ['n','Cassie hesitates. Too long. Vane sighs, and throws the flask himself.'],
      ['kairos','No— no, no, no!'],
      ['th','The minute. I can’t do this one alone.'],
      ['kairos','Please. Whoever you are. Hold it for me.'],
      ['th','Something answers. The fire stops mid-lick. Twenty seconds. Maybe.']],{...NIGHT,fire:1,fx:'shake',mus:'disaster'})]},
  {mission:'rescue'},
  {fn:nx=>playCutscene([pn('street',[['kairos',0.4,0.7,1],['cass',0.6,0.66,-1],['npc',0.25,0.78,1,{col:TESSA}]],[
      ['n','Time snaps back.'],
      sq.flags.rescue_partial?['th','Most of them are out, coughing on the cobbles. Not all. I ran out of seconds.']:['th','Everyone’s out. Coughing, crying, alive. All of them.'],
      ['cass',sq.flags.rescue_partial?'You went back in. Even when you knew you couldn’t save them all.':'You had a clear way out. You went into the fire instead.'],
      ['kairos','So did you. You didn’t throw that flask. You hesitated.'],
      ['cass','Hesitation is a sin, in my Office.'],
      ['kairos','Then your Office is wrong about something.'],
      ['cass','…Go. Before I remember my orders.']],{...NIGHT,mus:'sorrow'})],nx)},

  // ───────── SCENE 11: the clock tower
  {sc:'Scene 11 · The Clock Tower',cut:[
    pn(CAMPB,[['kairos',0.3,0.7,1],['lucan',0.42,0.68,-1],['ines',0.56,0.7,1],['bram',0.64,0.7,-1],['noemi',0.76,0.68,1],['theo',0.84,0.7,-1],['dess',0.18,0.66,1]],[
      ['lucan','The old clock tower over St. Hesper’s. We used to hide up here. Nobody climbs it anymore.'],
      ['th','Same dead clock. Still 11:59. I used to think it was waiting for me.'],
      ['n','Bram makes toast over a lantern. Theo fixes a drone. Naomi checks everyone’s cuts, one by one.'],
      ['theo','Okay. Recap. Because I need to hear it out loud.'],
      ['theo','Time stopped. A clock made of light gave you its hands as swords. Rifts in the city. A Vice core sang. The Church wants you. The Chancellor wants you.'],
      ['?',[
        {t:'When you say it like that it sounds bad.',r:[['theo','It sounds AMAZING.'],['noemi','Theo.'],['theo','Amazing and bad.']]},
        {t:'Honestly I just want breakfast.',f:'c_breakfast',r:[['bram','I have toast!'],['kairos','Bram. You’re my favorite person.'],['theo','Hey!']]},
        {t:'You forgot “and he has a job now.”',f:'c_job',r:[['theo','Mostly-real-money job. Yes. Welcome aboard, assistant.'],['noemi','Oh no. There are two of them now.']]}],'That’s… a lot, said out loud.'],
      ['kairos','Agnes. At the hospital you said “not inside the walls.” What about outside?'],
      ['ines','Outside, it happened all the time. That’s why there’s nothing out there anymore.'],
      ['theo','Meridian is the last free city on the whole continent of Aster. Everything past the Wall fell before any of us were born.'],
      ['kairos','I’ve read every map in the orphanage library. Twice. They all stop at the same line.'],
      ['theo','The Wall. Nobody’s drawn past it in eighty years.'],
      ['ines','Then you know as much as the Council does. Tomorrow we figure out what’s next. Tonight everyone sleeps.'],
      ['bram','Wait. Kairos. Tessa told her mom you collect favors. Do I owe you one?',{if:'c_joke'}],
      ['kairos','Three. One for the crate, one for carrying me, one for the toast.',{if:'c_joke'}],
      ['bram','That’s fair.',{if:'c_joke'}],
      ['ines','Kairos. Go talk to people. You look like you need it.']],{...NIGHT,fx:'rain',cap:'The clock tower of St. Hesper’s.',mus:'warm'})]},
  {bond:{n:2,title:'Who do you sit with tonight?',sub:'Pick two. Each talk raises that character’s Bond, and Bond makes them stronger in story fights.',choices:[
    {who:['lucan'],title:'Lucas, at the clock face',cut:[pn(CAMPB,[['kairos',0.44,0.68,1],['lucan',0.56,0.68,-1]],[
      ['lucan','You’d make me count the seconds up here, so we knew when inspection was over.'],
      ['kairos','You made ME count. I hated it.'],
      ['lucan','You did it anyway.'],
      ['kairos','Because you asked.'],
      ['lucan','The kitchen fire. It stopped, didn’t it. I didn’t dream that.'],
      ['kairos','It stopped. I heard the ticking, and I pulled you out. I never knew why. I still don’t, not really.'],
      ['lucan','And now you hear it again.'],
      ['kairos','Now I think someone’s been watching me my whole life. I don’t know if that’s better or worse.'],
      ['lucan','I should be the one who…'],
      ['lucan','My father picked you. You should have had my life. The house, the name, all of it.'],
      ['kairos','I didn’t want your life. I wanted my friend back. Took a while.'],
      ['lucan','Then here’s a thing I’m going to say once, and you won’t make it weird.'],
      ['lucan','Whatever comes out of those rifts. The Church. My father. I’m not losing you twice.'],
      ['kairos','That sounds like a vow.'],
      ['lucan','It is one. You’re making it weird.']],{...NIGHT,focus:[0.5,0.55],mus:'sorrow'})]},
    {who:['ines','bram'],title:'Agnes and Bram, by the lantern',cut:[pn(CAMPB,[['ines',0.4,0.68,1],['bram',0.56,0.68,-1],['kairos',0.7,0.7,-1]],[
      ['kairos','How long have you two been partners?'],
      ['bram','Three years. Sarge saved my life at the Eastern Rift.'],
      ['ines','You followed me into the Eastern Rift. I told you to stay.'],
      ['bram','And then you saved my life.'],
      ['ines','Fourteen Vices. He had a shield and no plan.'],
      ['bram','I had a plan. The plan was you.'],
      ['bram','My mom never misses a Sunday. Last week she called me Tomas. That’s my brother.'],
      ['ines','You told me, Bram.'],
      ['bram','I know. She’s just tired. Everybody’s tired.'],
      ['ines','You stayed today too, Kairos. When you could’ve run. That’s worth something to me.',{not:'c_ines_joke'}],
      ['ines','You said you’d run away screaming. You didn’t. I noticed.',{if:'c_ines_joke'}],
      ['kairos','Is that a compliment?'],
      ['ines','It’s an observation. Eat your toast.']],{...NIGHT,focus:[0.5,0.55],mus:'warm'})]},
    {who:['noemi','theo'],title:'Naomi and Theo, at the window',cut:[pn(CAMPB,[['noemi',0.42,0.68,1],['theo',0.56,0.68,-1],['kairos',0.28,0.7,1]],[
      ['kairos','Why do you really write on your arm?'],
      ['noemi','Because people in this city talk themselves out of the scary things. I don’t want to be one of them.'],
      ['theo','She always says the scary thing first.'],
      ['noemi','And he always says the exciting thing first.'],
      ['theo','Between us we say everything.'],
      ['noemi','You also made a concussion joke to a doctor who was checking you for a concussion. Bold.',{if:'c_noemi_joke'}],
      ['kairos','It was Tuesday. I was right.',{if:'c_noemi_joke'}],
      ['noemi','You noticed my shoes, in the ward. Nobody notices my shoes.',{if:'c_noemi_sharp'}],
      ['noemi','If this gets worse, and it will, I’m not leaving him behind. Or you.'],
      ['noemi','That isn’t kindness. I’m just stubborn.']],{...NIGHT,focus:[0.5,0.55],mus:'warm'})]},
    {who:['dess'],title:'Dess, alone with the cores',cut:[pn(CAMPB,[['dess',0.48,0.68,1],['kairos',0.6,0.7,-1]],[
      ['kairos','You left your father tonight. Are you okay?'],
      ['dess','Ask me tomorrow. Or n-next year.'],
      ['dess','I can hear them a little. The memories in the cores. Somebody’s bad day. A song. Rain.'],
      ['dess','The little one who helped us. She has my laugh. I’ve been trying not to think about why.'],
      ['kairos','Dess…'],
      ['dess','Don’t. Please. I’m smart enough to guess. I’m not brave enough to know. Not yet.']],{...NIGHT,focus:[0.5,0.55],mus:'sorrow'})]},
    {who:[],title:'Kairos, alone, at the dead clock',note:'No Bond. A vision.',flag:'vision',cut:[pn(CAMPB,[['kairos',0.5,0.7,1,{glow:1}],['clock',0.5,0.4,1,{scale:1.6,glow:1}]],[
      ['th','I put my hand on the dead clock.'],
      ['th','A man’s hand, writing by candlelight. My handwriting. But older.'],
      ['th','A voice. Mine. “And this time, finish it.”'],
      ['th','Finish what?']],{...FROZEN,fx:'flash',focus:[0.5,0.55]})]},
  ]}},
  {cut:[pn(CAMPB,[['kairos',0.4,0.74,1],['npc',0.62,0.34,-1,{col:LYRAC}]],[
      ['th','Everyone’s asleep. Except me. And the girl sitting on the beam above us.'],
      ['lyra','Go back to sleep.'],
      ['kairos','Who are you?'],
      ['lyra','Someone who’s supposed to be watching. Not talking.'],
      ['kairos','You’re bad at it.'],
      ['lyra','…Tomorrow is the Festival of the Mercy. They hand out cups of water to everyone. Don’t drink anything they give you.'],
      ['kairos','Someone else told me that once.'],
      ['lyra','Then you should’ve listened the first time.'],
      ['th','She drops out the window. Gone. I’m the only one who saw her. Again.']],{...NIGHT,focus:[0.5,0.45],mus:'tense'})]},

  // ───────── SCENE 12: Festival of the Mercy
  {sc:'Scene 12 · Festival of the Mercy',cut:[
    pn('plaza',[['npc',0.5,0.66,1,{col:VANEC}],['npc',0.62,0.7,-1,{col:'#A0607A'}],['npc',0.67,0.74,-1,{col:TESSA,small:1}],['kairos',0.3,0.72,1]],[
      ['th','Banners. Music. Fried dough. The whole city in one square.'],
      ['priest','Drink, and be forgiven. Drink, and let it go.'],
      ['priest','Twenty years ago Heaven wept on this city, and this fountain rose out of the stones. The Church keeps it. The Church shares it.'],
      ['n','A mother in black steps up, eyes red. She drinks. A moment later she is smiling, calm, like someone set down a heavy bag.'],
      ['mother','…I feel lighter. Why did I come here crying?'],
      ['th','She looks happy. She also looks empty.'],
      ['th','Lucas said they gave him a silver cup the night he was adopted. This is the same cup.'],
      ['th','I don’t like that I noticed that.']],{cap:'The next day. Festival Square.',mus:'plaza'}),
    pn('plaza',[['cass',0.45,0.68,1],['npc',0.6,0.66,-1,{col:VANEC}]],[
      ['vane','Sister. The line is waiting.'],
      ['cass','She came here crying for her son, Father. Now she can’t remember why she came.'],
      ['vane','She let go of her pain. That is mercy.'],
      ['cass','Then why does she look so empty?'],
      ['cass','I’ve drunk from that bowl every Sunday since I was six. I can’t remember my mother’s face. The Office calls that grace.'],
      ['vane','It is grace.'],
      ['cass','Then I don’t want any more of it.'],
      ['vane','Cassie.'],
      ['cass','I’ve kept my vows my whole life, Father. That’s exactly why I can’t stay.']],{mus:'tense'}),
    pn('plaza',[['cass',0.6,0.7,-1],['kairos',0.42,0.7,1],['theo',0.3,0.7,1],['noemi',0.22,0.7,1]],[
      ['cass','I don’t want to hear “told you so.”'],
      ['kairos','I wasn’t going to.'],
      ['theo','I was.'],
      ['cass','You said you had no bread. I brought you some. Don’t make it strange.',{if:'c_cass_joke'}],
      ['cass','Last night I hesitated on a roof. I’m done hesitating. If you’ll have me.'],
      ['cass','You told me your name on that roof. Kairos. I wrote it down. The Office never writes down names.',{if:'c_cass_name'}],
      ['kairos','You tried to burn me.'],
      ['cass','I tried to arrest you. Father Vane tried to burn you. Details matter.'],
      ['ines','She’s got a point.']],{mus:'warm'}),
    pn('plaza',[['kairos',0.45,0.72,1],['cass',0.58,0.72,-1]],[
      ['th','The moon slides over the sun. Every clock in the square stops for one second.'],
      ['th','I feel it in my teeth.'],
      ['n','The Seam splits open above the festival. Five rifts at once.']],{...NIGHT,fx:'shake',crack:1,focus:[0.5,0.4],mus:'disaster'})]},
  {join:'cass'},
  {mission:'festival',pick:3,prefer:['kairos','cass','noemi'],title:'Festival of the Mercy',sub:'All eight of you, for the first time. Choose your three.'},
  {cut:[pn('plaza',[['theo',0.4,0.7,1],['ines',0.55,0.7,-1],['lucan',0.68,0.7,-1],['kairos',0.28,0.7,1]],[
      ['kairos','During the fight, I saw it again. Every Vice turned the same way at once.'],
      ['theo','He’s right. They’re not attacking anymore. They’re migrating. All toward one place.'],
      ['ines','Where?'],
      ['theo','The Registry of Births.'],
      ['lucan','Every birth record in Meridian. Every hour, every chart.'],
      ['lucan','And one blank one.']],{...NIGHT,mus:'tense'})]},

  // ───────── SCENE 13: the Registry
  {sc:'Scene 13 · The Registry',cut:[
    pn('office',[['lucan',0.42,0.7,1],['kairos',0.56,0.7,-1],['dess',0.7,0.7,-1]],[
      ['lucan','My father’s keys. He doesn’t know I took them.'],
      ['kairos','He will.'],
      ['lucan','Then I’d better make it worth it.'],
      ['theo','The records go down for floors and floors. They call it the Stacks.'],
      ['ines','Two teams, two routes. Each team opens the gates for the other.']],{...NIGHT,cap:'Night. The Registry of Births.',mus:'tense'})]},
  {split:'stacks',preferA:['kairos','lucan','ines'],preferB:['bram','noemi','theo']},
  {cut:[pn('office',[['kairos',0.5,0.7,1,{glow:1}],['dess',0.66,0.7,-1]],[
      ['n','At the bottom: a vault door. INTAKE WINDOW 1.'],
      ['th','I touch it. And I see myself. Older. Standing at this window, a long line of people behind me, shouting at someone I can’t see.'],
      ['kairos','I’ve been here.'],
      ['dess','You can’t have. Nobody’s allowed down here.'],
      ['kairos','I know. I’ve still been here.']],{...NIGHT,fx:'flash',mus:'tense'})]},

  // ───────── SCENE 14: Intake Window 1
  {sc:'Scene 14 · Intake Window 1',cut:[pn('lobby',[['horaios',0.5,0.32,1],['kairos',0.42,0.78,1],['ines',0.3,0.8,1],['theo',0.6,0.8,-1],['lucan',0.7,0.78,-1]],[
      ['th','A waiting room big enough for a whole city. Rows and rows of empty chairs.'],
      ['th','And at the far end, behind a desk the size of a house, something made of moonlight in a clerk’s coat.'],
      ['horaios','Intake Window 1. Take a number.'],
      ['ines','Is that… the Moon?'],
      ['dess','A Kosmokrator. One of the powers behind the birth charts. I’ve only ever seen the word in my father’s notes.'],
      ['horaios','Name. Hour of birth. Sign here. Next.'],
      ['horaios','…No number. That one has no number. That isn’t allowed.']],{z:1.1,focus:[0.5,0.42],mus:'tense'})]},
  {loss:1,must:['kairos'],prefer:['kairos','lucan','noemi'],title:'Intake Window 1',sub:'Three of you face Horaios. Kairos has to be one of them.'},
  {cut:[
    pn('lobby',[['horaios',0.5,0.3,1,{phase:3}],['kairos',0.44,0.72,1,{moving:1}],['lucan',0.3,0.74,1,{grey:1}],['noemi',0.66,0.74,-1,{grey:1}]],[
      ['th','Everyone else is stamped. Processed. Grey.'],
      ['kairos','Fine. My minute.']],{...FROZEN,fx:'flash',z:1.1,focus:[0.5,0.42]}),
    pn('lobby',[['horaios',0.5,0.3,1,{phase:3,pat:2}],['kairos',0.48,0.62,1]],[
      ['th','And it turns its head. And looks at me. Inside the stopped minute.'],
      ['horaios','You’re not the only one who’s done this before.']],{...FROZEN,z:1.1,focus:[0.5,0.4],zoom:0.15,mus:'tense'}),
    pn('lobby',[['horaios',0.5,0.3,1,{phase:3}],['kairos',0.44,0.7,1,{hurt:1}],['hand',0.56,0.56,-1,{scale:0.75}]],[
      ['horaios','Processing.']],{...FROZEN,fx:'shake',z:1.1,focus:[0.5,0.42],mus:'tense'}),
    pn('lobby',[['horaios',0.52,0.3,1,{phase:3}],['kairos',0.36,0.74,1,{fall:1}],['lucan',0.5,0.66,-1],['hand',0.58,0.56,-1,{closed:1,scale:0.75}]],[
      ['th','Lucas breaks through the grey. I don’t know how. I think it’s the vow.'],
      ['lucan','Not him. Not again.']],{...FROZEN,fx:'flash',z:1.1,focus:[0.5,0.42],mus:'disaster'}),
    pn('black',[['gate',0.62,0.62,1,{scale:1.2}],['lucan',0.6,0.62,-1,{scale:1.4}],['kairos',0.4,0.66,1]],[
      ['n','The hand closes around Lucas instead. Behind Horaios, a gate of white light opens.'],
      ['kairos','LUCAN—'],
      ['horaios','Irregular. But acceptable.'],
      ['lucan','You pulled me out of a fire once. My turn.'],
      ['lucan','Don’t you dare forget me.'],
      ['kairos','I can’t. I never forget anything.'],
      ['lucan','Good. Then come get me.']],{mus:'sorrow'}),
    pn('lobby',[['ines',0.4,0.7,1,{moving:1}],['kairos',0.52,0.72,-1],['bram',0.62,0.7,-1],['theo',0.74,0.7,-1]],[
      ['n','The Gate closes. The hall is just a dark room. The others gasp back to color. And the ceiling starts to come down.'],
      ['ines','Out! Everybody out, now!'],
      ['n','The Registry collapses behind them, with every birth record in Meridian inside it.']],{...NIGHT,fx:'shake',mus:'disaster'}),
