<!doctype html>
<html><head><meta charset="utf-8"><title>Chapter 1 enemy concept sheets</title>
<style>body{margin:0;background:#0B0C12}canvas{display:block}</style></head>
<body><canvas id="cv" width="1600" height="1000"></canvas>
<script>
// Concept sheets for the Chapter 1 Phase 2 enemies. NOT game code: drawing here is a visual reference only.
// Sprites are drawn in world units (1 = 1 world px), rendered small, then scaled up with hard pixels, like the game.
const TAU=Math.PI*2,cv=document.getElementById('cv'),G=cv.getContext('2d');
const OUT='#1A1410',INK='#F6EBD2',GOLD='#FFD166',DIM='#9A8F7E',BG='#0B0C12',PANEL='#151622',LINE='#2A2B3C';
const FONT='"Nunito","Segoe UI",system-ui,sans-serif';
// ── helpers ──────────────────────────────────────────────
const el=(g,x,y,rx,ry,f,s,lw)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);if(f){g.fillStyle=f;g.fill();}if(s){g.strokeStyle=s;g.lineWidth=lw||1;g.stroke();}};
const rc=(g,x,y,w,h,f)=>{g.fillStyle=f;g.fillRect(x,y,w,h);};
const poly=(g,pts,f,s,lw)=>{g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();if(f){g.fillStyle=f;g.fill();}if(s){g.strokeStyle=s;g.lineWidth=lw||1;g.stroke();}};
const ln=(g,x1,y1,x2,y2,s,lw)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=s;g.lineWidth=lw||1;g.stroke();};
const al=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
// render a sprite function into a pixel canvas: res = pixels per world px, box = half-size in world px
function sprite(fn,o,box,res){const n=Math.ceil(box*2*res),c=document.createElement('canvas');c.width=n;c.height=n;const g=c.getContext('2d');
  g.translate(n/2,n/2);g.scale(res,res);g.imageSmoothingEnabled=false;fn(g,o||{});return c;}
function blit(c,x,y,scale,alpha){G.save();G.imageSmoothingEnabled=false;if(alpha!=null)G.globalAlpha=alpha;G.drawImage(c,Math.round(x-c.width*scale/2),Math.round(y-c.height*scale/2),Math.round(c.width*scale),Math.round(c.height*scale));G.restore();}
function silh(c){const s=document.createElement('canvas');s.width=c.width;s.height=c.height;const g=s.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#E8E2D4';g.fillRect(0,0,s.width,s.height);return s;}
function txt(t,x,y,o){o=o||{};G.font=`${o.w||600} ${o.s||13}px ${o.f||FONT}`;G.fillStyle=o.c||INK;G.textAlign=o.a||'left';G.textBaseline=o.b||'alphabetic';G.fillText(t,x,y);}
function wrap(t,x,y,w,o){o=o||{};G.font=`${o.w||500} ${o.s||12}px ${FONT}`;const words=t.split(' ');let line='',yy=y;for(const wd of words){const tt=line?line+' '+wd:wd;if(G.measureText(tt).width>w&&line){txt(line,x,yy,o);line=wd;yy+=(o.lh||16);}else line=tt;}if(line)txt(line,x,yy,o);return yy;}
function panel(x,y,w,h,title){G.fillStyle=PANEL;G.fillRect(x,y,w,h);G.strokeStyle=LINE;G.lineWidth=1;G.strokeRect(x+0.5,y+0.5,w-1,h-1);if(title)txt(title.toUpperCase(),x+12,y+20,{s:11,w:800,c:GOLD});}
function shadow(g,r){el(g,0,r*0.78,r*0.95,r*0.32,'rgba(0,0,0,0.35)');}
function arrow(x1,y1,x2,y2,c){G.strokeStyle=c||GOLD;G.lineWidth=1.5;G.beginPath();G.moveTo(x1,y1);G.lineTo(x2,y2);G.stroke();const a=Math.atan2(y2-y1,x2-x1);G.beginPath();G.moveTo(x2,y2);G.lineTo(x2-8*Math.cos(a-0.4),y2-8*Math.sin(a-0.4));G.lineTo(x2-8*Math.cos(a+0.4),y2-8*Math.sin(a+0.4));G.closePath();G.fillStyle=c||GOLD;G.fill();}

// ── shared detail helpers (world units; sheets render at 4–6 px per unit, the game at ~1.1) ──
const px=(g,x,y,c,s)=>{g.fillStyle=c;g.fillRect(x,y,s||0.5,s||0.5);};
const arcS=(g,x,y,r,a0,a1,c,lw)=>{g.beginPath();g.arc(x,y,r,a0,a1);g.strokeStyle=c;g.lineWidth=lw||0.6;g.stroke();};
function speckle(g,cx,cy,rx,ry,n,cols,seed,sz){let s=seed||7;const R=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<n;i++){const a=R()*TAU,d=Math.sqrt(R());px(g,cx+Math.cos(a)*rx*d,cy+Math.sin(a)*ry*d,cols[i%cols.length],sz||0.5);}}

// ── 4 · CRUMBKIN ─────────────────────────────────────────
// a little loaf that was baked with love: scored crust, flour-dusted cap, oven-mitt paws, a cracked serving plate
const CRUST='#9A6236',CRUSTD='#6E4224',CRUSTL='#C08048',FLOUR='#F1E3C4',CORE_AMB='#F2B45A',PLATE='#D8D2C2',MITT='#C9B48A',MITTD='#9A8460';
function crumbkin(g,o){const r=8,v=o.view||'front',b=(o.bounce||0),dmg=o.dmg,big=o.loaf;const s=big?2:1;g.scale(s,s);
  shadow(g,r);g.translate(0,-b);
  // cracked serving plate with a painted rim
  el(g,0,r*0.62,r*1.0,r*0.34,PLATE,OUT,0.8);el(g,0,r*0.62,r*0.8,r*0.24,null,'#B8A890',0.5);
  ln(g,-3,r*0.45,-1,r*0.8,'#8E887A',0.45);ln(g,-1,r*0.8,0.5,r*0.66,'#8E887A',0.4);
  for(let i=0;i<6;i++){const a=i/6*TAU;px(g,Math.cos(a)*r*0.9-0.25,r*0.62+Math.sin(a)*r*0.3-0.25,'#9FB2CF');}
  // stubby feet peeking out
  if(v!=='back'){el(g,-3,r*0.5,1.3,0.8,CRUSTD,OUT,0.4);el(g,3,r*0.5,1.3,0.8,CRUSTD,OUT,0.4);}
  // the loaf: base crust, baked gradient, darker belly
  el(g,0,0,r*0.98,r*0.8,CRUSTD,OUT,0.9);el(g,0,-0.6,r*0.9,r*0.68,CRUST);el(g,-0.8,-2,r*0.7,r*0.45,CRUSTL);
  speckle(g,0,-1,r*0.8,r*0.6,26,['#7E4C28','#B5794A','#D69A5E'],11);          // baked texture
  // flour-dusted cap (also lifts contrast on dirt)
  el(g,0,-r*0.42,r*0.66,r*0.26,al(FLOUR,0.85));speckle(g,0,-r*0.44,r*0.7,r*0.3,18,[FLOUR,'#FFFFFF'],3);
  if(v!=='back'){
    // three scored cuts, the middle one glowing (the core)
    for(const dx of [-3.6,0,3.6]){g.save();g.translate(dx,-r*0.32);g.rotate(-0.55);el(g,0,0,1.7,0.6,dx===0?CORE_AMB:'#5A3418');if(dx===0){el(g,0,0,1.0,0.32,'#FFE6A3');}g.restore();}
    el(g,0,-r*0.32,3.2,1.8,al(CORE_AMB,0.28));
    // face: two warm dents and a tiny crumb mouth, a little too wide (cute, slightly uncanny)
    if(v==='front'){el(g,-2.5,1,0.9,1.1,OUT);el(g,2.5,1,0.9,1.1,OUT);px(g,-2.7,0.6,'#FFE6A3',0.4);px(g,2.3,0.6,'#FFE6A3',0.4);
      g.beginPath();g.moveTo(-2.2,3.2);g.quadraticCurveTo(0,4.4,2.2,3.2);g.strokeStyle=OUT;g.lineWidth=0.5;g.stroke();}
    else{el(g,2.8,1,0.9,1.1,OUT);px(g,2.6,0.6,'#FFE6A3',0.4);}
  } else {for(const y of [-2.5,-0.5,1.5])ln(g,-4,y,4,y+0.4,'#5A3418',0.5);}
  // oven-mitt paws with quilted stitching
  const mx=v==='side'?[r*0.9]:[-r*1.0,r*1.0];
  for(const x of mx){const y=r*0.1+(o.swing?(x<0?-1.6:1.6):0);el(g,x,y,2.1,1.7,MITT,OUT,0.6);el(g,x+(x<0?-1.2:1.2),y-1,0.9,0.8,MITT,OUT,0.4);ln(g,x-1,y,x+1,y,MITTD,0.35);ln(g,x-0.9,y+0.7,x+0.9,y+0.7,MITTD,0.35);}
  if(dmg){ln(g,-3,-4,-1,-1,'#3E2210',0.7);ln(g,-1,-1,-2,2,'#3E2210',0.6);ln(g,4,-3,5,0,'#3E2210',0.6);px(g,-1.6,-0.4,CORE_AMB,0.6);}
  if(o.flour){for(let i=0;i<9;i++){const a=i*0.75;el(g,Math.cos(a)*(r+2),Math.sin(a)*(r*0.6)-2,0.7,0.7,al(FLOUR,0.85));}}
}
function crumb(g){el(g,0,0,1.7,1.2,CRUST,OUT,0.5);el(g,-0.3,-0.4,0.8,0.45,FLOUR);px(g,0.4,0.1,CORE_AMB,0.5);}

// ── 5 · PAPERLING ────────────────────────────────────────
// a bird folded from unsent letters: layered wing-sheets, an envelope body with a wax seal, ribbon-like paper tails
const PAPER='#E8E2D4',PAPERD='#B8B0A0',PAPERL='#FFFCF0',INKB='#3A5A9A',RULE='#9FB2CF',INKW='#5A6E96';
function wingSheet(g,side,lift,len,shade){g.save();g.scale(side,1);
  poly(g,[[1.5,-1],[len*0.6,-4.2-lift],[len+2.5,-6-lift],[len+1.2,-3.6-lift],[len+2,-2.4-lift],[len*0.75,-0.6-lift*0.5],[len*0.5,2.5]],shade,OUT,0.6);
  poly(g,[[len+2.5,-6-lift],[len+0.8,-5.4-lift],[len+1.6,-4.4-lift]],PAPERD,OUT,0.3);
  ln(g,2.5,-0.5,len-0.5,-2.8-lift,RULE,0.3);ln(g,3,0.8,len*0.75,-0.8-lift*0.6,RULE,0.3);  // ruled lines
  ln(g,len*0.35,-1.5-lift*0.4,len*0.6,1.2,al(OUT,0.5),0.3);g.restore();}                  // fold crease
function paperling(g,o){const r=9,v=o.view||'front',f=o.flap||0,dmg=o.dmg,decoy=o.decoy;
  el(g,0,r*1.05,r*0.75,r*0.22,'rgba(0,0,0,0.28)');g.translate(0,-(o.bob||0)-2);
  const lift=f*2.4;
  if(v==='side'){
    poly(g,[[-r-2,1],[r,-2],[r*0.3,3.5]],PAPER,OUT,0.8);ln(g,-r,1,r-1,-1.5,RULE,0.3);
    wingSheet(g,1,lift,8,PAPERD);wingSheet(g,1,lift*0.6,6,PAPER);
    for(const [dy,c] of [[1.5,PAPER],[3,PAPERD]]){g.beginPath();g.moveTo(-r-1,dy);g.quadraticCurveTo(-r-5,dy+2+f,-r-8,dy-1);g.strokeStyle=c;g.lineWidth=1.1;g.stroke();}
    el(g,1,0,1.4,1.4,INKB,OUT,0.4);
  } else {
    // paper tails: two curling strips of letter (behind)
    for(const [x,c,k] of [[-1.6,PAPERD,1],[1.6,PAPER,-1]]){g.beginPath();g.moveTo(x,4);g.bezierCurveTo(x+k*2,8,x-k*3,10+f,x+k*1,13);g.strokeStyle=OUT;g.lineWidth=1.6;g.stroke();g.strokeStyle=c;g.lineWidth=1.0;g.stroke();}
    // layered wings: back sheets (shade) then front sheets
    wingSheet(g,-1,lift,r+3,PAPERD);wingSheet(g,1,lift,r+3,PAPERD);
    wingSheet(g,-1,lift*0.6,r,PAPER);wingSheet(g,1,lift*0.6,r,PAPER);
    // envelope body with flap
    poly(g,[[0,-r*0.9],[r*0.55,-0.5],[0,r*0.7],[-r*0.55,-0.5]],v==='back'?PAPERD:PAPERL,OUT,0.9);
    if(v!=='back'){poly(g,[[-r*0.5,-0.8],[0,2.2],[r*0.5,-0.8]],null,al(OUT,0.55),0.45);
      // a few words of handwriting that trail off
      ln(g,-2.5,-3.4,1.2,-3.4,INKW,0.35);ln(g,-2.8,-2.3,0.2,-2.3,INKW,0.35);ln(g,-2,-1.2,-0.8,-1.2,INKW,0.35);
      if(!decoy){el(g,0,1.3,2.1,2.1,INKB,OUT,0.55);el(g,0,1.3,1.3,1.3,null,'#7FA0DA',0.35);px(g,-0.7,0.6,'#A8C4F0',0.6);
        for(let i=0;i<6;i++){const a=i/6*TAU;px(g,Math.cos(a)*2.2-0.2,1.3+Math.sin(a)*2.2-0.2,INKB,0.45);}}  // wax drips
      else{ln(g,0,-r*0.9,0,r*0.7,PAPERD,0.5);ln(g,-r*0.55,-0.5,r*0.55,-0.5,PAPERD,0.4);}}
    else{ln(g,-3,-2,3,-2,RULE,0.35);ln(g,-2.5,0.5,2.5,0.5,RULE,0.35);}
  }
  if(dmg){ln(g,1.5,-6,3.5,-2,OUT,0.6);ln(g,3.5,-2,1.5,1,OUT,0.6);rc(g,-7,-3,1.2,1,BG);rc(g,6,-2,1,1.2,BG);}
}
function dart(g){poly(g,[[-4.5,0],[3,-1.4],[4.5,0],[3,1.4]],PAPERL,OUT,0.5);ln(g,-3,0,3,0,RULE,0.3);}

// ── 7 · CANDLEWISP ───────────────────────────────────────
// an old night-watch lantern: aged brass cage, leaded glass with a painted star, a candle stub, a blanket shawl trailing like a ghost
const GLASS='#BFD8E8',BLANK='#7A6E8E',BLANKD='#5E5470',FLAME='#FFD38A',BRASS='#B8925A',BRASSD='#7A5E34',BRASSL='#E0BE80',VERD='#6FA08A';
function candleLink(g,o){g.save();g.setLineDash([1.5,1.5]);g.strokeStyle=al(GOLD,0.95);g.lineWidth=0.9;g.beginPath();g.moveTo(0,-4);g.quadraticCurveTo(o.lx/2,o.ly/2-14,o.lx,o.ly-4);g.stroke();g.setLineDash([]);el(g,o.lx,o.ly,11,7,null,al(GOLD,0.8),0.8);g.restore();candlewisp(g,o);}
function candlewisp(g,o){const r=9,v=o.view||'front',sw=o.sway||0,dmg=o.dmg,out=o.out;
  el(g,2.5,r*1.35,r*0.6,r*0.2,'rgba(0,0,0,0.2)');g.translate(0,-3-sw*0.5);g.rotate(sw*0.06);
  // ghostly trailing shawl: layered, frayed, fading at the hem
  poly(g,[[-5.5,1],[5.5,1],[7,7+sw],[5,10],[3,8],[1,12],[-1,9],[-3,12+sw*0.5],[-5,9],[-7,10-sw]],BLANKD,OUT,0.8);
  poly(g,[[-5,1],[5,1],[5.5,6+sw*0.5],[2,8],[-2,7.5],[-5.5,6-sw*0.5]],BLANK);
  ln(g,-4.5,3.2,4.5,3.2,'#9A8EAE',0.5);ln(g,-4.8,4.4,4.8,4.4,'#5A5070',0.35);                   // woven stripes
  for(const [x,y] of [[-6,10],[-2,11.6],[2,11],[6,9.6]])px(g,x,y,al('#C8C0D8',0.6),0.5);       // fraying threads
  // brass cage: domed cap with a filigree, ring handle, corner posts with verdigris
  poly(g,[[-5,-7],[5,-7],[3.5,-9],[-3.5,-9]],BRASS,OUT,0.7);arcS(g,0,-9,2.2,Math.PI,TAU,BRASSL,0.4);
  el(g,0,-10.8,1.6,1.3,null,BRASS,0.8);px(g,-0.25,-12.4,BRASSD,0.5);
  rc(g,-5,-7,10,1.2,BRASSD);rc(g,-4.5,1.2,9,1.6,BRASS);rc(g,-4.5,2.6,9,0.6,BRASSD);
  // leaded glass panes (light blue), the centre pane painted with a little star
  rc(g,-4.2,-5.8,8.4,7,al(GLASS,0.82));
  for(const x of [-4.4,-1.4,1.4,4.0])rc(g,x,-5.8,0.5,7,BRASSD);rc(g,-4.2,-2.4,8.4,0.4,BRASSD);
  px(g,-4.4,-0.4,VERD,0.6);px(g,4.0,-5,VERD,0.6);
  if(v!=='back'){
    if(!out){el(g,0,-1.8,6.5,7,al(FLAME,0.14));el(g,0,-1.8,2.6,3.6,al(FLAME,0.35));
      rc(g,-0.9,-0.2,1.8,1.6,'#F1E3C4');el(g,0,-1.6,1.2,2.2,FLAME);el(g,0,-1.1,0.55,1.1,'#FFF6DA');}
    else{rc(g,-0.9,-0.2,1.8,1.6,'#F1E3C4');for(let i=0;i<3;i++)ln(g,i*0.4,-0.4-i*1.4,0.8+i*0.3,-1.8-i*1.4,al('#9A9AA2',0.7-i*0.15),0.5);}
    // painted star on the pane (the memory's small comfort)
    poly(g,[[3,-5],[3.3,-4.2],[4,-4.1],[3.45,-3.6],[3.6,-2.9],[3,-3.3],[2.4,-2.9],[2.55,-3.6],[2,-4.1],[2.7,-4.2]],al('#FFE6A3',0.7));
  } else {rc(g,-4.2,-5.8,8.4,7,al(BLANK,0.45));}
  if(v==='side'){rc(g,-4.2,-5.8,2,7,al('#FFFFFF',0.22));}
  if(dmg){ln(g,-3,-5,-1,-2,'#FFFFFF',0.6);ln(g,-1,-2,-2.5,0.5,'#FFFFFF',0.5);px(g,-3.6,-5.6,BG,0.8);}
}

// ── 11 · THE LAST STAND ──────────────────────────────────
// a guardian made of mismatched armour, planted in a doorway stance behind an oversized battered shield;
// helm with a faint ember-lit visor slit, a torn cloak behind, a repaired spear; the ember core is in the chest, hidden by the stance
const IRON='#6E6A66',IROND='#4A4744',IRONL='#9A948C',RUST='#8A4A2A',BANNER='#4A5E7A',BANNERD='#36465E',EMBER='#E0563A',HAFT='#7A5A3A',LEATH='#5A4030';
function laststand(g,o){const r=16,v=o.view||'front',dmg=o.dmg,down=o.down;
  shadow(g,r);
  // torn cloak behind (only edges show from the front)
  poly(g,[[-9,-9],[9,-9],[11,10],[7,8],[4,12],[0,9],[-4,12],[-7,8],[-11,10]],v==='back'?BANNER:BANNERD,OUT,0.8);
  if(v==='back'){ln(g,-6,-4,6,-6,al('#C8D2E0',0.35),0.6);ln(g,-7,2,7,0,al('#C8D2E0',0.25),0.5);}
  // planted legs: greaves, one forward one back (a braced stance)
  rc(g,-6,7,4,7,IROND);rc(g,2,6,4,8,IROND);el(g,-4,9,2,1.3,IRONL,OUT,0.4);el(g,4,8.5,2,1.3,IRONL,OUT,0.4);rc(g,-6.6,13.4,5,2,LEATH);rc(g,1.4,13.4,5,2,LEATH);
  // torso: layered plates, a rusted pauldron, a leather belt with a buckle
  el(g,0,-1,8.5,8,IRON,OUT,1);rc(g,-7,-5,6,6,IROND);rc(g,1,-5,6.5,5,RUST);rc(g,-6,3,12,1.8,LEATH);rc(g,-1,3,2,1.8,'#C9B48A');
  el(g,-8,-5,3.6,3,IRONL,OUT,0.7);el(g,8,-5,3.6,3,RUST,OUT,0.7);
  for(const [x,y] of [[-5,-2],[4,-3],[-2,1]])px(g,x,y,'#C9C2B8',0.6);   // rivets
  // ember core in the chest: from behind (through a gap in the back plate) or when the shield is down
  if(v==='back'||down){el(g,0,-1,3.4,3.4,al(EMBER,0.35));el(g,0,-1,1.9,1.9,EMBER);el(g,-0.5,-1.6,0.6,0.6,'#FFC8A0');if(v==='back')rc(g,-2.5,-4.5,5,1.2,IROND);}
  // helm: rounded with a cheek-guard and a visor slit lit faintly from within
  el(g,0,-12,5.6,4.8,IROND,OUT,0.9);el(g,-1.5,-13.5,2.4,1.4,IRONL);
  if(v!=='back'){rc(g,-3.6,-12.3,7.2,1.3,OUT);rc(g,-3,-12,6,0.6,al(EMBER,0.55));}
  rc(g,-0.5,-17.5,1,1.8,RUST);                                          // a crest stub
  // repaired spear: wrapped grip, a notched head
  const sx=v==='side'?7:10;ln(g,sx,-19,sx+3,12,HAFT,1.5);rc(g,sx+0.6,-6,2.6,2.4,'#C9B48A');ln(g,sx+0.6,-5,sx+3,-5,LEATH,0.4);
  poly(g,[[sx-1.2,-19],[sx,-23],[sx+1.4,-19]],IRONL,OUT,0.5);
  // oversized shield: held forward with a gauntlet over the rim, dented, scored, a faded painted sun
  if(!down&&v!=='back'){g.save();if(v==='side'){g.translate(-10,1);el(g,0,0,4,14,IRON,OUT,1.2);el(g,0.8,0,2.5,12,null,IRONL,0.7);rc(g,1.5,-2,2.5,4,IROND);}
    else{g.translate(-4.5,1);
